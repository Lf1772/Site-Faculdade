<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --gold:#c9a574; --gold-soft:rgba(201,165,116,.16);
  --bg:#0f0d0a; --bg-raised:#171310; --bg-raised-2:#1d1812;
  --text:#e8dfd5; --text-muted:#a99c8c; --accent:#8b7355;
  --success:#6ba587; --success-soft:rgba(107,165,135,.14);
  --warning:#d97706; --warning-soft:rgba(217,119,6,.14);
  --border:rgba(201,165,116,.18); --border-strong:rgba(201,165,116,.34);
  --shadow:0 4px 24px rgba(0,0,0,.35);
  --radius:12px; --radius-sm:8px;
  --font-display:'Playfair Display', Georgia, serif;
  --font-body:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --header-h:68px; --sidebar-w:252px; --toc-w:220px;
}
[data-subject="processo"]{
  --gold:#7fa8c9; --gold-soft:rgba(127,168,201,.16);
  --bg:#0a0d10; --bg-raised:#101519; --bg-raised-2:#141b21;
  --text:#dfe6ec; --text-muted:#8fa0ad; --accent:#557a8b;
  --border:rgba(127,168,201,.18); --border-strong:rgba(127,168,201,.34);
}
[data-subject="obrigacoes"]{
  --gold:#8fbf9f; --gold-soft:rgba(143,191,159,.16);
  --bg:#0a100c; --bg-raised:#101812; --bg-raised-2:#141f18;
  --text:#dfeae2; --text-muted:#8ba394; --accent:#5c8a6c;
  --border:rgba(143,191,159,.18); --border-strong:rgba(143,191,159,.34);
}
[data-subject="penal"]{
  --gold:#c98a8a; --gold-soft:rgba(201,138,138,.16);
  --bg:#100a0a; --bg-raised:#181010; --bg-raised-2:#1f1414;
  --text:#ecdfdf; --text-muted:#ab9494; --accent:#8b5555;
  --border:rgba(201,138,138,.18); --border-strong:rgba(201,138,138,.34);
}
[data-theme="light"]{
  --bg:#faf9f7; --bg-raised:#ffffff; --bg-raised-2:#f3efe8;
  --text:#1a1815; --text-muted:#766a5c;
  --border:rgba(139,115,85,.22); --border-strong:rgba(139,115,85,.4);
  --shadow:0 4px 24px rgba(60,45,25,.1); --gold-soft:rgba(201,165,116,.22);
}
[data-theme="light"][data-subject="processo"]{
  --bg:#f7f9fb; --bg-raised:#fff; --bg-raised-2:#eef3f7;
  --text:#111a20; --text-muted:#5c6a76;
  --gold:#3f6f92; --gold-soft:rgba(63,111,146,.16);
  --border:rgba(63,111,146,.22); --border-strong:rgba(63,111,146,.4);
}
[data-theme="light"][data-subject="obrigacoes"]{
  --bg:#f7fbf8; --bg-raised:#fff; --bg-raised-2:#eef6f0;
  --text:#111a14; --text-muted:#5c7665;
  --gold:#3d7a52; --gold-soft:rgba(61,122,82,.16);
  --border:rgba(61,122,82,.22); --border-strong:rgba(61,122,82,.4);
}
[data-theme="light"][data-subject="penal"]{
  --bg:#fbf8f8; --bg-raised:#fff; --bg-raised-2:#f6eeee;
  --text:#1a1111; --text-muted:#765c5c;
  --gold:#8f3d3d; --gold-soft:rgba(143,61,61,.14);
  --border:rgba(143,61,61,.22); --border-strong:rgba(143,61,61,.4);
}
.badge-comp{background:var(--bg-raised-2); color:var(--text-muted); border:1px dashed var(--border-strong); margin-bottom:8px;}
.comp-note{font-size:12.5px; color:var(--text-muted); border-left:2px solid var(--border-strong); padding-left:10px; margin:0 0 16px;}
.pena{display:inline-block; background:var(--warning-soft); color:var(--warning); font-weight:600; font-size:13px; padding:3px 10px; border-radius:6px; margin:4px 0;}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body); font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased; transition:background .3s ease, color .3s ease;}
h1,h2,h3,h4{font-family:var(--font-display); font-weight:600; margin:0 0 .4em; color:var(--text);}
h1{font-size:46px; line-height:1.08; letter-spacing:-.01em;}
h2{font-size:34px; line-height:1.15;} h3{font-size:26px; line-height:1.2;} h4{font-size:19px; line-height:1.3;}
p{margin:0 0 1em;} a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer; background:none; border:none; color:inherit;}
input,textarea{font-family:inherit;} ul{margin:0; padding:0;} li{list-style:none;}
.muted{color:var(--text-muted);} .small{font-size:14px;}
.eyebrow{font-size:13px; text-transform:uppercase; letter-spacing:.12em; color:var(--gold); font-weight:600; margin:0 0 10px;}
:focus-visible{outline:2px solid var(--gold); outline-offset:2px; border-radius:4px;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001s !important; transition-duration:.001s !important;} }
.icon{display:inline-flex; width:1em; height:1em; vertical-align:-.15em;}
.icon svg{width:100%; height:100%;} button .icon{width:18px; height:18px;}
.only-mobile{display:none;} .only-desktop{display:inline-flex;}
@media (max-width:880px){ .only-mobile{display:inline-flex;} .only-desktop{display:none;} }

.btn{display:inline-flex; align-items:center; gap:8px; padding:13px 22px; border-radius:999px; font-weight:600; font-size:15px; transition:all .15s ease;}
.btn:active{transform:scale(.96);} .btn .icon{width:16px; height:16px;}
.btn-primary{background:var(--gold); color:#0f0d0a;} .btn-primary:hover{filter:brightness(1.12);}
.btn-ghost{background:transparent; border:1px solid var(--border-strong); color:var(--text);}
.btn-ghost:hover{border-color:var(--gold); background:var(--gold-soft);}
.btn-sm{padding:8px 14px; font-size:13px;} .btn[disabled]{opacity:.45; cursor:not-allowed;}
.badge{display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600; padding:4px 10px; border-radius:999px; background:var(--bg-raised-2); color:var(--text-muted); border:1px solid var(--border);}
.badge .icon{width:12px; height:12px;}
.badge-success{background:var(--success-soft); color:var(--success); border-color:transparent;}
.badge-lei{background:var(--gold-soft); color:var(--gold); border-color:transparent; margin-bottom:8px;}
.badge-facil{background:var(--success-soft); color:var(--success); border-color:transparent;}
.badge-medio{background:var(--gold-soft); color:var(--gold); border-color:transparent;}
.badge-dificil{background:var(--warning-soft); color:var(--warning); border-color:transparent;}
.icon-btn{display:inline-flex; align-items:center; justify-content:center; gap:4px; width:38px; height:38px; border-radius:999px; color:var(--text); transition:background .2s ease;}
.icon-btn:hover{background:var(--gold-soft);}
.kbd{font-size:11px; color:var(--text-muted); border:1px solid var(--border); border-radius:5px; padding:1px 5px; margin-left:2px;}
.link-btn{display:inline-flex; align-items:center; gap:4px; color:var(--gold); font-weight:600; font-size:14px; padding:2px 0;}
.link-btn .icon{width:14px; height:14px; transition:transform .2s ease;} .link-btn.open .icon{transform:rotate(90deg);}
.reveal{opacity:0; transform:translateY(14px); transition:opacity .55s ease, transform .55s ease;}
.reveal.in-view{opacity:1; transform:translateY(0);}

.site-header{position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:14px; height:var(--header-h); padding:0 20px; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--border);}
.brand{display:flex; align-items:center; gap:9px; font-family:var(--font-display); font-size:19px; font-weight:600; cursor:pointer;}
.brand-mark{display:inline-flex; width:22px; height:22px; color:var(--gold);}
.brand-dot{color:var(--gold);}
.subject-switch{display:flex; gap:3px; background:var(--bg-raised); border:1px solid var(--border); border-radius:999px; padding:3px; overflow-x:auto;}
.subject-btn{padding:7px 13px; border-radius:999px; font-size:13px; font-weight:600; color:var(--text-muted); white-space:nowrap;}
.subject-btn.active{background:var(--gold-soft); color:var(--gold);}
.header-actions{display:flex; align-items:center; gap:6px; margin-left:auto;}
#btn-search{padding:0 12px; width:auto; gap:8px;}
@media (max-width:820px){ .subject-btn{padding:6px 9px; font-size:11.5px;} .brand span:not(.brand-mark):not(.brand-dot){display:none;} .site-header{gap:8px; padding:0 12px;} }

.layout{display:flex; max-width:1320px; margin:0 auto; align-items:flex-start;}
.sidebar{position:sticky; top:var(--header-h); width:var(--sidebar-w); flex-shrink:0; height:calc(100vh - var(--header-h)); overflow-y:auto; padding:26px 14px; border-right:1px solid var(--border);}
.sidebar-eyebrow{font-size:11.5px; text-transform:uppercase; letter-spacing:.1em; color:var(--text-muted); font-weight:600; margin:18px 12px 8px;}
.sidebar-subject{font-family:var(--font-display); font-size:17px; color:var(--gold); padding:0 12px 4px;}
.nav-list{display:flex; flex-direction:column; gap:2px; margin-bottom:6px;}
.nav-item{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:var(--radius-sm); font-size:14.5px; font-weight:500; color:var(--text-muted); cursor:pointer; transition:all .18s ease;}
.nav-item:hover{background:var(--bg-raised); color:var(--text);}
.nav-item.active{background:var(--gold-soft); color:var(--gold); font-weight:600;}
.nav-num{font-family:var(--font-display); font-size:13px; color:var(--text-muted); width:20px;}
.nav-item.active .nav-num{color:var(--gold);}
.nav-label{flex:1;} .nav-pct{font-size:12px; color:var(--text-muted);}
.tool-item .icon{width:17px; height:17px; color:var(--text-muted);}
.tool-item.active .icon{color:var(--gold);}
.sidebar-backdrop{display:none;} .sidebar-head{display:none;}
.main-content{flex:1; min-width:0; padding:40px 32px 80px;}
.site-footer{max-width:1320px; margin:0 auto; padding:34px 32px 56px; border-top:1px solid var(--border); font-size:13.5px; color:var(--text-muted);}
.site-footer p{margin:0 0 4px;}
@media (max-width:880px){
  .layout{display:block;}
  .sidebar{position:fixed; top:0; left:0; bottom:0; height:100vh; z-index:60; width:284px; background:var(--bg); transform:translateX(-100%); transition:transform .25s ease; box-shadow:var(--shadow);}
  .sidebar.open{transform:translateX(0);}
  .sidebar-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
  .sidebar-backdrop{display:block; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:55; opacity:0; pointer-events:none; transition:opacity .2s ease;}
  .sidebar-backdrop.show{opacity:1; pointer-events:auto;}
  .main-content{padding:26px 16px 64px;}
}
.modal-backdrop{position:fixed; inset:0; z-index:100; display:none; align-items:flex-start; justify-content:center; background:rgba(5,4,3,.6); padding-top:12vh;}
.modal-backdrop.show{display:flex;}
.search-modal{width:min(560px,90vw); background:var(--bg-raised); border:1px solid var(--border-strong); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden;}
.search-input-row{display:flex; align-items:center; gap:10px; padding:16px 18px; border-bottom:1px solid var(--border);}
.search-input-row .icon{color:var(--text-muted); width:18px; height:18px;}
#search-input{flex:1; background:none; border:none; color:var(--text); font-size:16px;} #search-input:focus{outline:none;}
.search-results{max-height:50vh; overflow-y:auto; padding:8px;}
.search-result{display:flex; flex-direction:column; gap:2px; width:100%; text-align:left; padding:10px 12px; border-radius:var(--radius-sm);}
.search-result:hover{background:var(--gold-soft);} .sr-title{font-weight:600; font-size:14.5px;}

.hero{padding:50px 0 34px; max-width:760px;}
.gavel-line{display:block; height:3px; width:64px; background:var(--gold); margin-bottom:18px; transform-origin:left center; animation:gavelDrop .9s cubic-bezier(.2,.9,.2,1) .1s both;}
@keyframes gavelDrop{0%{transform:scaleX(0);opacity:0;}60%{transform:scaleX(1.08);opacity:1;}100%{transform:scaleX(1);opacity:1;}}
.hero-sub{font-size:18px; color:var(--text-muted); max-width:640px;}
.hero-actions{display:flex; gap:14px; margin-top:8px; flex-wrap:wrap;}
.section{padding:50px 0;} .section + .section{border-top:1px solid var(--border);}
.section-title{margin-bottom:8px;} .section-tools{padding-bottom:60px;}
.lesson-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:16px; margin-top:26px;}
.lesson-card{background:var(--bg-raised); border:1px solid var(--border); border-radius:var(--radius); padding:22px; cursor:pointer; transition:all .2s ease;}
.lesson-card:hover{border-color:var(--border-strong); transform:translateY(-2px);}
.lesson-card-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
.lesson-num{font-family:var(--font-display); font-size:26px; color:var(--gold);}
.lesson-card h3{font-size:20px; margin-bottom:8px;}
.tools-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); gap:16px; margin-top:22px;}
.tool-card{background:var(--bg-raised); border:1px solid var(--border); border-radius:var(--radius); padding:22px; cursor:pointer; transition:all .2s ease;}
.tool-card:hover{border-color:var(--border-strong); transform:translateY(-2px);}
.tool-card .icon{width:24px; height:24px; color:var(--gold); margin-bottom:12px;}
.tool-card h4{margin-bottom:6px;}
.mini-progress{height:6px; border-radius:99px; background:var(--bg-raised-2); overflow:hidden;}
.mini-progress-bar{height:100%; background:var(--gold); border-radius:99px; transition:width .4s ease;}

.callout{border-left:3px solid var(--gold); background:var(--gold-soft); padding:14px 18px; border-radius:0 var(--radius-sm) var(--radius-sm) 0; margin:18px 0;}
.callout-warning{border-color:var(--warning); background:var(--warning-soft);}
.callout-success{border-color:var(--success); background:var(--success-soft);}
.styled-list{display:flex; flex-direction:column; gap:10px; margin:16px 0;}
.styled-list li{position:relative; padding-left:22px;}
.styled-list li::before{content:'—'; position:absolute; left:0; color:var(--gold);}
.table-wrap{overflow-x:auto; margin:18px 0;}
.styled-table{width:100%; border-collapse:collapse; font-size:14.5px; min-width:440px;}
.styled-table th,.styled-table td{padding:12px 16px; border-bottom:1px solid var(--border); text-align:left; vertical-align:top;}
.styled-table th{color:var(--gold); font-weight:600; font-size:13px; text-transform:uppercase; letter-spacing:.04em;}
.styled-table tr:last-child td{border-bottom:none;}
.artigo{background:var(--bg-raised); border-left:3px solid var(--border-strong); border-radius:0 var(--radius-sm) var(--radius-sm) 0; padding:14px 18px; margin:16px 0; font-size:14.5px;}
.artigo strong{color:var(--gold); display:block; margin-bottom:4px; font-size:13px; letter-spacing:.03em;}

.lesson-shell{display:flex; gap:44px; align-items:flex-start;}
.lesson-toc{position:sticky; top:calc(var(--header-h) + 26px); width:var(--toc-w); flex-shrink:0; display:flex; flex-direction:column; gap:2px; padding-top:6px;}
.toc-link{padding:7px 0 7px 12px; font-size:14px; color:var(--text-muted); border-left:2px solid var(--border); cursor:pointer;}
.toc-link:hover{color:var(--gold); border-color:var(--gold);}
.toc-progress{margin-top:16px; padding-left:12px;}
.lesson-body{flex:1; min-width:0; max-width:760px;}
.lesson-section{padding:36px 0; border-top:1px solid var(--border);}
.lesson-section:first-of-type{border-top:none; padding-top:8px;}
.section-head{display:flex; justify-content:space-between; align-items:flex-start; gap:14px; margin-bottom:14px;}
.section-head-actions{display:flex; align-items:center; gap:4px; flex-shrink:0;}
.fav-btn.is-fav .icon{color:var(--gold);}
.done-toggle{position:relative; display:flex; align-items:center; gap:6px; cursor:pointer; font-size:13px; color:var(--text-muted);}
.done-toggle input{position:absolute; opacity:0; width:1px; height:1px;}
.done-toggle span{display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px; border-radius:999px; border:1.5px solid var(--border-strong); color:transparent; transition:all .18s ease;}
.done-toggle span .icon{width:15px; height:15px;}
.done-toggle input:checked + span{background:var(--success); border-color:var(--success); color:#0f0d0a;}
.done-toggle-lg{font-size:14.5px; color:var(--text); gap:10px;}
.caracteristicas-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(215px,1fr)); gap:14px; margin:20px 0;}
.carac-card{background:var(--bg-raised); border:1px solid var(--border); border-radius:var(--radius-sm); padding:18px;}
.carac-num{font-family:var(--font-display); color:var(--gold); font-size:13px; letter-spacing:.05em;}
.carac-card h4{margin:6px 0 8px; font-size:17px;}
.exemplos-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(210px,1fr)); gap:14px; margin-top:16px;}
.exemplo-card{background:var(--bg-raised); border:1px solid var(--border); border-radius:var(--radius-sm); padding:18px;}
.exemplo-card h4{font-size:16px; margin-bottom:6px;}
.casos-list{display:flex; flex-direction:column; gap:16px; margin-top:18px;}
.caso-card{display:flex; gap:16px; background:var(--bg-raised); border:1px solid var(--border); border-radius:var(--radius); padding:22px;}
.caso-seal{flex-shrink:0; width:46px; height:46px; color:var(--gold); opacity:.85; display:flex; align-items:center; justify-content:center;}
.caso-content{flex:1; min-width:0;} .caso-content h4{margin-bottom:4px; font-size:18px;}
.caso-detalhes{margin-top:12px; padding-top:12px; border-top:1px dashed var(--border); display:none;}
.caso-detalhes.show{display:block;}
.lesson-complete-row{display:flex; align-items:center; justify-content:space-between; gap:16px; margin-top:22px; flex-wrap:wrap;}
@media (max-width:1080px){ .lesson-toc{display:none;} }
@media (max-width:640px){ .lesson-shell{display:block;} h1{font-size:33px;} h2{font-size:25px;} h3{font-size:20px;} }

.quiz-intro,.quiz-active,.quiz-result{max-width:700px;}
.quiz-progress-row{display:flex; align-items:center; gap:14px; margin-bottom:24px;}
.quiz-progress-row .mini-progress{flex:1;}
.quiz-question{font-size:23px; margin-bottom:22px; font-family:var(--font-display);}
.quiz-options{display:flex; flex-direction:column; gap:10px; margin-bottom:18px;}
.quiz-opt{text-align:left; padding:15px 18px; border:1.5px solid var(--border); border-radius:var(--radius-sm); background:var(--bg-raised); font-size:15px; transition:all .15s ease;}
.quiz-opt:not([disabled]):hover{border-color:var(--gold); background:var(--gold-soft);}
.quiz-opt.is-correct{border-color:var(--success); background:var(--success-soft); font-weight:600;}
.quiz-opt.is-wrong{border-color:var(--warning); background:var(--warning-soft);}
.quiz-opt[disabled]{cursor:default;}
.quiz-review{display:flex; flex-direction:column; gap:12px; margin:24px 0;}
.quiz-review li{display:flex; align-items:flex-start; gap:10px; font-size:14.5px; color:var(--text-muted);}
.quiz-review li .icon{flex-shrink:0; margin-top:3px; width:16px; height:16px;}
.quiz-review li.is-ok .icon{color:var(--success);} .quiz-review li.is-bad .icon{color:var(--warning);}
.level-picker{display:flex; gap:10px; flex-wrap:wrap; margin:20px 0 8px;}
.level-chip{padding:10px 18px; border-radius:999px; border:1.5px solid var(--border); font-size:14px; font-weight:600; color:var(--text-muted);}
.level-chip.active{border-color:var(--gold); background:var(--gold-soft); color:var(--gold);}
.quiz-explain{background:var(--bg-raised-2); border-radius:var(--radius-sm); padding:14px 16px; font-size:14px; color:var(--text-muted); margin-bottom:18px;}
.quiz-explain strong{color:var(--gold);}
.disc-card{background:var(--bg-raised); border:1px solid var(--border); border-radius:var(--radius); padding:22px; margin-bottom:16px;}
.disc-card textarea{width:100%; min-height:110px; background:var(--bg-raised-2); border:1.5px solid var(--border); border-radius:var(--radius-sm); color:var(--text); padding:12px 14px; font-size:14.5px; margin-top:12px;}
.disc-card textarea:focus{outline:none; border-color:var(--gold);}
.disc-model{margin-top:12px; background:var(--gold-soft); border-radius:var(--radius-sm); padding:14px 16px; font-size:14px; display:none;}
.disc-model.show{display:block;}

.flash-toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:22px 0 6px;}
.flash-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(250px,1fr)); gap:16px; margin-top:20px;}
.flashcard{position:relative; height:180px; perspective:1000px; cursor:pointer;}
.flashcard-inner{position:relative; width:100%; height:100%; transition:transform .5s; transform-style:preserve-3d;}
.flashcard.flipped .flashcard-inner{transform:rotateY(180deg);}
.flash-face{position:absolute; inset:0; backface-visibility:hidden; border-radius:var(--radius); border:1px solid var(--border); background:var(--bg-raised); padding:22px 18px; display:flex; align-items:center; justify-content:center; text-align:center; font-size:15px;}
.flash-back{transform:rotateY(180deg); background:var(--gold-soft); font-size:13.5px;}
.flash-tag{position:absolute; top:10px; left:12px; font-size:11px; color:var(--text-muted); letter-spacing:.06em; text-transform:uppercase;}

.stats-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(165px,1fr)); gap:14px; margin:26px 0 30px;}
.stat-card{background:var(--bg-raised); border:1px solid var(--border); border-radius:var(--radius); padding:20px;}
.stat-num{display:block; font-family:var(--font-display); font-size:32px; color:var(--gold); margin-bottom:4px;}
.stat-label{font-size:13px; color:var(--text-muted);}
.charts-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(280px,1fr)); gap:18px; margin-bottom:26px;}
.chart-card{background:var(--bg-raised); border:1px solid var(--border); border-radius:var(--radius); padding:22px;}
.chart-card h4{margin-bottom:14px;} .empty-chart{padding:30px 0; text-align:center;}
.lessons-progress-list{display:flex; flex-direction:column; gap:12px; margin-top:6px;}
.lesson-progress-row{display:grid; grid-template-columns:230px 1fr 50px; align-items:center; gap:12px; font-size:14px;}
.lesson-progress-row .mini-progress{height:8px;}
@media (max-width:560px){ .lesson-progress-row{grid-template-columns:1fr; gap:4px;} }

.mindmap-wrap{position:relative; margin-top:22px;}
.mindmap-controls{position:absolute; top:14px; right:14px; z-index:5; display:flex; flex-direction:column; gap:6px; background:var(--bg-raised); border:1px solid var(--border); border-radius:var(--radius-sm); padding:4px;}
.mindmap-viewport{width:100%; height:560px; overflow:hidden; border-radius:var(--radius); border:1px solid var(--border); background:var(--bg-raised); cursor:grab; touch-action:none;}
.mindmap-viewport.dragging{cursor:grabbing;}
#mm-svg{width:100%; height:100%; display:block;}
.mm-edge{stroke:var(--border-strong); stroke-width:1.4; fill:none;}
.mm-node .mm-hit{fill:transparent;}
.mm-node .mm-dot{fill:var(--bg-raised-2); stroke:var(--gold); stroke-width:1.6; transition:fill .15s ease;}
.mm-node:hover .mm-dot{fill:var(--gold-soft);}
.mm-node text{fill:var(--text); dominant-baseline:middle; font-family:var(--font-body); font-size:13px; font-weight:600; pointer-events:none;}
.mm-node.lvl-0 .mm-dot{fill:var(--gold); stroke:var(--gold);}
.mm-node.lvl-0 text{fill:#0f0d0a; font-size:15px; font-family:var(--font-display);}
.mm-node.lvl-2 .mm-dot{stroke:var(--accent);} .mm-node.lvl-2 text{font-size:11px; font-weight:500;}
.mm-node[data-goto]{cursor:pointer;}
@media (max-width:640px){ .mindmap-viewport{height:420px;} }

.fav-list{display:flex; flex-direction:column; gap:10px; margin-top:24px;}
.fav-card{display:flex; align-items:center; justify-content:space-between; gap:16px; background:var(--bg-raised); border:1px solid var(--border); border-radius:var(--radius-sm); padding:16px 18px;}
.fav-card h4{margin:4px 0 0; font-size:16px;}
.fav-actions{display:flex; align-items:center; gap:6px; flex-shrink:0;}

.cert-section{max-width:720px;}
.cert-form{display:flex; flex-direction:column; gap:12px; max-width:420px; margin:22px 0 34px;}
.field-label{font-size:13px; color:var(--text-muted); font-weight:600;}
.cert-form input{padding:13px 16px; border-radius:var(--radius-sm); border:1.5px solid var(--border-strong); background:var(--bg-raised); color:var(--text); font-size:15px;}
.cert-form input:focus{outline:none; border-color:var(--gold);}
.cert-preview{display:flex; justify-content:center;}
.cert-card{width:100%; max-width:560px; aspect-ratio:1.55/1; background:var(--bg-raised); border:2px solid var(--gold); border-radius:var(--radius); position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:30px;}
.cert-card::before{content:''; position:absolute; inset:14px; border:1px solid var(--border-strong); border-radius:8px;}
.cert-seal{width:40px; height:40px; color:var(--gold); margin-bottom:10px;}
.cert-eyebrow{font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-muted); margin-bottom:6px;}
.cert-name{font-family:var(--font-display); font-size:26px; color:var(--gold); margin-bottom:10px;}
.cert-body{font-size:13.5px; color:var(--text-muted); max-width:400px; margin-bottom:14px;}
.cert-date{font-size:11.5px; color:var(--text-muted); letter-spacing:.04em;}
</style>
</head>
<body>
<div id="app-root"></div>
<script>
const I = {
  scale:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3v18M7 21h10M5 7h14M5 7l-3 6a3 3 0 006 0zM19 7l3 6a3 3 0 01-6 0z"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg>',
  moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 13a9 9 0 11-10-10 7 7 0 0010 10z"/></svg>',
  menu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M4 12l5 5L20 6"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l2.6 5.6 6 .8-4.4 4.2 1.1 6L12 16.8 6.7 19.6l1.1-6L3.4 9.4l6-.8z"/></svg>',
  starFill:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l2.6 5.6 6 .8-4.4 4.2 1.1 6L12 16.8 6.7 19.6l1.1-6L3.4 9.4l6-.8z"/></svg>',
  chevron:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>',
  quiz:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 9a3 3 0 116 0c0 2-3 2.5-3 4"/><circle cx="12" cy="18" r="1" fill="currentColor"/><rect x="3" y="3" width="18" height="18" rx="3"/></svg>',
  cards:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="13" height="14" rx="2"/><path d="M8 3h10a2 2 0 012 2v12"/></svg>',
  chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  map:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="5" cy="12" r="2.5"/><circle cx="19" cy="6" r="2.5"/><circle cx="19" cy="18" r="2.5"/><path d="M7.5 11l9-4M7.5 13l9 4"/></svg>',
  cert:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="9" r="5"/><path d="M9 13.5L8 21l4-2 4 2-1-7.5"/></svg>',
  seal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="5"/><path d="M12 4v2M12 18v2M4 12h2M18 12h2"/></svg>',
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 11l8-7 8 7v8a1 1 0 01-1 1h-4v-6H9v6H5a1 1 0 01-1-1z"/></svg>',
  alert:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 8v5M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg>'
};
const ic = (n,cls='') => `<span class="icon ${cls}">${I[n]}</span>`;
const escAttr = (s='') => String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');

/* ============ MATÉRIA 1 — DIREITO DO TRABALHO ============ */
const TRAB_L = [
{ id:1, title:"Introdução ao Direito do Trabalho", subtitle:"O que é o Direito do Trabalho, qual seu objeto e como ele se organiza.",
 sections:[
  {id:"t1-1", h:"Quem é o trabalhador?", body:`<p>A palavra <strong>trabalhador</strong> é ampla. Nem todos estão submetidos às mesmas regras.</p>
   <div class="table-wrap"><table class="styled-table"><tr><th>Categoria</th><th>Ideia central</th><th>Regime</th></tr>
   <tr><td>Com vínculo empregatício</td><td>Reúne os requisitos da relação de emprego</td><td>CLT e Constituição</td></tr>
   <tr><td>Estatutário</td><td>Cargo público regido por estatuto</td><td>Direito Administrativo e Constitucional</td></tr>
   <tr><td>Sem vínculo</td><td>Presta serviço sem preencher os requisitos</td><td>Direito Civil ou lei especial</td></tr></table></div>
   <div class="callout"><strong>Guarde isto:</strong> todo empregado é trabalhador, mas nem todo trabalhador é empregado.</div>`},
  {id:"t1-2", h:"As três divisões do Direito do Trabalho", body:`<div class="caracteristicas-grid">
   <div class="carac-card"><div class="carac-num">SEGMENTO I</div><h4>Direito Individual</h4><p class="small muted">Relação entre empregado e empregador: contrato, jornada, salário, férias, término.</p></div>
   <div class="carac-card"><div class="carac-num">SEGMENTO II</div><h4>Direito Coletivo</h4><p class="small muted">Categorias profissionais e econômicas: sindicatos, negociação, ACT, CCT.</p></div>
   <div class="carac-card"><div class="carac-num">SEGMENTO III</div><h4>Direito Processual</h4><p class="small muted">Como o conflito tramita na Justiça do Trabalho.</p></div></div>`},
  {id:"t1-3", h:"Fases pré-contratual, contratual e pós-contratual", body:`<p>A proteção não começa no primeiro dia nem termina no último.</p>
   <ul class="styled-list"><li><strong>Pré-contratual:</strong> seleção, discriminação, promessas de emprego.</li>
   <li><strong>Contratual:</strong> prestação efetiva, direitos e deveres em vigor.</li>
   <li><strong>Pós-contratual:</strong> verbas rescisórias, documentos, responsabilidades remanescentes.</li></ul>`},
  {id:"t1-4", h:"Natureza jurídica: privado com intervenção pública", body:`<p>Ramo predominantemente de <strong>Direito Privado</strong>. Mas as partes não têm o mesmo poder de negociação: o empregado depende do salário — é a <strong>hipossuficiência</strong>.</p>
   <div class="callout"><strong>Publicização do Direito Privado:</strong> relação privada intensamente regulada por normas de interesse público, para impedir que a liberdade contratual afaste direitos mínimos.</div>`},
  {id:"t1-5", h:"A CLT e a recepção pela CF/88", body:`<span class="badge badge-lei">Decreto-Lei nº 5.452/1943</span>
   <p>A CLT foi promulgada pelo <strong>Decreto-Lei nº 5.452, de 1º de maio de 1943</strong>.</p>
   <p>Pela <strong>teoria da recepção</strong>, normas anteriores compatíveis continuam válidas. A CLT foi recepcionada com força de <strong>lei ordinária federal</strong>.</p>`},
  {id:"t1-6", h:"O empregador e a proteção contra fraudes", body:`<span class="badge badge-comp">Complemento</span>
   <p class="comp-note">Conteúdo acrescentado para completar o tema — não constava no material de aula.</p>
   <div class="artigo"><strong>CLT, Art. 2º</strong> — Considera-se empregador a empresa, individual ou coletiva, que, assumindo os riscos da atividade econômica, admite, assalaria e dirige a prestação pessoal de serviço.<br><br><strong>CLT, Art. 3º</strong> — Considera-se empregado toda pessoa física que prestar serviços de natureza não eventual a empregador, sob a dependência deste e mediante salário.</div>
   <p>Note que o art. 2º já traz dois dos requisitos vistos na Aula 3: <strong>alteridade</strong> ("assumindo os riscos") e <strong>subordinação</strong> ("dirige a prestação").</p>
   <h4 style="margin-top:22px">Grupo econômico (art. 2º, §§ 2º e 3º)</h4>
   <p>Havendo direção, controle ou administração de outra, ou ainda que apenas coordenadas, as empresas do grupo respondem <strong>solidariamente</strong> pelas obrigações trabalhistas. Após a reforma de 2017, exige-se demonstração do <strong>interesse integrado</strong>, efetiva comunhão de interesses e atuação conjunta — a mera identidade de sócios não basta.</p>
   <h4 style="margin-top:22px">Sucessão trabalhista (arts. 10 e 448)</h4>
   <p>A mudança na propriedade ou na estrutura jurídica da empresa <strong>não afeta</strong> os contratos de trabalho nem os direitos adquiridos dos empregados. O contrato segue com o novo titular.</p>
   <h4 style="margin-top:22px">Poderes do empregador</h4>
   <div class="caracteristicas-grid">
     <div class="carac-card"><div class="carac-num">I</div><h4>Diretivo</h4><p class="small muted">Organizar a atividade e definir como o trabalho será prestado.</p></div>
     <div class="carac-card"><div class="carac-num">II</div><h4>Fiscalizatório</h4><p class="small muted">Controlar a execução — sempre com respeito à intimidade e à dignidade.</p></div>
     <div class="carac-card"><div class="carac-num">III</div><h4>Disciplinar</h4><p class="small muted">Advertência, suspensão (máximo 30 dias) e dispensa por justa causa (art. 482).</p></div>
   </div>
   <div class="artigo"><strong>CLT, Art. 9º</strong> — Serão nulos de pleno direito os atos praticados com o objetivo de desvirtuar, impedir ou fraudar a aplicação dos preceitos contidos na Consolidação.</div>
   <div class="callout"><strong>Por que este artigo importa:</strong> é o suporte legal da primazia da realidade. O art. 9º permite declarar nulo o contrato de fachada — o "PJ" que esconde emprego, a cooperativa fraudulenta — sem depender apenas de construção doutrinária.</div>`},],
 casos:[{t:"Contrato de 'prestação de serviços' que esconde emprego", resumo:"Empresa contrata como PJ, mas a pessoa cumpre horário, recebe ordens e não pode ser substituída.", detalhe:"A nomenclatura do contrato não decide a questão — os fatos concretos serão analisados. Esse raciocínio é formalizado na Aula 2, com a primazia da realidade."},
 {t:"Promessa de contratação desfeita", resumo:"Candidato pede demissão após promessa formal, mas a empresa desiste.", detalhe:"Problema típico da fase pré-contratual: a proteção trabalhista não começa apenas na assinatura do contrato."}]},
{ id:2, title:"Fontes e Princípios", subtitle:"De onde vêm as normas trabalhistas e quais diretrizes orientam sua interpretação.",
 sections:[
  {id:"t2-1", h:"O que são fontes do Direito do Trabalho?", body:`<p><strong>Fontes</strong> são os lugares de onde surgem as regras. A pirâmide da aula:</p>
   <ul class="styled-list"><li>Constituição Federal e Emendas</li><li>Leis Complementares</li><li>Leis Ordinárias</li><li>Decretos e resoluções</li><li>Sentenças normativas</li><li>Convenção Coletiva</li><li>Acordo Coletivo</li><li>Regulamento interno / código de ética</li><li>Contrato individual</li></ul>
   <div class="callout">Acordos e contratos individuais <strong>não podem afastar direitos indisponíveis</strong> nem contrariar normas superiores.</div>`},
  {id:"t2-2", h:"ACT, CCT e sentença normativa", body:`<div class="table-wrap"><table class="styled-table"><tr><th>Instrumento</th><th>Quem celebra</th><th>A quem se aplica</th></tr>
   <tr><td>Acordo Coletivo (ACT)</td><td>Sindicato dos trabalhadores + empresa(s)</td><td>Empregados da(s) empresa(s) signatária(s)</td></tr>
   <tr><td>Convenção Coletiva (CCT)</td><td>Sindicato profissional + sindicato patronal</td><td>Toda a categoria na base territorial</td></tr>
   <tr><td>Sentença normativa</td><td>Justiça do Trabalho, no dissídio coletivo</td><td>Categorias abrangidas</td></tr></table></div>
   <div class="callout"><strong>Prazos:</strong> ACT e CCT, 2 anos. Sentença normativa, segundo a aula, até 4 anos.</div>
   <div class="callout"><strong>Art. 620 da CLT:</strong> as condições do acordo coletivo <strong>prevalecem</strong> sobre as da convenção coletiva.</div>`},
  {id:"t2-3", h:"Classificação das fontes", body:`<div class="caracteristicas-grid">
   <div class="carac-card"><div class="carac-num">I</div><h4>Materiais x Formais</h4><p class="small muted">Materiais: acontecimentos sociais que exigem regulamentação. Formais: as normas criadas.</p></div>
   <div class="carac-card"><div class="carac-num">II</div><h4>Autônomas x Heterônomas</h4><p class="small muted">Autônomas: das partes ou sindicatos. Heterônomas: do Poder Público ou ato unilateral do empregador.</p></div>
   <div class="carac-card"><div class="carac-num">III</div><h4>Estatais, profissionais, internacionais</h4><p class="small muted">Poder Público; partes e sindicatos; tratados e convenções.</p></div></div>
   <div class="callout callout-warning"><strong>Correção:</strong> não é o <em>STJ</em> que aprova convenção internacional trabalhista. A internalização envolve o Executivo e o <strong>Congresso Nacional</strong>.</div>`},
  {id:"t2-4", h:"Princípios do Direito Individual", body:`<p><strong>1. Primazia da realidade</strong> — os fatos prevalecem sobre o escrito.</p>
   <p><strong>2. Continuidade</strong> — pela <strong>Súmula 212 do TST</strong>, é ônus do empregador comprovar o término do contrato.</p>
   <p><strong>3. Proteção</strong> — três desdobramentos:</p>
   <div class="caracteristicas-grid">
   <div class="carac-card"><div class="carac-num">3.a</div><h4>Norma mais favorável</h4><p class="small muted">Aplica-se a mais benéfica. Exceções: arts. 620 e 611-A da CLT.</p></div>
   <div class="carac-card"><div class="carac-num">3.b</div><h4>Condição mais benéfica</h4><p class="small muted">Alteração só se aplica se for mais favorável.</p></div>
   <div class="carac-card"><div class="carac-num">3.c</div><h4>In dubio pro operario</h4><p class="small muted">Norma ambígua: interpretação mais favorável.</p></div></div>
   <p><strong>4. Irredutibilidade salarial</strong> — só por acordo ou convenção coletiva.</p>
   <div class="callout callout-warning"><strong>Correção:</strong> a referência correta é o <strong>art. 7º, VI, da CF</strong>, e não "art. 7, a".</div>`}],
 casos:[{t:"Cláusula de CCT mais benéfica que a lei", resumo:"Convenção concede adicional superior ao legal.", detalhe:"Aplica-se a norma mais favorável em conjunto. Atenção às exceções dos arts. 620 e 611-A."},
 {t:"Impasse na negociação coletiva", resumo:"Sindicatos não chegam a acordo sobre reajuste.", detalhe:"O conflito vai à Justiça do Trabalho no dissídio coletivo. A decisão é a sentença normativa, que fixa cláusulas para toda a coletividade."}]},
{ id:3, title:"Requisitos do vínculo de emprego", subtitle:"Como saber se uma pessoa é empregada ou pertence a outra categoria.",
 sections:[
  {id:"t3-1", h:"Os seis requisitos do vínculo", body:`<p>Os requisitos precisam estar presentes <strong>em conjunto</strong>.</p>
   <div class="table-wrap"><table class="styled-table"><tr><th>Requisito</th><th>Significado</th><th>Pergunta</th></tr>
   <tr><td>Pessoa física</td><td>Serviço prestado por pessoa natural</td><td>Quem realiza pessoalmente?</td></tr>
   <tr><td>Não eventualidade</td><td>Continuidade ou habitualidade</td><td>Existe rotina?</td></tr>
   <tr><td>Subordinação</td><td>O empregador dirige e fiscaliza</td><td>Quem define como e quando?</td></tr>
   <tr><td>Onerosidade</td><td>Troca entre trabalho e remuneração</td><td>Trabalha mediante pagamento?</td></tr>
   <tr><td>Pessoalidade</td><td>Sem substituição livre</td><td>Precisa executar pessoalmente?</td></tr>
   <tr><td>Alteridade</td><td>Riscos do negócio são do empregador</td><td>Quem suporta os prejuízos?</td></tr></table></div>`},
  {id:"t3-2", h:"Trabalhadores semelhantes ao empregado", body:`<p><strong>Eventual</strong> — serviço determinado, sem previsão de retorno. O rótulo "freelancer" não decide nada.</p>
   <p><strong>Autônomo</strong> — assume os riscos, sem subordinação. O <strong>art. 442-B da CLT</strong> admite o contrato mesmo com continuidade e exclusividade.</p>
   <p><strong>Voluntário</strong> — <strong>Lei nº 9.608/1998</strong>: atividade não remunerada, com termo de adesão. Não gera vínculo.</p>
   <p><strong>Avulso</strong> — intermediação obrigatória do sindicato. No porto, o <strong>OGMO</strong>. Leis nº 12.815/2013 e 12.023/2009.</p>
   <div class="table-wrap"><table class="styled-table"><tr><th>Figura</th><th>O que afasta o vínculo</th></tr>
   <tr><td>Eventual</td><td>Falta de continuidade ou expectativa de retorno</td></tr>
   <tr><td>Autônomo</td><td>Ausência de subordinação e assunção dos riscos</td></tr>
   <tr><td>Voluntário</td><td>Ausência de remuneração</td></tr>
   <tr><td>Avulso</td><td>Intermediação e ausência de vínculo permanente</td></tr></table></div>
   <div class="callout"><strong>Art. 7º, XXXIV, CF:</strong> o avulso tem <strong>igualdade de direitos</strong> com o empregado permanente.</div>`},
  {id:"t3-3", h:"Empregado rural", body:`<span class="badge badge-lei">Lei nº 5.889/1973</span>
   <p>Os seis requisitos gerais mais dois:</p>
   <ul class="styled-list"><li><strong>7.</strong> Propriedade rural ou "prédio rústico"</li><li><strong>8.</strong> Empregador que explora atividade agroeconômica</li></ul>
   <p>O decisivo é <strong>a atividade do empregador</strong>, não o local.</p>`},
  {id:"t3-5", h:"Terceirização", body:`<span class="badge badge-comp">Complemento</span>
   <p class="comp-note">Conteúdo acrescentado para completar o tema — não constava no material de aula.</p>
   <span class="badge badge-lei">Lei nº 6.019/1974, com a redação da Lei nº 13.429/2017</span>
   <p>Na terceirização há <strong>três sujeitos</strong>: o trabalhador, a empresa prestadora (que o contrata) e a empresa tomadora (que recebe o serviço). O vínculo de emprego forma-se com a <strong>prestadora</strong>.</p>
   <div class="table-wrap"><table class="styled-table">
   <tr><th>Ponto</th><th>Regra atual</th></tr>
   <tr><td>Atividades terceirizáveis</td><td>Quaisquer atividades, <strong>inclusive a atividade principal</strong> — o STF (ADPF 324 e RE 958.252) declarou lícita a terceirização de atividade-fim</td></tr>
   <tr><td>Responsabilidade do tomador</td><td><strong>Subsidiária</strong>, em regra: o tomador responde se a prestadora não cumprir</td></tr>
   <tr><td>Administração pública</td><td>Súmula 331, V, do TST: responde subsidiariamente apenas se houver <strong>culpa comprovada</strong> na fiscalização do contrato</td></tr>
   <tr><td>Isonomia</td><td>Assegurados aos terceirizados os mesmos serviços de alimentação, transporte, atendimento médico e sanitário do tomador</td></tr></table></div>
   <div class="callout callout-warning"><strong>Onde o vínculo se desloca:</strong> havendo <strong>pessoalidade e subordinação direta</strong> em relação ao tomador, a terceirização é fraudulenta e o vínculo se forma diretamente com ele — aplicação conjunta dos arts. 3º e 9º da CLT. É a lógica da <strong>Súmula 331, I e III, do TST</strong>.</div>`},
  {id:"t3-4", h:"Casos concretos", body:`<div class="exemplos-grid">
   <div class="exemplo-card"><h4>Ana</h4><p class="small muted">Segunda a sexta, horário do gerente, salário mensal, sem substituta.</p><span class="badge badge-success">Vínculo</span></div>
   <div class="exemplo-card"><h4>Bruno</h4><p class="small muted">Serviço específico, decide como executar, vários clientes.</p><span class="badge">Autônomo/eventual</span></div>
   <div class="exemplo-card"><h4>Carla</h4><p class="small muted">2h semanais não remuneradas, termo de adesão.</p><span class="badge">Voluntária</span></div>
   <div class="exemplo-card"><h4>Diego</h4><p class="small muted">Intermediação, tomadores diferentes.</p><span class="badge">Avulso</span></div>
   <div class="exemplo-card"><h4>Rosa</h4><p class="small muted">Fazenda, salário, ordens, atividade agroeconômica.</p><span class="badge badge-success">Rural</span></div></div>`}],

{ id:4, title:"Doméstico, aprendiz e estagiário", subtitle:"Três categorias com regras próprias — e a pergunta central: quem é empregado?",

  {id:"t4-1", h:"Empregado doméstico", body:`<span class="badge badge-lei">LC nº 150/2015</span>
   <p>Pessoa física que presta serviços de forma <strong>contínua, subordinada, onerosa e pessoal</strong>, sem finalidade lucrativa, no âmbito residencial, por <strong>mais de dois dias por semana</strong>.</p>
   <p>A jurisprudência considera empregador <strong>todos que vivem na residência e se beneficiam da mão de obra</strong>.</p>
   <div class="callout">O <strong>art. 19 da LC 150/2015</strong> autoriza a aplicação <strong>subsidiária da CLT</strong> nos casos omissos.</div>`},
  {id:"t4-2", h:"Aprendiz", body:`<span class="badge badge-lei">CLT, arts. 428 a 433</span>
   <p>O aprendiz <strong>é empregado</strong>, com contrato especial de formação técnico-profissional.</p>
   <ul class="styled-list"><li><strong>Idade:</strong> 14 a 24 anos incompletos — sem limite para PcD</li>
   <li><strong>Forma:</strong> escrito, prazo determinado, máximo 2 anos</li>
   <li><strong>Cota:</strong> 5% a 15% dos empregados</li>
   <li><strong>Jornada:</strong> até 6h; até 8h se computadas as horas de curso</li></ul>
   <div class="callout callout-warning"><strong>Correção:</strong> proibido trabalho a menores de 16, <strong>salvo aprendiz a partir dos 14 anos</strong>.</div>`},
  {id:"t4-3", h:"Estagiário", body:`<span class="badge badge-lei">Lei nº 11.788/2008</span>
   <p><strong>Ato educativo escolar supervisionado</strong>. <strong>Não gera vínculo</strong> se cumpridos os requisitos.</p>
   <ul class="styled-list"><li>Não obrigatório: bolsa e vale-transporte obrigatórios</li>
   <li>Duração: até 2 anos na mesma concedente</li>
   <li>Recesso: 30 dias após 1 ano</li>
   <li>Provas: redução de ao menos 50% da carga horária</li></ul>
   <div class="table-wrap"><table class="styled-table"><tr><th>Perfil</th><th>Jornada máxima</th></tr>
   <tr><td>Educação especial / fundamental profissionalizante</td><td>4h / 20h semanais</td></tr>
   <tr><td>Superior, médio profissional e médio regular</td><td>6h / 30h semanais</td></tr>
   <tr><td>Sem aula presencial (previsto no projeto)</td><td>8h / 40h semanais</td></tr></table></div>

 {aula:2, f:"Fontes materiais x formais", b:"Materiais: acontecimentos sociais que exigem regulamentação. Formais: as normas criadas."},
 {aula:2, f:"Fontes autônomas x heterônomas", b:"Autônomas: partes ou sindicatos. Heterônomas: Poder Público ou ato unilateral do empregador."},
 {aula:2, f:"O que é primazia da realidade?", b:"'Contrato-realidade': os fatos prevalecem sobre a forma escrita e sobre o nome do contrato."},
 {aula:2, f:"O que diz a Súmula 212 do TST?", b:"É ônus do empregador comprovar o término do contrato, a data e a modalidade de extinção."},
 {aula:2, f:"Os três desdobramentos da proteção", b:"Norma mais favorável, condição mais benéfica e in dubio pro operario."},
 {aula:2, f:"Fundamento da irredutibilidade salarial", b:"Art. 7º, VI, da CF — redução só por acordo ou convenção coletiva."},
 {aula:3, f:"Os 6 requisitos do vínculo", b:"Pessoa física, não eventualidade, subordinação, onerosidade, pessoalidade e alteridade."},
 {aula:3, f:"O que é alteridade?", b:"Os riscos econômicos da atividade pertencem ao empregador."},
 {aula:3, f:"O que é pessoalidade?", b:"O trabalhador deve executar o serviço pessoalmente, sem substituição livre."},
 {aula:3, f:"O que diz o art. 442-B da CLT?", b:"O contrato de autônomo que preencher os requisitos legais não caracteriza emprego, mesmo com exclusividade e continuidade."},
 {aula:3, f:"Trabalho voluntário (Lei 9.608/98)", b:"Atividade não remunerada a entidade sem fins lucrativos, com termo de adesão. Não gera vínculo."},
 {aula:3, f:"O que é o OGMO?", b:"Órgão Gestor de Mão de Obra — gestão da mão de obra portuária avulsa."},
 {aula:3, f:"Direito constitucional do avulso", b:"Art. 7º, XXXIV, CF: igualdade de direitos com o trabalhador de vínculo permanente."},
 {aula:3, f:"Requisitos extras do empregado rural", b:"Propriedade rural ou prédio rústico, e exploração de atividade agroeconômica (Lei 5.889/73)."},
 {aula:4, f:"Requisitos do empregado doméstico", b:"Pessoa física, continuidade (+2 dias/semana), subordinação, onerosidade, pessoalidade, âmbito residencial e finalidade não lucrativa."},
 {aula:4, f:"O que diz o art. 19 da LC 150/2015?", b:"Autoriza a aplicação subsidiária da CLT nos casos omissos do trabalho doméstico."},
 {aula:4, f:"Faixa etária da aprendizagem", b:"14 a 24 anos incompletos — sem limite máximo para aprendiz com deficiência."},
 {aula:4, f:"Cota legal de aprendizes", b:"5% a 15% dos empregados cujas funções demandem formação técnico-profissional."},
 {aula:4, f:"Jornada do aprendiz", b:"Até 6h diárias; até 8h se computadas as horas de curso."},
 {aula:4, f:"Quem assina o Termo de Compromisso de Estágio?", b:"Estagiário, instituição de ensino e parte concedente — e o agente de integração, se houver."},
 {aula:4, f:"Jornadas do estágio", b:"4h/20h (educação especial); 6h/30h (superior e médio); 8h/40h sem aula presencial."},
 {aula:4, f:"O que diz o art. 15 da Lei do Estágio?", b:"Violação das regras acarreta vínculo com a parte concedente, salvo na administração pública."}];
