<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --gold:#c9a574; --gold-soft:rgba(201,165,116,.16);
  --bg:#0f0d0a; --bg-raised:#171310; --bg-raised-2:#1d1812;
  --text:#e8dfd5; --text-muted:#a99c8c; --accent:#8b7355;
  --success:#6ba587; --success-soft:rgba(107,165,135,.14);
  --warning:#d97706; --warning-soft:rgba(217,119,6,.14);
  --border:rgba(201,165,116,.18); --border-strong:rgba(201,165,116,.34);
  --shadow:0 4px 24px rgba(0,0,0,.35);
  --radius:12px; --radius-sm:8px;
  --font-display:'Playfair Display', Georgia, serif;
  --font-body:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --header-h:68px; --sidebar-w:252px; --toc-w:220px;
}
[data-subject="processo"]{
  --gold:#7fa8c9; --gold-soft:rgba(127,168,201,.16);
  --bg:#0a0d10; --bg-raised:#101519; --bg-raised-2:#141b21;
  --text:#dfe6ec; --text-muted:#8fa0ad; --accent:#557a8b;
  --border:rgba(127,168,201,.18); --border-strong:rgba(127,168,201,.34);
}
[data-subject="obrigacoes"]{
  --gold:#8fbf9f; --gold-soft:rgba(143,191,159,.16);
  --bg:#0a100c; --bg-raised:#101812; --bg-raised-2:#141f18;
  --text:#dfeae2; --text-muted:#8ba394; --accent:#5c8a6c;
  --border:rgba(143,191,159,.18); --border-strong:rgba(143,191,159,.34);
}
[data-subject="penal"]{
  --gold:#c98a8a; --gold-soft:rgba(201,138,138,.16);
  --bg:#100a0a; --bg-raised:#181010; --bg-raised-2:#1f1414;
  --text:#ecdfdf; --text-muted:#ab9494; --accent:#8b5555;
  --border:rgba(201,138,138,.18); --border-strong:rgba(201,138,138,.34);
}
[data-theme="light"]{
  --bg:#faf9f7; --bg-raised:#ffffff; --bg-raised-2:#f3efe8;
  --text:#1a1815; --text-muted:#766a5c;
  --border:rgba(139,115,85,.22); --border-strong:rgba(139,115,85,.4);
  --shadow:0 4px 24px rgba(60,45,25,.1); --gold-soft:rgba(201,165,116,.22);
}
[data-theme="light"][data-subject="processo"]{
  --bg:#f7f9fb; --bg-raised:#fff; --bg-raised-2:#eef3f7;
  --text:#111a20; --text-muted:#5c6a76;
  --gold:#3f6f92; --gold-soft:rgba(63,111,146,.16);
  --border:rgba(63,111,146,.22); --border-strong:rgba(63,111,146,.4);
}
[data-theme="light"][data-subject="obrigacoes"]{
  --bg:#f7fbf8; --bg-raised:#fff; --bg-raised-2:#eef6f0;
  --text:#111a14; --text-muted:#5c7665;
  --gold:#3d7a52; --gold-soft:rgba(61,122,82,.16);
  --border:rgba(61,122,82,.22); --border-strong:rgba(61,122,82,.4);
}
[data-theme="light"][data-subject="penal"]{
  --bg:#fbf8f8; --bg-raised:#fff; --bg-raised-2:#f6eeee;
  --text:#1a1111; --text-muted:#765c5c;
  --gold:#8f3d3d; --gold-soft:rgba(143,61,61,.14);
  --border:rgba(143,61,61,.22); --border-strong:rgba(143,61,61,.4);
}
.badge-comp{background:var(--bg-raised-2); color:var(--text-muted); border:1px dashed var(--border-strong); margin-bottom:8px;}
.comp-note{font-size:12.5px; color:var(--text-muted); border-left:2px solid var(--border-strong); padding-left:10px; margin:0 0 16px;}
.pena{display:inline-block; background:var(--warning-soft); color:var(--warning); font-weight:600; font-size:13px; padding:3px 10px; border-radius:6px; margin:4px 0;}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body); font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased; transition:background .3s ease, color .3s ease;}
h1,h2,h3,h4{font-family:var(--font-display); font-weight:600; margin:0 0 .4em; color:var(--text);}
h1{font-size:46px; line-height:1.08; letter-spacing:-.01em;}
h2{font-size:34px; line-height:1.15;} h3{font-size:26px; line-height:1.2;} h4{font-size:19px; line-height:1.3;}
p{margin:0 0 1em;} a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer; background:none; border:none; color:inherit;}
input,textarea{font-family:inherit;} ul{margin:0; padding:0;} li{list-style:none;}
.muted{color:var(--text-muted);} .small{font-size:14px;}
.eyebrow{font-size:13px; text-transform:uppercase; letter-spacing:.12em; color:var(--gold); font-weight:600; margin:0 0 10px;}
:focus-visible{outline:2px solid var(--gold); outline-offset:2px; border-radius:4px;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001s !important; transition-duration:.001s !important;} }
.icon{display:inline-flex; width:1em; height:1em; vertical-align:-.15em;}
.icon svg{width:100%; height:100%;} button .icon{width:18px; height:18px;}
.only-mobile{display:none;} .only-desktop{display:inline-flex;}
@media (max-width:880px){ .only-mobile{display:inline-flex;} .only-desktop{display:none;} }

.btn{display:inline-flex; align-items:center; gap:8px; padding:13px 22px; border-radius:999px; font-weight:600; font-size:15px; transition:all .15s ease;}
.btn:active{transform:scale(.96);} .btn .icon{width:16px; height:16px;}
.btn-primary{background:var(--gold); color:#0f0d0a;} .btn-primary:hover{filter:brightness(1.12);}
.btn-ghost{background:transparent; border:1px solid var(--border-strong); color:var(--text);}
.btn-ghost:hover{border-color:var(--gold); background:var(--gold-soft);}
.btn-sm{padding:8px 14px; font-size:13px;} .btn[disabled]{opacity:.45; cursor:not-allowed;}
.badge{display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600; padding:4px 10px; border-radius:999px; background:var(--bg-raised-2); color:var(--text-muted); border:1px solid var(--border);}
.badge .icon{width:12px; height:12px;}
.badge-success{background:var(--success-soft); color:var(--success); border-color:transparent;}
.badge-lei{background:var(--gold-soft); color:var(--gold); border-color:transparent; margin-bottom:8px;}
.badge-facil{background:var(--success-soft); color:var(--success); border-color:transparent;}
.badge-medio{background:var(--gold-soft); color:var(--gold); border-color:transparent;}
.badge-dificil{background:var(--warning-soft); color:var(--warning); border-color:transparent;}
.icon-btn{display:inline-flex; align-items:center; justify-content:center; gap:4px; width:38px; height:38px; border-radius:999px; color:var(--text); transition:background .2s ease;}
.icon-btn:hover{background:var(--gold-soft);}
.kbd{font-size:11px; color:var(--text-muted); border:1px solid var(--border); border-radius:5px; padding:1px 5px; margin-left:2px;}
.link-btn{display:inline-flex; align-items:center; gap:4px; color:var(--gold); font-weight:600; font-size:14px; padding:2px 0;}
.link-btn .icon{width:14px; height:14px; transition:transform .2s ease;} .link-btn.open .icon{transform:rotate(90deg);}
.reveal{opacity:0; transform:translateY(14px); transition:opacity .55s ease, transform .55s ease;}
.reveal.in-view{opacity:1; transform:translateY(0);}

.site-header{position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:14px; height:var(--header-h); padding:0 20px; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--border);}
.brand{display:flex; align-items:center; gap:9px; font-family:var(--font-display); font-size:19px; font-weight:600; cursor:pointer;}
.brand-mark{display:inline-flex; width:22px; height:22px; color:var(--gold);}
.brand-dot{color:var(--gold);}
.subject-switch{display:flex; gap:3px; background:var(--bg-raised); border:1px solid var(--border); border-radius:999px; padding:3px; overflow-x:auto;}
.subject-btn{padding:7px 13px; border-radius:999px; font-size:13px; font-weight:600; color:var(--text-muted); white-space:nowrap;}
.subject-btn.active{background:var(--gold-soft); color:var(--gold);}
.header-actions{display:flex; align-items:center; gap:6px; margin-left:auto;}
#btn-search{padding:0 12px; width:auto; gap:8px;}
@media (max-width:820px){ .subject-btn{padding:6px 9px; font-size:11.5px;} .brand span:not(.brand-mark):not(.brand-dot){display:none;} .site-header{gap:8px; padding:0 12px;} }

.layout{display:flex; max-width:1320px; margin:0 auto; align-items:flex-start;}
.sidebar{position:sticky; top:var(--header-h); width:var(--sidebar-w); flex-shrink:0; height:calc(100vh - var(--header-h)); overflow-y:auto; padding:26px 14px; border-right:1px solid var(--border);}
.sidebar-eyebrow{font-size:11.5px; text-transform:uppercase; letter-spacing:.1em; color:var(--text-muted); font-weight:600; margin:18px 12px 8px;}
.sidebar-subject{font-family:var(--font-display); font-size:17px; color:var(--gold); padding:0 12px 4px;}
.nav-list{display:flex; flex-direction:column; gap:2px; margin-bottom:6px;}
.nav-item{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:var(--radius-sm); font-size:14.5px; font-weight:500; color:var(--text-muted); cursor:pointer; transition:all .18s ease;}
.nav-item:hover{background:var(--bg-raised); color:var(--text);}
.nav-item.active{background:var(--gold-soft); color:var(--gold); font-weight:600;}
.nav-num{font-family:var(--font-display); font-size:13px; color:var(--text-muted); width:20px;}
.nav-item.active .nav-num{color:var(--gold);}
.nav-label{flex:1;} .nav-pct{font-size:12px; color:var(--text-muted);}
.tool-item .icon{width:17px; height:17px; color:var(--text-muted);}
.tool-item.active .icon{color:var(--gold);}
.sidebar-backdrop{display:none;} .sidebar-head{display:none;}
.main-content{flex:1; min-width:0; padding:40px 32px 80px;}
.site-footer{max-width:1320px; margin:0 auto; padding:34px 32px 56px; border-top:1px solid var(--border); font-size:13.5px; color:var(--text-muted);}
.site-footer p{margin:0 0 4px;}
.site-footer a{color:var(--gold); text-decoration:underline;}
@media (max-width:880px){
  .layout{display:block;}
  .sidebar{position:fixed; top:0; left:0; bottom:0; height:100vh; z-index:60; width:284px; background:var(--bg); transform:translateX(-100%); transition:transform .25s ease; box-shadow:var(--shadow);}
  .sidebar.open{transform:translateX(0);}
  .sidebar-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
  .sidebar-backdrop{display:block; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:55; opacity:0; pointer-events:none; transition:opacity .2s ease;}
  .sidebar-backdrop.show{opacity:1; pointer-events:auto;}
  .main-content{padding:26px 16px 64px;}
}
.modal-backdrop{position:fixed; inset:0; z-index:100; display:none; align-items:flex-start; justify-content:center; background:rgba(5,4,3,.6); padding-top:12vh;}
.modal-backdrop.show{display:flex;}
.search-modal{width:min(560px,90vw); background:var(--bg-raised); border:1px solid var(--border-strong); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden;}
.search-input-row{display:flex; align-items:center; gap:10px; padding:16px 18px; border-bottom:1px solid var(--border);}
.search-input-row .icon{color:var(--text-muted); width:18px; height:18px;}
#search-input{flex:1; background:none; border:none; color:var(--text); font-size:16px;} #search-input:focus{outline:none;}
.search-results{max-height:50vh; overflow-y:auto; padding:8px;}
.search-result{display:flex; flex-direction:column; gap:2px; width:100%; text-align:left; padding:10px 12px; border-radius:var(--radius-sm);}
.search-result:hover{background:var(--gold-soft);} .sr-title{font-weight:600; font-size:14.5px;}

.hero{padding:50px 0 34px; max-width:760px;}
.gavel-line{display:block; height:3px; width:64px; background:var(--gold); margin-bottom:18px; transform-origin:left center; animation:gavelDrop .9s cubic-bezier(.2,.9,.2,1) .1s both;}
@keyframes gavelDrop{0%{transform:scaleX(0);opacity:0;}60%{transform:scaleX(1.08);opacity:1;}100%{transform:scaleX(1);opacity:1;}}
.hero-sub{font-size:18px; color:var(--text-muted); max-width:640px;}
.hero-actions{display:flex; gap:14px; margin-top:8px; flex-wrap:wrap;}
.section{padding:50px 0;} .section + .section{border-top:1px solid var(--border);}
.section-title{margin-bottom:8px;} .section-tools{padding-bottom:60px;}
.lesson-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:16px; margin-top:26px;}
.lesson-card{background:var(--bg-raised); border:1px solid var(--border); border-radius:var(--radius); padding:22px; cursor:pointer; transition:all .2s ease;}
.lesson-card:hover{border-color:var(--border-strong); transform:translateY(-2px);}
.lesson-card-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
.lesson-num{font-family:var(--font-display); font-size:26px; color:var(--gold);}
.lesson-card h3{font-size:20px; margin-bottom:8px;}
.tools-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); gap:16px; margin-top:22px;}
.tool-card{background:var(--bg-raised); border:1px solid var(--border); border-radius:var(--radius); padding:22px; cursor:pointer; transition:all .2s ease;}
.tool-card:hover{border-color:var(--border-strong); transform:translateY(-2px);}
.tool-card .icon{width:24px; height:24px; color:var(--gold); margin-bottom:12px;}
.tool-card h4{margin-bottom:6px;}
.mini-progress{height:6px; border-radius:99px; background:var(--bg-raised-2); overflow:hidden;}
.mini-progress-bar{height:100%; background:var(--gold); border-radius:99px; transition:width .4s ease;}

.callout{border-left:3px solid var(--gold); background:var(--gold-soft); padding:14px 18px; border-radius:0 var(--radius-sm) var(--radius-sm) 0; margin:18px 0;}
.callout-warning{border-color:var(--warning); background:var(--warning-soft);}
.callout-success{border-color:var(--success); background:var(--success-soft);}
.styled-list{display:flex; flex-direction:column; gap:10px; margin:16px 0;}
.styled-list li{position:relative; padding-left:22px;}
.styled-list li::before{content:'—'; position:absolute; left:0; color:var(--gold);}
.table-wrap{overflow-x:auto; margin:18px 0;}
.styled-table{width:100%; border-collapse:collapse; font-size:14.5px; min-width:440px;}
.styled-table th,.styled-table td{padding:12px 16px; border-bottom:1px solid var(--border); text-align:left; vertical-align:top;}
.styled-table th{color:var(--gold); font-weight:600; font-size:13px; text-transform:uppercase; letter-spacing:.04em;}
.styled-table tr:last-child td{border-bottom:none;}
.artigo{background:var(--bg-raised); border-left:3px solid var(--border-strong); border-radius:0 var(--radius-sm) var(--radius-sm) 0; padding:14px 18px; margin:16px 0; font-size:14.5px;}
.artigo strong{color:var(--gold); display:block; margin-bottom:4px; font-size:13px; letter-spacing:.03em;}

.lesson-shell{display:flex; gap:44px; align-items:flex-start;}
.lesson-toc{position:sticky; top:calc(var(--header-h) + 26px); width:var(--toc-w); flex-shrink:0; display:flex; flex-direction:column; gap:2px; padding-top:6px;}
.toc-link{padding:7px 0 7px 12px; font-size:14px; color:var(--text-muted); border-left:2px solid var(--border); cursor:pointer;}
.toc-link:hover{color:var(--gold); border-color:var(--gold);}
.toc-progress{margin-top:16px; padding-left:12px;}
.lesson-body{flex:1; min-width:0; max-width:760px;}
.lesson-section{padding:36px 0; border-top:1px solid var(--border);}
.lesson-section:first-of-type{border-top:none; padding-top:8px;}
.section-head{display:flex; justify-content:space-between; align-items:flex-start; gap:14px; margin-bottom:14px;}
.fav-btn.is-fav .icon{color:var(--gold);}
.done-toggle{position:relative; display:flex; align-items:center; gap:6px; cursor:pointer; font-size:13px; color:var(--text-muted);}
.done-toggle input{position:absolute; opacity:0; width:1px; height:1px;}
.done-toggle span{display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px; border-radius:999px; border:1.5px solid var(--border-strong); color:transparent; transition:all .18s ease;}
.done-toggle span .icon{width:15px; height:15px;}
.done-toggle input:checked + span{background:var(--success); border-color:var(--success); color:#0f0d0a;}
.done-toggle-lg{font-size:14.5px; color:var(--text); gap:10px;}
.section-foot-actions{display:flex; align-items:center; justify-content:flex-end; gap:16px; margin-top:24px; padding-top:16px; border-top:1px dashed var(--border);}
.caracteristicas-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(215px,1fr)); gap:14px; margin:20px 0;}
.carac-card{background:var(--bg-raised); border:1px solid var(--border); border-radius:var(--radius-sm); padding:18px;}
.carac-num{font-family:var(--font-display); color:var(--gold); font-size:13px; letter-spacing:.05em;}
.carac-card h4{margin:6px 0 8px; font-size:17px;}
.exemplos-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(210px,1fr)); gap:14px; margin-top:16px;}
.exemplo-card{background:var(--bg-raised); border:1px solid var(--border); border-radius:var(--radius-sm); padding:18px;}
.exemplo-card h4{font-size:16px; margin-bottom:6px;}
.casos-list{display:flex; flex-direction:column; gap:16px; margin-top:18px;}
.caso-card{display:flex; gap:16px; background:var(--bg-raised); border:1px solid var(--border); border-radius:var(--radius); padding:22px;}
.caso-seal{flex-shrink:0; width:46px; height:46px; color:var(--gold); opacity:.85; display:flex; align-items:center; justify-content:center;}
.caso-content{flex:1; min-width:0;} .caso-content h4{margin-bottom:4px; font-size:18px;}
.caso-detalhes{margin-top:12px; padding-top:12px; border-top:1px dashed var(--border); display:none;}
.caso-detalhes.show{display:block;}
.lesson-complete-row{display:flex; align-items:center; justify-content:space-between; gap:16px; margin-top:22px; flex-wrap:wrap;}
@media (max-width:1080px){ .lesson-toc{display:none;} }
@media (max-width:640px){ .lesson-shell{display:block;} h1{font-size:33px;} h2{font-size:25px;} h3{font-size:20px;} }

.quiz-intro,.quiz-active,.quiz-result{max-width:700px;}
.quiz-progress-row{display:flex; align-items:center; gap:14px; margin-bottom:24px;}
.quiz-progress-row .mini-progress{flex:1;}
.quiz-question{font-size:23px; margin-bottom:22px; font-family:var(--font-display);}
.quiz-options{display:flex; flex-direction:column; gap:10px; margin-bottom:18px;}
.quiz-opt{text-align:left; padding:15px 18px; border:1.5px solid var(--border); border-radius:var(--radius-sm); background:var(--bg-raised); font-size:15px; transition:all .15s ease;}
.quiz-opt:not([disabled]):hover{border-color:var(--gold); background:var(--gold-soft);}
.quiz-opt.is-correct{border-color:var(--success); background:var(--success-soft); font-weight:600;}
.quiz-opt.is-wrong{border-color:var(--warning); background:var(--warning-soft);}
.quiz-opt[disabled]{cursor:default;}
.quiz-review{display:flex; flex-direction:column; gap:12px; margin:24px 0;}
.quiz-review li{display:flex; align-items:flex-start; gap:10px; font-size:14.5px; color:var(--text-muted);}

    }
  }
  return crc.toString(16).toUpperCase().padStart(4,'0');
}
function pixTLV(id, value){ return id + String(value.length).padStart(2,'0') + value; }
function buildPixPayload(amount){
  const mai = pixTLV('26', pixTLV('00','BR.GOV.BCB.PIX') + pixTLV('01', PIX_KEY));
  const payload =
    pixTLV('00','01') +
    pixTLV('01','11') +
    mai +
    pixTLV('52','0000') +
    pixTLV('53','986') +
    pixTLV('54', amount.toFixed(2)) +
    pixTLV('58','BR') +
    pixTLV('59', PIX_NAME.substring(0,25)) +
    pixTLV('60', PIX_CITY.substring(0,15)) +
    pixTLV('62', pixTLV('05','CURSOJUR')) +
    '6304';
  return payload + crc16Pix(payload);
}

/* ============ CONTROLE DE SESSÕES SIMULTÂNEAS ============ */
const MAX_SESSIONS = 2; /* quantos dispositivos podem ficar logados ao mesmo tempo na mesma conta */
let mySessionId=null, sessionHeartbeat=null, sessionUnsub=null;
function summarizeDevice(){
  const ua = navigator.userAgent;
  let os = 'Dispositivo desconhecido';
  if(/Windows/i.test(ua)) os='Windows';
  else if(/iPhone/i.test(ua)) os='iPhone';
  else if(/iPad/i.test(ua)) os='iPad';
  else if(/Android/i.test(ua)) os='Android';
  else if(/Macintosh/i.test(ua)) os='Mac';
  else if(/Linux/i.test(ua)) os='Linux';
  let browser='Navegador';
  if(/Edg\//i.test(ua)) browser='Edge';
  else if(/Chrome\//i.test(ua)) browser='Chrome';
  else if(/Firefox\//i.test(ua)) browser='Firefox';
  else if(/Safari\//i.test(ua)) browser='Safari';
  return `${browser} · ${os}`;
}
function cleanupSession(){
  if(sessionHeartbeat){ clearInterval(sessionHeartbeat); sessionHeartbeat=null; }
  if(sessionUnsub){ sessionUnsub(); sessionUnsub=null; }
  mySessionId=null;
}
async function enforceSessionLimit(uid){
  const snap = await db.collection('users').doc(uid).collection('sessions').orderBy('lastSeen','desc').get();
  const docs = snap.docs || [];
  if(docs.length > MAX_SESSIONS){
    await Promise.all(docs.slice(MAX_SESSIONS).map(d=>d.ref.delete().catch(()=>{})));
  }
}
async function registerSession(uid){
  mySessionId = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ('sess-'+Date.now()+'-'+Math.random().toString(36).slice(2));
  const ref = db.collection('users').doc(uid).collection('sessions').doc(mySessionId);
  try{
    await ref.set({ device:summarizeDevice(), startedAt:firebase.firestore.FieldValue.serverTimestamp(), lastSeen:firebase.firestore.FieldValue.serverTimestamp() });
    await enforceSessionLimit(uid);
  }catch(e){ mySessionId=null; return; }
  sessionHeartbeat = setInterval(()=>{ ref.update({lastSeen:firebase.firestore.FieldValue.serverTimestamp()}).catch(()=>{}); }, 45000);
  sessionUnsub = ref.onSnapshot(snap=>{
    if(!snap.exists && mySessionId){
      cleanupSession();
      alert('Sua conta foi acessada em outro dispositivo além do limite permitido (' + MAX_SESSIONS + '), então esta sessão foi encerrada.');
      if(auth) auth.signOut();
    }
  });
}
async function deleteOwnSession(uid){
  if(!mySessionId) return;
  try{ await db.collection('users').doc(uid).collection('sessions').doc(mySessionId).delete(); }catch(e){}
}
async function doLogout(){
  const uid = auth && auth.currentUser && auth.currentUser.uid;
  if(uid) await deleteOwnSession(uid);
  cleanupSession();
  if(auth) auth.signOut();
}

function initFirebaseAuth(){
  if(!authConfigured()){ renderSetupNeeded(); return; }
  firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
  db = firebase.firestore();
  auth.onAuthStateChanged(async user=>{
    if(!user){ appInitialized=false; isAdmin=false; cleanupSession(); renderLanding(); return; }
    if(user.email===ADMIN_EMAIL){ isAdmin=true; if(!mySessionId) registerSession(user.uid); showApp(); return; }
    try{
      const doc = await db.collection('users').doc(user.uid).get();
      if(doc.exists && doc.data().approved){
        if(Date.now() >= SEMESTER_END.getTime()){ renderSemesterEnded(); return; }
        isAdmin=false; if(!mySessionId) registerSession(user.uid); showApp();
      }
      else{ renderAuthPending(user.email); }
    }catch(e){ renderAuthLogin('Erro ao verificar seu acesso. Tente entrar novamente.'); }
  });
}

  const MM=S().mindmap, g=document.getElementById('mm-g');
  const nodes=[],edges=[]; const cx=520, cy=430;
  nodes.push({x:cx,y:cy,label:MM.label,lvl:0});
  const br=MM.children.length;
  MM.children.forEach((b,i)=>{
    const ang=(-Math.PI/2)+(i/br)*Math.PI*2;
    const bx=cx+Math.cos(ang)*255, by=cy+Math.sin(ang)*215;
    nodes.push({x:bx,y:by,label:b.label,lvl:1,goto:b.goto});
    edges.push({x1:cx,y1:cy,x2:bx,y2:by});
    const n=b.children.length;
    b.children.forEach((c,j)=>{
      const sp=Math.PI*0.78;
      const a2=ang-sp/2+(n===1?sp/2:(j/(n-1))*sp);
      const px=bx+Math.cos(a2)*195, py=by+Math.sin(a2)*145;
      nodes.push({x:px,y:py,label:c.label,lvl:2});
      edges.push({x1:bx,y1:by,x2:px,y2:py});
    });
  });
  let html='';
  edges.forEach(e=>{ html+=`<path class="mm-edge" d="M${e.x1} ${e.y1} C ${(e.x1+e.x2)/2} ${e.y1}, ${(e.x1+e.x2)/2} ${e.y2}, ${e.x2} ${e.y2}"/>`; });
  nodes.forEach(n=>{
    const w=n.label.length*(n.lvl===0?9:n.lvl===1?7.2:6)+26;
    html+=`<g class="mm-node lvl-${n.lvl}" ${n.goto?`data-goto="${n.goto}"`:''} transform="translate(${n.x},${n.y})">
      <rect class="mm-dot" x="${-w/2}" y="-16" width="${w}" height="32" rx="16"/>
      <text text-anchor="middle">${n.label}</text><rect class="mm-hit" x="${-w/2}" y="-16" width="${w}" height="32"/></g>`;
  });
  g.innerHTML=html;
  const svg=document.getElementById('mm-svg'); let vb={x:0,y:0,w:1040,h:860};
  const apply=()=>svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`); apply();
  const vp=document.getElementById('mm-vp'); let drag=false,sx,sy;
  vp.addEventListener('pointerdown',e=>{drag=true;sx=e.clientX;sy=e.clientY;vp.classList.add('dragging');vp.setPointerCapture(e.pointerId);});
  vp.addEventListener('pointermove',e=>{ if(!drag)return; const k=vb.w/vp.clientWidth; vb.x-=(e.clientX-sx)*k; vb.y-=(e.clientY-sy)*k; sx=e.clientX; sy=e.clientY; apply(); });
  vp.addEventListener('pointerup',()=>{drag=false;vp.classList.remove('dragging');});
  const zoom=f=>{ const a=vb.x+vb.w/2,b=vb.y+vb.h/2; vb.w*=f; vb.h*=f; vb.x=a-vb.w/2; vb.y=b-vb.h/2; apply(); };
  document.getElementById('mm-in').onclick=()=>zoom(.8);
  document.getElementById('mm-out').onclick=()=>zoom(1.25);
  document.getElementById('mm-reset').onclick=()=>{vb={x:0,y:0,w:1040,h:860};apply();};
  g.querySelectorAll('[data-goto]').forEach(n=>n.addEventListener('click',()=>go(n.dataset.goto)));
}

function pageCert(){

  <div class="cert-section"><div class="eyebrow">${sub.nome}</div><h1>Certificado</h1>
    <p class="hero-sub small">${lib?'Todos os tópicos desta matéria foram concluídos.':`Disponível ao concluir 100% dos tópicos. Você está em ${pct}%.`}</p>
    ${!lib?`<div class="mini-progress" style="max-width:420px; margin:14px 0 26px"><div class="mini-progress-bar" style="width:${pct}%"></div></div>`:''}
    <div class="cert-form"><label class="field-label" for="cert-name">Nome completo</label>

      <button class="btn btn-primary" id="cert-dl" ${lib?'':'disabled'}>${ic('cert')} Baixar certificado em PDF</button></div>
    <div class="cert-preview"><div class="cert-card"><span class="cert-seal">${I.seal}</span>
      <div class="cert-eyebrow">${sub.nome}</div><div class="cert-name" id="cert-preview-name">${nome}</div>

    const darkMap={trabalho:[15,13,10],processo:[10,13,16],obrigacoes:[10,16,12],penal:[16,10,10]};
    const accMap={trabalho:[201,165,116],processo:[127,168,201],obrigacoes:[143,191,159],penal:[201,138,138]};
    const dark=darkMap[state.subject], acc=accMap[state.subject];
    doc.setFillColor(...dark); doc.rect(0,0,297,210,'F');
    doc.setDrawColor(...acc); doc.setLineWidth(1.4); doc.rect(12,12,273,186);
    doc.setLineWidth(.3); doc.rect(18,18,261,174);
    doc.setTextColor(160,160,160); doc.setFontSize(10);
    doc.text(sub.nome.toUpperCase(), 148.5, 55, {align:'center'});
    doc.setTextColor(235,235,235); doc.setFont('times','normal'); doc.setFontSize(22);
    doc.text('Certificado de conclusão', 148.5, 75, {align:'center'});
    doc.setTextColor(...acc); doc.setFontSize(30);
    doc.text(state.certName||'Estudante', 148.5, 103, {align:'center'});
    doc.setTextColor(165,165,165); doc.setFont('helvetica','normal'); doc.setFontSize(11);
    doc.text(doc.splitTextToSize(sub.certTexto,180), 148.5, 118, {align:'center'});
    doc.setFontSize(9); doc.text(new Date().toLocaleDateString('pt-BR'), 148.5, 165, {align:'center'});
    doc.save(`certificado-${sub.key}.pdf`);
  });
  postRender();
}
async function pageAprovacoes(){
  main().innerHTML = `<div class="eyebrow">Administração</div><h1>Aprovações de acesso</h1>
    <p class="hero-sub small">Aprove quem pode entrar no site, ou revogue o acesso de quem já entrou.</p>
    <div id="admin-content"><p class="auth-loading">Carregando usuários…</p></div>`;
  postRender();
  const box = document.getElementById('admin-content');
  try{
    const [snap, pricingDoc] = await Promise.all([
      db.collection('users').get(),
      db.collection('meta').doc('pricing').get()
    ]);
    const approvedCount = (pricingDoc.exists && typeof pricingDoc.data().approvedCount==='number') ? pricingDoc.data().approvedCount : 0;
    const users = []; snap.forEach(d=>users.push({id:d.id, ...d.data()}));
    const pending = users.filter(u=>!u.approved);
    const approved = users.filter(u=>u.approved && u.email!==ADMIN_EMAIL);
    box.innerHTML = `
      <div class="callout" style="margin-bottom:26px">Preço atual: <strong>R$ ${currentPrice(approvedCount)},00</strong> — ${approvedCount} de ${PIX_TIER_LIMIT} vagas na faixa promocional já aprovadas.</div>
      <h3 style="margin-top:8px">Pendentes (${pending.length})</h3>
      <div class="admin-list">${pending.length?pending.map(u=>`
        <div class="admin-row"><span>${escAttr(u.email)}</span>
          <button class="btn btn-primary btn-sm" data-approve="${u.id}" data-email="${escAttr(u.email)}">Aprovar</button></div>`).join(''):'<p class="admin-empty">Ninguém aguardando aprovação.</p>'}</div>
      <h3 style="margin-top:30px">Com acesso liberado (${approved.length})</h3>
      <p class="small muted" style="margin:-4px 0 12px">Limite de ${MAX_SESSIONS} dispositivos simultâneos por conta — o mais antigo é desconectado automaticamente ao logar num a mais.</p>
      <div class="admin-list">${approved.length?approved.map(u=>`
        <div class="admin-row-wrap">
          <div class="admin-row"><span>${escAttr(u.email)}</span>
            <span class="admin-row-actions">
              <button class="btn btn-ghost btn-sm" data-devices="${u.id}">Ver dispositivos</button>
              <button class="btn btn-ghost btn-sm" data-revoke="${u.id}">Revogar</button>
            </span></div>
          <div class="admin-devices" id="devices-${u.id}" hidden></div>
        </div>`).join(''):'<p class="admin-empty">Nenhum usuário aprovado ainda.</p>'}</div>`;
    box.querySelectorAll('[data-approve]').forEach(b=>b.addEventListener('click',async()=>{
      b.disabled=true;
      await db.collection('users').doc(b.dataset.approve).update({approved:true});
      await db.collection('meta').doc('pricing').set({approvedCount: firebase.firestore.FieldValue.increment(1)}, {merge:true});
      notifyApproved(b.dataset.email);
      pageAprovacoes();
    }));
    box.querySelectorAll('[data-revoke]').forEach(b=>b.addEventListener('click',async()=>{
      if(!confirm('Revogar o acesso deste usuário?')) return;
      b.disabled=true;
      await db.collection('users').doc(b.dataset.revoke).update({approved:false});
      pageAprovacoes();
    }));
    box.querySelectorAll('[data-devices]').forEach(b=>b.addEventListener('click',async()=>{
      const uid=b.dataset.devices, panel=document.getElementById('devices-'+uid);
      if(!panel.hidden){ panel.hidden=true; return; }
      panel.hidden=false; panel.innerHTML='<p class="auth-loading small">Carregando…</p>';
      try{
        const snap = await db.collection('users').doc(uid).collection('sessions').orderBy('lastSeen','desc').get();
        const sessions=[]; snap.forEach(d=>sessions.push(d.data()));
        panel.innerHTML = sessions.length ? sessions.map(s=>{
          const seen = s.lastSeen && s.lastSeen.toDate ? s.lastSeen.toDate() : null;
          const mins = seen ? Math.round((Date.now()-seen.getTime())/60000) : null;
          const when = mins===null?'—':mins<2?'ativo agora':mins<60?`há ${mins} min`:mins<1440?`há ${Math.round(mins/60)}h`:`há ${Math.round(mins/1440)}d`;
          return `<div class="device-row"><span>${escAttr(s.device||'Desconhecido')}</span><span class="small muted">${when}</span></div>`;
        }).join('') : '<p class="admin-empty small">Nenhuma sessão registrada.</p>';
      }catch(e){ panel.innerHTML='<p class="admin-empty small">Não foi possível carregar.</p>'; }
    }));
  }catch(e){
    box.innerHTML = `<div class="callout callout-warning">Não foi possível carregar a lista de usuários. Confira as regras do Firestore.</div>`;
  }
}
let INDEX=[];
function buildIndex(){
  const idx=[], sub=S();
  allSections().forEach(s=>{ const txt=s.body.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    idx.push({title:s.h, sub:'Aula '+s.aula+' · '+s.aulaTitle, text:txt, go:'lesson-'+s.aula}); });
  sub.flash.forEach(c=>idx.push({title:c.f, sub:'Flashcard · Aula '+c.aula, text:c.b, go:'flash'}));
  Object.entries(sub.questions).forEach(([lvl,arr])=>arr.forEach(q=>idx.push({title:q.q, sub:'Questão '+lvl+' · Aula '+q.aula, text:q.exp, go:'quiz'})));
  return idx;
}
function openSearch(){ document.getElementById('search-modal').classList.add('show'); const i=document.getElementById('search-input'); i.value=''; i.focus(); renderSearch(''); }
function closeSearch(){ document.getElementById('search-modal').classList.remove('show'); }
function renderSearch(q){
  const box=document.getElementById('search-results');
  if(!q.trim()){ box.innerHTML=`<p class="small muted" style="padding:14px">Buscando em <strong>${S().nome}</strong>. Procure por artigos, prazos ou conceitos.</p>`; return; }
  const t=q.toLowerCase();
  const res=INDEX.filter(x=>(x.title+' '+x.text+' '+x.sub).toLowerCase().includes(t)).slice(0,12);
  box.innerHTML = res.length? res.map(r=>`<button class="search-result" data-go="${r.go}"><span class="sr-title">${r.title}</span><span class="small muted">${r.sub}</span></button>`).join('')
    : `<p class="small muted" style="padding:14px">Nada encontrado para "${q}" em ${S().nome}.</p>`;
  box.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>{ closeSearch(); go(b.dataset.go); }));
}
function go(route, opts={}){
  if(route==='quiz-reset'){ state.quiz[state.subject]={level:null,i:0,answers:[],finished:false,history:Q().history}; route='quiz'; }
  state.route=route; closeSidebar();
  if(!opts.preserveScroll) window.scrollTo(0,0);
  if(route==='home') pageHome();
  else if(route.startsWith('lesson-')) pageLesson(+route.split('-')[1]);
  else if(route==='quiz') pageQuiz();
  else if(route==='flash') pageFlash();
  else if(route==='dashboard') pageDashboard();
  else if(route==='mapa') pageMapa();
  else if(route==='favoritos') pageFavoritos();
  else if(route==='certificado') pageCert();
  else if(route==='aprovacoes' && isAdmin) pageAprovacoes();
  else pageHome();
  markActive();
}
function postRender(){
  main().querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation(); go(el.dataset.go);}));
  main().querySelectorAll('[data-scroll]').forEach(el=>el.addEventListener('click',()=>{ const t=document.getElementById(el.dataset.scroll); if(t) t.scrollIntoView({behavior:'smooth',block:'start'}); }));
  main().querySelectorAll('[data-done]').forEach(el=>el.addEventListener('change',()=>{
    D()[el.dataset.done]=el.checked; renderSidebarLessons(); persist();
    const l=S().lessons.find(x=>x.sections.some(s=>s.id===el.dataset.done));
    const bar=main().querySelector('.toc-progress .mini-progress-bar'); if(bar) bar.style.width=lessonPct(l)+'%';
    const lbl=main().querySelector('.toc-progress .small'); if(lbl) lbl.textContent=lessonPct(l)+'% concluído';
    const all=main().querySelector('[data-done-all]'); if(all) all.checked=lessonPct(l)===100;
  }));
  main().querySelectorAll('[data-done-all]').forEach(el=>el.addEventListener('change',()=>{
    const l=S().lessons.find(x=>x.id===+el.dataset.doneAll);
    l.sections.forEach(s=>D()[s.id]=el.checked); pageLesson(l.id); renderSidebarLessons();
  }));
  main().querySelectorAll('[data-fav]').forEach(el=>el.addEventListener('click',()=>{
    const id=el.dataset.fav, s=allSections().find(x=>x.id===id);
    if(F().some(f=>f.id===id)){ state.favs[state.subject]=F().filter(f=>f.id!==id); el.classList.remove('is-fav'); el.innerHTML=ic('star'); }
    else { F().push({id, aula:s.aula, titulo:s.h}); el.classList.add('is-fav'); el.innerHTML=ic('starFill'); }
    persist();
  }));
  main().querySelectorAll('[data-caso]').forEach(el=>el.addEventListener('click',()=>{
    document.getElementById('caso-'+el.dataset.caso).classList.toggle('show'); el.classList.toggle('open');
  }));
  const obs=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){e.target.classList.add('in-view'); obs.unobserve(e.target);} }),{threshold:.06});
  main().querySelectorAll('.reveal').forEach(el=>obs.observe(el));
  persist();
}
function openSidebar(){ document.getElementById('sidebar').classList.add('open'); document.getElementById('sb-backdrop').classList.add('show'); }
function closeSidebar(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('sb-backdrop').classList.remove('show'); }
function bindShell(){
  document.querySelectorAll('.nav-item[data-go], .brand[data-go]').forEach(el=>el.addEventListener('click',()=>go(el.dataset.go)));
  document.querySelectorAll('.subject-btn').forEach(b=>b.addEventListener('click',()=>switchSubject(b.dataset.subject)));
  document.getElementById('btn-logout').addEventListener('click', doLogout);
  document.getElementById('btn-menu').addEventListener('click',openSidebar);
  document.getElementById('btn-close-menu').addEventListener('click',closeSidebar);
  document.getElementById('sb-backdrop').addEventListener('click',closeSidebar);
  document.getElementById('btn-search').addEventListener('click',openSearch);
  document.getElementById('btn-reset').addEventListener('click',resetProgress);
  document.getElementById('search-input').addEventListener('input',e=>renderSearch(e.target.value));
  document.getElementById('search-modal').addEventListener('click',e=>{ if(e.target.id==='search-modal') closeSearch(); });
  document.getElementById('btn-theme').addEventListener('click',()=>{
    state.theme = state.theme==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',state.theme);
    document.getElementById('btn-theme').innerHTML = state.theme==='dark'?ic('moon'):ic('sun');
    if(state.route==='dashboard') drawCharts();
    persist();
  });
  document.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); openSearch(); }
    if(e.key==='Escape') closeSearch();
  });
}
function initApp(){
  loadPersisted();
  renderShell();
  if(state.theme==='light'){
    document.documentElement.setAttribute('data-theme','light');
    document.getElementById('btn-theme').innerHTML = ic('sun');
  }
  try{ go(state.route||'home', {preserveScroll:true}); }catch(e){ go('home'); }
  if(state.scrollY){
    requestAnimationFrame(()=>requestAnimationFrame(()=>window.scrollTo(0, state.scrollY)));
  }
  window.addEventListener('pagehide', saveScrollAndPersist);
  window.addEventListener('beforeunload', saveScrollAndPersist);
}
initFirebaseAuth();
