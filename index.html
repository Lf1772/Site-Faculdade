/* ============ MATÉRIA 4 — PROTEÇÃO PENAL ============ */
const PEN_L = [
{ id:1, title:"Homicídio: simples, privilegiado e qualificado", subtitle:"Aula 1 — Crimes contra a vida e o art. 121 do Código Penal em suas três espécies dolosas.",
 sections:[
  {id:"pe1-1", h:"Panorama dos crimes contra a vida", body:`
   <p>Os crimes contra a vida estão dispostos <strong>do art. 121 ao art. 128 do CP</strong>. Salvo os expressamente previstos como culposos, todos são dolosos e vão a julgamento perante o <strong>Tribunal do Júri</strong> (CF, art. 5º, XXXVIII).</p>
   <div class="table-wrap"><table class="styled-table">
   <tr><th>Espécie</th><th>Dispositivo</th></tr>
   <tr><td>Homicídio simples</td><td>Art. 121, <em>caput</em></td></tr>
   <tr><td>Homicídio privilegiado</td><td>Art. 121, § 1º</td></tr>
   <tr><td>Homicídio qualificado</td><td>Art. 121, § 2º</td></tr>
   <tr><td>Homicídio culposo</td><td>Art. 121, §§ 3º e 4º</td></tr></table></div>
   <div class="callout">Não por acaso o homicídio <strong>inaugura a Parte Especial</strong> do Código Penal: é o crime que lesa o mais relevante dos bens jurídicos, a vida humana.</div>`},
  {id:"pe1-2", h:"Homicídio simples (art. 121, caput)", body:`
   <span class="badge badge-lei">Art. 121 do CP</span>
   <p>É o ato de matar outra pessoa de forma <strong>dolosa</strong>. Chama-se simples por não apresentar qualificadoras (que aumentam a pena) nem privilégio (que a reduz).</p>
   <div class="table-wrap"><table class="styled-table">
   <tr><th>Elemento</th><th>Conteúdo</th></tr>
   <tr><td><strong>Objeto jurídico</strong></td><td>A vida humana <strong>extrauterina</strong>, que passa a existir depois do início do parto. Imperativo da ordem constitucional (art. 5º, <em>caput</em>)</td></tr>
   <tr><td><strong>Sujeito ativo</strong></td><td>Qualquer pessoa — <strong>crime comum</strong> e de forma livre, em grupo ou não, com ou sem armas</td></tr>
   <tr><td><strong>Sujeito passivo</strong></td><td>Qualquer ser humano, a partir do início do parto</td></tr>
   <tr><td><strong>Consumação</strong></td><td>Sempre com a <strong>morte</strong> da vítima</td></tr>
   <tr><td><strong>Tentativa</strong></td><td>Quando o resultado não se produz por circunstâncias <strong>alheias à vontade</strong> do agente</td></tr></table></div>
   <p>Segundo Hungria, o sujeito passivo é o "ser vivo nascido de mulher": não importa a condição da pessoa, configurando-se o homicídio mesmo contra o recém-nascido inviável ou na supressão do minuto de vida que reste ao moribundo.</p>
   <div class="callout callout-warning">Se a interrupção da execução decorrer da <strong>própria vontade</strong> do agente, não há tentativa, mas <strong>desistência voluntária</strong>.</div>`},
  {id:"pe1-3", h:"Tipo objetivo, meios de execução e nexo causal", body:`
   <p>A conduta típica é <strong>matar</strong>, ou seja, extinguir a vida. Crime de <strong>forma livre</strong>, praticável por ação ou por omissão — nesta última, quando o agente tinha o dever de impedir o resultado e podia fazê-lo (<strong>art. 13, § 2º, do CP</strong>).</p>
   <div class="caracteristicas-grid">
     <div class="carac-card"><div class="carac-num">QUANTO À VIA</div><h4>Diretos e indiretos</h4><p class="small muted">Direto: o agente usa pessoalmente o instrumento letal. Indireto: vale-se de um irresponsável ou de um animal.</p></div>
     <div class="carac-card"><div class="carac-num">QUANTO À NATUREZA</div><h4>Físicos, patológicos e morais</h4><p class="small muted">Físicos: armas, meios mecânicos ou químicos. Patológicos: transmissão de moléstia por vírus ou bactéria. Morais: provocação de emoção violenta a um cardíaco.</p></div>
   </div>
   <div class="callout"><strong>Nexo causal (art. 13):</strong> tratando-se de crime <strong>material</strong>, é indispensável verificar a ligação entre a conduta e o resultado morte.</div>
   <p><strong>Consumação:</strong> crime <strong>instantâneo de efeitos permanentes</strong>. Instantâneo porque a consumação se dá em momento preciso; de efeitos permanentes porque a consequência não se restaura. Pela <strong>Lei nº 9.434/97</strong>, o fim da atividade cerebral — a morte encefálica — significa o fim da vida.</p>`},
  {id:"pe1-4", h:"Tipo subjetivo: o animus necandi", body:`
   <p>O dolo é a <strong>vontade de matar alguém</strong>, não se exigindo qualquer fim especial. Há por parte do autor o <strong><em>animus necandi</em></strong> (ou <em>occidendi</em>).</p>
   <p>O crime admite <strong>dolo direto</strong> (propósito de eliminar a vida) e <strong>dolo eventual</strong> (o agente assume o risco de produzir o resultado morte).</p>
   <div class="callout callout-warning"><strong>Distinção decisiva:</strong> havendo <em>animus necandi</em> e não se consumando o evento, configura-se <strong>tentativa de homicídio</strong> — e não lesão corporal. Devem ser analisadas as circunstâncias objetivas do caso concreto para deduzir o dolo do agente.</div>`},
  {id:"pe1-5", h:"Homicídio privilegiado (art. 121, § 1º)", body:`
   <p>Não é delito autônomo, e sim <strong>causa de diminuição de pena</strong>, de <strong>1/6 a 1/3</strong>, conjugada com o <em>caput</em>. Pode resultar em pena menor que a pena base.</p>
   <div class="caracteristicas-grid">
     <div class="carac-card"><div class="carac-num">FIGURA 1</div><h4>Relevante valor social</h4><p class="small muted">O delito é entendido pela sociedade como justificável — diz respeito aos interesses da vida coletiva. Ex.: patriota que mata traidor da pátria.</p></div>
     <div class="carac-card"><div class="carac-num">FIGURA 2</div><h4>Relevante valor moral</h4><p class="small muted">Questão moral individual, movida por compaixão e piedade. A <strong>eutanásia</strong> não teve a culpabilidade excluída no direito brasileiro, mas o agente goza de diminuição de pena.</p></div>
     <div class="carac-card"><div class="carac-num">FIGURA 3</div><h4>Violenta emoção após injusta provocação</h4><p class="small muted">Elemento temporal: exige as <strong>duas figuras</strong>. "Logo em seguida" significa que o ato deve ocorrer imediatamente após a provocação, com o agente já sob forte emoção.</p></div>
   </div>
   <div class="callout">Note que as circunstâncias do privilégio são todas <strong>subjetivas</strong> — isso será decisivo no tópico do homicídio qualificado-privilegiado.</div>`},
  {id:"pe1-6", h:"Qualificadoras: motivos (incisos I e II)", body:`
   <p>As qualificadoras do § 2º dizem respeito a <strong>motivos</strong> (I, II, VI, VII e IX), <strong>meios</strong> (III e VIII), <strong>modos</strong> (IV) e <strong>fins</strong> (V). Podem coexistir, desde que compatíveis.</p>
   <p><strong>I — Mediante paga ou promessa de recompensa, ou por outro motivo torpe</strong> (subjetiva)</p>
   <ul class="styled-list">
     <li><strong>Paga:</strong> valor ou vantagem recebida <strong>antecipadamente</strong> — é o homicídio mercenário</li>
     <li><strong>Promessa de recompensa:</strong> pagamento <strong>futuro</strong></li>
     <li>Nenhuma das duas precisa ter natureza patrimonial: pode ser promessa de casamento ou de relação sexual</li>
   </ul>
   <div class="callout callout-warning"><strong>Divergência sobre o mandante:</strong> parte da doutrina entende que a qualificadora só alcança o executor, podendo a conduta do mandante amoldar-se a motivo torpe, fútil ou até de relevante valor. Já o <strong>STJ</strong> decidiu que, por ser <strong>elemento do tipo qualificado</strong>, a circunstância não atinge exclusivamente o executor, mas também o mandante ou qualquer coautor (HC 99.144/RJ, Rel. Min. Og Fernandes, 6ª T.).</div>
   <p><strong>Motivo torpe</strong> é o abjeto, repugnante, ignóbil, desprezível, profundamente imoral — o mais baixo na escala de valores éticos. Ex.: matar para receber herança, por rivalidade profissional.</p>
   <p><strong>II — Por motivo fútil</strong> (subjetiva): motivo sem importância, frívolo, insignificante. Há <strong>inteira desproporção</strong> entre o crime e a motivação. Segundo Heleno Fragoso, é aquele desproporcionado com a gravidade da reação homicida, tendo em vista a sensibilidade moral média. Os tribunais têm reconhecido como fútil o rompimento de namoro e a discussão familiar sem importância.</p>`},
  {id:"pe1-7", h:"Ciúme, vingança, embriaguez e ausência de motivo", body:`
   <p>Estes quatro pontos concentram a jurisprudência mais cobrada sobre as qualificadoras subjetivas.</p>
   <div class="table-wrap"><table class="styled-table">
   <tr><th>Situação</th><th>Entendimento predominante</th></tr>
   <tr><td><strong>Ciúme</strong></td><td>Não pode ser equiparado <em>a priori</em> a motivo torpe nem fútil. Pode inserir-se no inciso I ou II, ou mesmo no <strong>privilégio</strong> do § 1º — análise caso a caso (STJ, AgRg no AREsp 363.919/PR)</td></tr>
   <tr><td><strong>Vingança</strong></td><td>Pode ou não constituir motivo torpe, <strong>na dependência do que a originou</strong>. Por si só não substantiva a torpeza, mas sua afirmativa também não elide a imputação — afere-se à luz do contexto (STF, HC 83.309)</td></tr>
   <tr><td><strong>Embriaguez</strong></td><td><strong>Não afasta</strong> o reconhecimento da futilidade. A embriaguez voluntária ou culposa não exclui a imputabilidade penal (STJ, REsp 908.396/MG)</td></tr>
   <tr><td><strong>Ausência de motivo</strong></td><td><strong>Não se confunde</strong> com motivo fútil. Praticado o fato sem razão alguma, incide apenas o homicídio simples, à luz do princípio da reserva legal (STJ, HC 152.548/MG)</td></tr></table></div>
   <div class="callout callout-warning"><strong>Ponto de prova clássico:</strong> ausência de motivo ≠ motivo fútil. Fútil pressupõe um motivo que exista, mas seja insignificante.</div>`},
  {id:"pe1-8", h:"Qualificadoras: meios (inciso III)", body:`
   <p><strong>III — Com emprego de veneno, fogo, explosivo, asfixia, tortura ou outro meio insidioso ou cruel, ou de que possa resultar perigo comum</strong> (objetiva).</p>
   <div class="table-wrap"><table class="styled-table">
   <tr><th>Meio</th><th>Caracterização</th></tr>
   <tr><td><strong>Veneno</strong></td><td>Deve ser ministrado <strong>insidiosamente</strong>, sem conhecimento da vítima</td></tr>
   <tr><td><strong>Fogo</strong></td><td>Meio extremamente cruel de execução</td></tr>
   <tr><td><strong>Explosivo</strong></td><td>Traz perigo a número indeterminado de pessoas</td></tr>
   <tr><td><strong>Asfixia</strong></td><td>Supressão da respiração. Pode ser mecânica ou tóxica</td></tr>
   <tr><td><strong>Tortura</strong></td><td>Meio para alcançar o resultado morte</td></tr></table></div>
   <p><strong>Meio insidioso:</strong> uso de fraude ou armadilha, clandestinos, que impedem a vítima de saber que está sendo atacada. Ex.: sabotar o motor de um automóvel, colocar veneno na comida.</p>
   <p><strong>Meio cruel:</strong> sujeitar a vítima a graves e inúteis vexames ou sofrimentos. Meio bárbaro, que aumenta inutilmente o padecimento, partido de ânimo calmo que permite a escolha do modo de infligir sofrimento.</p>
   <div class="callout"><strong>Não é preciso que seja insidioso <em>e</em> cruel</strong> — basta um ou outro.</div>
   <p><strong>Formas de asfixia mecânica</strong> (Hungria): oclusão dos orifícios respiratórios (sufocação direta); oclusão das vias aéreas; compressão da caixa torácica (sufocação indireta); supressão funcional do campo respiratório. Processos: enforcamento, imprensamento, estrangulamento, afogamento, submersão, esganadura.</p>
   <div class="callout callout-warning"><strong>Tortura no homicídio × Lei nº 9.455/97:</strong> no homicídio a tortura é <strong>meio</strong> para alcançar a morte; na legislação específica, é <strong>fim em si mesma</strong>.</div>
   <div class="callout"><strong>Crueldade post mortem não qualifica.</strong> Esquartejar pessoa ainda viva é meio cruel; esquartejá-la após a morte não induz a qualificadora.</div>`},
  {id:"pe1-9", h:"Qualificadoras: modo (IV) e fim (V)", body:`
   <p><strong>IV — À traição, de emboscada, ou mediante dissimulação ou outro recurso que dificulte ou torne impossível a defesa do ofendido</strong> (objetiva).</p>
   <ul class="styled-list">
     <li><strong>Traição:</strong> segundo Nucci, é a ação que colhe a vítima por trás, desprevenida, sem qualquer visualização do ataque. <em>Ataque súbito pela frente pode ser surpresa, mas não traição.</em></li>
     <li><strong>Emboscada:</strong> espécie de traição em que o agente se coloca escondido, de tocaia, aguardando a vítima passar</li>
     <li><strong>Dissimulação:</strong> ocultar a intenção homicida, fazendo-se passar por amigo ou conselheiro</li>
     <li><strong>Dificultar</strong> é um <em>minus</em> em relação a <strong>tornar impossível</strong>: naquele a vítima ainda tem alguma possibilidade de defesa; neste, eliminam-se completamente as chances — ex.: matar a vítima enquanto dorme</li>
   </ul>
   <p><strong>V — Para assegurar a execução, a ocultação, a impunidade ou a vantagem de outro crime</strong> (subjetiva). Exige <strong>conexão</strong> com outro delito.</p>
   <div class="table-wrap"><table class="styled-table">
   <tr><th>Conexão</th><th>Momento</th><th>Exemplo</th></tr>
   <tr><td><strong>Teleológica</strong></td><td>Homicídio como <strong>meio</strong> para executar crime <strong>futuro</strong></td><td>Matar o vigilante na véspera do roubo à agência</td></tr>
   <tr><td><strong>Consequencial</strong></td><td>Homicídio para ocultar, assegurar impunidade ou vantagem de crime <strong>já cometido</strong></td><td>Matar a única testemunha do homicídio anterior</td></tr></table></div>
   <div class="callout"><strong>Ocultação × impunidade:</strong> na ocultação, pretende-se manter a infração <strong>desconhecida</strong>; na impunidade, a infração é conhecida, mas a <strong>autoria</strong> ainda é ignorada.</div>`},
  {id:"pe1-10", h:"Homicídio qualificado-privilegiado e crime hediondo", body:`
   <p>Há controvérsia doutrinária, mas o entendimento mais acertado é que a figura é <strong>possível</strong>, desde que a qualificadora seja <strong>objetiva</strong> — já que as circunstâncias do privilégio são <strong>subjetivas</strong>.</p>
   <div class="table-wrap"><table class="styled-table">
   <tr><th>Qualificadora</th><th>Natureza</th><th>Compatível com o privilégio?</th></tr>
   <tr><td>§ 2º, I — paga ou motivo torpe</td><td>Subjetiva (motivo)</td><td><strong>Não</strong></td></tr>
   <tr><td>§ 2º, II — motivo fútil</td><td>Subjetiva (motivo)</td><td><strong>Não</strong></td></tr>
   <tr><td>§ 2º, III — meio</td><td>Objetiva</td><td><strong>Sim</strong></td></tr>
   <tr><td>§ 2º, IV — modo de execução</td><td>Objetiva</td><td><strong>Sim</strong></td></tr>
   <tr><td>§ 2º, V — fim conexo a outro crime</td><td>Subjetiva (fim)</td><td><strong>Não</strong></td></tr></table></div>
   <div class="callout callout-warning"><strong>Crime hediondo:</strong> o homicídio qualificado é hediondo (Lei nº 8.072/90, art. 1º, I, segunda parte). O <strong>homicídio qualificado-privilegiado NÃO é hediondo</strong> — a lei não o menciona, e a extensão violaria o princípio da reserva legal (STJ, HC 153.728, Rel. Min. Felix Fischer, 5ª T.).</div>`},
  {id:"pe1-11", h:"Distinção: homicídio e latrocínio", body:`
   <p>Em situações que envolvem subtração e morte, o critério decisivo é o <strong>elemento anímico</strong> — a intenção primeira do agente.</p>
   <div class="table-wrap"><table class="styled-table">
   <tr><th></th><th>Homicídio em concurso com furto</th><th>Latrocínio (art. 157, § 3º)</th></tr>
   <tr><td>Intenção primeira</td><td>Matar a pessoa</td><td>O patrimônio</td></tr>
   <tr><td>O outro elemento</td><td>A subtração é <strong>meramente casual</strong></td><td>A morte é causada, dolosa ou culposamente, nesse contexto</td></tr>
   <tr><td>Bem jurídico visado</td><td>A vida</td><td>O patrimônio</td></tr></table></div>
   <div class="callout">Se o sujeito visa fundamentalmente atingir a <strong>vida</strong>, afetando apenas ocasionalmente a esfera patrimonial, afasta-se a complexidade delitiva do latrocínio e tipifica-se o <strong>cúmulo material</strong>.</div>`},
  {id:"pe1-12", h:"Iter criminis e as excludentes de ilicitude", body:`<span class="badge badge-comp">Complemento</span>
   <p class="comp-note">Conteúdo acrescentado para completar o tema — não constava no material de aula.</p>
   <p>Antes de afirmar que houve homicídio, é preciso percorrer duas verificações: <strong>em que fase</strong> a conduta parou, e se <strong>havia justificativa</strong> para ela.</p>
   <h4 style="margin-top:22px">Iter criminis</h4>
   <div class="table-wrap"><table class="styled-table">
   <tr><th>Fase</th><th>Descrição</th><th>Punível?</th></tr>
   <tr><td><strong>Cogitação</strong></td><td>A ideia, no plano interno</td><td>Não — <em>cogitationis poenam nemo patitur</em></td></tr>
   <tr><td><strong>Atos preparatórios</strong></td><td>Providências anteriores à execução</td><td>Em regra não, salvo se constituírem crime autônomo</td></tr>
   <tr><td><strong>Execução</strong></td><td>Início da agressão ao bem jurídico</td><td><strong>Sim</strong> — a partir daqui há tentativa</td></tr>
   <tr><td><strong>Consumação</strong></td><td>Reunião de todos os elementos do tipo</td><td>Sim</td></tr></table></div>
   <div class="artigo"><strong>Art. 14, II</strong> — Diz-se o crime tentado quando, iniciada a execução, não se consuma por circunstâncias alheias à vontade do agente. <strong>Parágrafo único:</strong> pune-se a tentativa com a pena do crime consumado, diminuída de <strong>1/3 a 2/3</strong>.<br><br><strong>Art. 15</strong> — O agente que, voluntariamente, desiste de prosseguir na execução (<strong>desistência voluntária</strong>) ou impede que o resultado se produza (<strong>arrependimento eficaz</strong>), só responde pelos atos já praticados.</div>
   <div class="callout callout-success"><strong>A fórmula de Frank:</strong> "posso, mas não quero" → desistência voluntária. "Quero, mas não posso" → tentativa.</div>
   <p><strong>Crime impossível</strong> (art. 17): por absoluta ineficácia do meio ou absoluta impropriedade do objeto, não se pune a tentativa. Ex.: disparar contra cadáver.</p>
   <h4 style="margin-top:26px">Excludentes de ilicitude (art. 23)</h4>
   <div class="caracteristicas-grid">
     <div class="carac-card"><div class="carac-num">I</div><h4>Estado de necessidade</h4><p class="small muted">Art. 24 — perigo atual não provocado voluntariamente, sacrificando direito cujo sacrifício era razoável exigir.</p></div>
     <div class="carac-card"><div class="carac-num">II</div><h4>Legítima defesa</h4><p class="small muted">Art. 25 — repele injusta agressão, atual ou iminente, a direito seu ou de outrem, usando moderadamente os meios necessários.</p></div>
     <div class="carac-card"><div class="carac-num">III</div><h4>Estrito cumprimento de dever legal</h4><p class="small muted">A conduta é determinada por lei ao agente público.</p></div>
     <div class="carac-card"><div class="carac-num">IV</div><h4>Exercício regular de direito</h4><p class="small muted">O ordenamento autoriza a conduta.</p></div>
   </div>
   <div class="callout callout-warning"><strong>Requisitos da legítima defesa</strong> (todos cumulativos): agressão <strong>injusta</strong>; <strong>atual ou iminente</strong>; a direito próprio ou alheio; repelida com os <strong>meios necessários</strong>; usados <strong>moderadamente</strong>. Faltando moderação, há <strong>excesso</strong>, punível a título de dolo ou culpa (art. 23, parágrafo único).</div>
   <div class="table-wrap"><table class="styled-table">
   <tr><th>Situação</th><th>Enquadramento</th></tr>
   <tr><td>Agressão <strong>passada</strong> — o agressor já fugiu</td><td>Não é legítima defesa: é <strong>vingança</strong>. Responde por homicídio</td></tr>
   <tr><td>Agressão <strong>futura e remota</strong> — ameaça de matar amanhã</td><td>Não é legítima defesa (falta atualidade ou iminência)</td></tr>
   <tr><td>Reação desproporcional a agressão real</td><td>Excesso — responde pelo excesso, doloso ou culposo</td></tr>
   <tr><td>Legítima defesa <strong>putativa</strong></td><td>Erro sobre a situação de fato (art. 20, § 1º) — exclui o dolo; se o erro for evitável, responde por culpa</td></tr></table></div>
   <div class="callout"><strong>Por que isto importa no art. 121:</strong> a existência de excludente é a primeira tese defensiva no Tribunal do Júri. Reconhecida a legítima defesa, o réu é <strong>absolvido</strong>, ainda que a morte tenha ocorrido.</div>`},
  {id:"pe1-13", h:"O Tribunal do Júri: como o processo caminha", body:`<span class="badge badge-comp">Complemento</span>
   <p>Como todos os crimes dolosos contra a vida são de competência do Júri (CF, art. 5º, XXXVIII), vale conhecer o rito — ele é <strong>bifásico</strong>.</p>
   <div class="table-wrap"><table class="styled-table">
   <tr><th>Fase</th><th>Nome</th><th>O que se decide</th><th>Encerramento</th></tr>
   <tr><td><strong>1ª</strong></td><td><em>Judicium accusationis</em> (sumário da culpa)</td><td>Se há indícios suficientes de autoria e prova da materialidade</td><td>Decisão de pronúncia, impronúncia, absolvição sumária ou desclassificação</td></tr>
   <tr><td><strong>2ª</strong></td><td><em>Judicium causae</em></td><td>O mérito, pelos jurados</td><td>Sentença do juiz-presidente, conforme o veredicto</td></tr></table></div>
   <div class="table-wrap"><table class="styled-table">
   <tr><th>Decisão</th><th>Significado</th><th>Recurso</th></tr>
   <tr><td><strong>Pronúncia</strong></td><td>Há indícios de autoria e prova da materialidade — o réu vai a júri. Vale o <em>in dubio pro societate</em></td><td>Recurso em sentido estrito</td></tr>
   <tr><td><strong>Impronúncia</strong></td><td>Faltam indícios suficientes — não há juízo de mérito, e nova ação é possível surgindo prova nova</td><td>Apelação</td></tr>
   <tr><td><strong>Absolvição sumária</strong></td><td>Provada excludente de ilicitude ou culpabilidade, atipicidade ou inexistência do fato</td><td>Apelação</td></tr>
   <tr><td><strong>Desclassificação</strong></td><td>O crime não é doloso contra a vida — remete-se ao juízo competente</td><td>Recurso em sentido estrito</td></tr></table></div>
   <div class="callout callout-warning"><strong>Vedação ao excesso de linguagem:</strong> na pronúncia o juiz deve limitar-se a indicar a materialidade e os indícios de autoria. Aprofundar-se no mérito influenciaria os jurados e gera nulidade.</div>
   <p><strong>Os princípios constitucionais do Júri:</strong> plenitude de defesa; sigilo das votações; soberania dos veredictos; e competência para o julgamento dos crimes dolosos contra a vida.</p>
   <div class="callout"><strong>Soberania relativizada:</strong> a decisão dos jurados é soberana, mas cabe apelação quando manifestamente contrária à prova dos autos (CPP, art. 593, III, "d") — hipótese em que se determina <strong>novo júri</strong>, e apenas uma vez pelo mesmo motivo.</div>`}],
 casos:[
  {t:"O tiro que não matou", resumo:"O agente dispara contra a vítima com intenção de matar, mas ela sobrevive com lesões graves.", detalhe:"A resposta depende do elemento subjetivo. Presente o animus necandi e não consumado o resultado por circunstâncias alheias à vontade do agente, há tentativa de homicídio — e não lesão corporal, ainda que o resultado material tenha sido apenas a lesão. Devem ser analisadas as circunstâncias objetivas (arma utilizada, região atingida, número de disparos, reiteração) para deduzir o dolo."},
  {t:"O mandante e a qualificadora da paga", resumo:"Alguém contrata um executor para matar seu desafeto. A qualificadora do inciso I alcança quem pagou?", detalhe:"Há duas correntes. Parte da doutrina entende que a qualificadora da paga só atinge quem a recebeu — o executor —, podendo a conduta do mandante amoldar-se a outro motivo (torpe, fútil, ou até relevante valor). O STJ, porém, decidiu que, por ser elemento do tipo qualificado, a circunstância não atinge exclusivamente o executor, mas também o mandante ou qualquer coautor (HC 99.144/RJ)."},
  {t:"Marido mata a esposa após flagrá-la traindo", resumo:"O agente mata sob forte abalo emocional, imediatamente após presenciar a traição, usando arma de fogo pelas costas.", detalhe:"Duas análises se cruzam. Quanto ao privilégio, discute-se se houve injusta provocação e violenta emoção 'logo em seguida' — a jurisprudência tende a não reconhecer o ciúme, por si só, como torpe ou fútil, analisando caso a caso. Quanto à qualificadora, o disparo pelas costas configura recurso que dificulta a defesa (inciso IV), circunstância objetiva. Sendo objetiva, é compatível com o privilégio: seria hipótese de homicídio qualificado-privilegiado, que não é crime hediondo."}]},

{ id:2, title:"Feminicídio, vicaricídio, infanticídio e suicídio", subtitle:"Aula 2 — Tipos autônomos e figuras especiais dos crimes contra a vida.",
 sections:[
  {id:"pe2-1", h:"Feminicídio (art. 121-A)", body:`
   <span class="badge badge-lei">Art. 121-A do CP</span>
   <p>Tipo penal específico para homicídios praticados contra mulheres <strong>por razões da condição do sexo feminino</strong>.</p>
   <div class="artigo"><strong>Art. 121-A.</strong> Matar mulher por razões da condição do sexo feminino:<br><span class="pena">Pena — reclusão, de 20 a 40 anos</span><br><br><strong>§ 1º</strong> Considera-se que há razões da condição do sexo feminino quando o crime envolve:<br>I – violência doméstica e familiar;<br>II – menosprezo ou discriminação à condição de mulher.</div>
   <div class="callout callout-warning">É <strong>crime hediondo</strong>.</div>
   <p><strong>Não é crime de feminicídio simplesmente matar mulher.</strong> Se fosse, haveria notória inconstitucionalidade, por dar valoração diversa ao mesmo bem jurídico (vida humana) em razão do sexo da vítima. O que qualifica é a <strong>motivação de gênero</strong>.</p>
   <div class="table-wrap"><table class="styled-table">
   <tr><th>Elemento</th><th>Conteúdo</th></tr>
   <tr><td><strong>Sujeito ativo</strong></td><td>Qualquer pessoa — crime comum. Normalmente homem, mas também pode ser mulher</td></tr>
   <tr><td><strong>Sujeito passivo</strong></td><td>Obrigatoriamente pessoa do sexo feminino (criança, adulta ou idosa)</td></tr>
   <tr><td><strong>Tipo subjetivo</strong></td><td>Dolo direto ou eventual</td></tr>
   <tr><td><strong>Consumação</strong></td><td>Admite forma tentada e consumada</td></tr></table></div>
   <p><strong>Menosprezo</strong> é desprezo, aversão, repulsa a pessoa do sexo feminino. <strong>Discriminação</strong> é tratar de forma diferente pela condição de mulher.</p>`},
  {id:"pe2-2", h:"Feminicídio: causas de aumento e coautoria", body:`
   <div class="artigo"><strong>Art. 121-A, § 2º</strong> — A pena é aumentada de <strong>1/3 até a metade</strong> se o crime é praticado:<br>I – durante a gestação, nos 3 meses posteriores ao parto, ou se a vítima é mãe ou responsável por criança, adolescente ou pessoa com deficiência de qualquer idade;<br>II – contra pessoa menor de 14 anos, maior de 60 anos, com deficiência ou portadora de doenças degenerativas que acarretem condição limitante ou de vulnerabilidade;<br>III – na presença física ou virtual de descendente ou ascendente da vítima;<br>IV – em descumprimento das medidas protetivas de urgência dos incisos I, II e III do art. 22 da Lei Maria da Penha;<br>V – nas circunstâncias dos incisos III, IV e VIII do § 2º do art. 121.<br><br><strong>§ 3º</strong> Comunicam-se ao coautor ou partícipe as circunstâncias pessoais elementares do crime previstas no § 1º.</div>
   <div class="callout"><strong>Impossibilidade de feminicídio privilegiado:</strong> o § 1º do art. 121 refere-se ao próprio art. 121, não abrangendo o art. 121-A. Não existe feminicídio privilegiado.</div>`},
  {id:"pe2-3", h:"Quem é 'mulher' para efeito do tipo?", body:`
   <p>A questão comporta três critérios, com consequências distintas.</p>
   <div class="caracteristicas-grid">
     <div class="carac-card"><div class="carac-num">CRITÉRIO I</div><h4>Psicológico</h4><p class="small muted">Considera a identificação da pessoa com o gênero, ainda que o sexo biológico seja outro. Alcança transexuais.</p></div>
     <div class="carac-card"><div class="carac-num">CRITÉRIO II</div><h4>Biológico</h4><p class="small muted">Identifica a mulher pela concepção genética ou cromossômica. Como a cirurgia altera a estética, mas não a genética, não caberia a qualificadora.</p></div>
     <div class="carac-card"><div class="carac-num">CRITÉRIO III</div><h4>Jurídico</h4><p class="small muted">Exige registro oficial (certidão, identidade) com o sexo feminino expresso. Só a partir da alteração judicial é que se considera sujeito passivo.</p></div>
   </div>
   <p><strong>Jurisprudência:</strong> o TJDFT (3ª Turma Criminal) manteve denúncia por tentativa de feminicídio contra <strong>mulher transgênero</strong>, entendendo haver indícios de que o crime foi motivado por ódio à condição de transexual, o que caracteriza menosprezo e discriminação ao gênero feminino adotado pela vítima. Destacou-se a <strong>dupla vulnerabilidade</strong> das transgêneras femininas (RSE 2018 07 1 001953-0).</p>
   <div class="table-wrap"><table class="styled-table">
   <tr><th>Situação</th><th>Cabe feminicídio?</th></tr>
   <tr><td>Mulher que mata sua companheira homoafetiva</td><td>Sim, se por razões da condição de sexo feminino</td></tr>
   <tr><td>Homem que mata seu companheiro homoafetivo</td><td><strong>Não</strong> — a vítima deve ser do sexo feminino. Continua sendo homicídio</td></tr></table></div>`},
  {id:"pe2-4", h:"Violência doméstica: quando NÃO há feminicídio", body:`
   <p>Pela Lei Maria da Penha, configura violência doméstica e familiar contra a mulher qualquer ação ou omissão <strong>baseada no gênero</strong> que lhe cause morte, lesão, sofrimento físico, sexual ou psicológico e dano moral ou patrimonial, praticada:</p>
   <ul class="styled-list">
     <li><strong>I</strong> — no âmbito da unidade doméstica (espaço de convívio permanente, com ou sem vínculo familiar)</li>
     <li><strong>II</strong> — no âmbito da família (unidos por laços naturais, afinidade ou vontade expressa)</li>
     <li><strong>III</strong> — em qualquer relação íntima de afeto, independentemente de coabitação</li>
   </ul>
   <div class="callout callout-warning"><strong>Ponto essencial:</strong> ainda que a violência ocorra no ambiente doméstico e tenha a mulher como vítima, <strong>não haverá feminicídio se faltar a motivação baseada no gênero</strong>.</div>
   <div class="exemplos-grid">
     <div class="exemplo-card"><h4>Há feminicídio</h4><p class="small muted">Marido que mata a mulher porque acha que ela não tem "direito" de se separar dele. Ou companheiro que mata porque o jantar não estava pronto.</p></div>
     <div class="exemplo-card"><h4>Não há feminicídio</h4><p class="small muted">Duas irmãs que vivem na mesma casa disputam herança; uma mata a outra para ficar com os bens. Há violência doméstica, mas a motivação é <strong>patrimonial</strong>.</p></div>
     <div class="exemplo-card"><h4>Menosprezo (inciso II)</h4><p class="small muted">Funcionário que mata a colega por ela ter conseguido a promoção, pois em sua visão ela, por ser mulher, não estaria capacitada.</p></div>
   </div>`},
  {id:"pe2-5", h:"Homicídio funcional (art. 121, § 2º, VII)", body:`
   <p>Introduzido pela <strong>Lei nº 13.142/2015</strong>. Qualifica o homicídio cometido contra autoridade ou agente descrito nos <strong>arts. 142 e 144 da CF</strong>, integrantes do sistema prisional e da Força Nacional, no exercício da função ou em decorrência dela — ou contra cônjuge, companheiro ou parente consanguíneo até 3º grau, em razão dessa condição.</p>
   <div class="callout callout-warning">É também <strong>crime hediondo</strong>.</div>
   <p><strong>Alcance da qualificadora:</strong></p>
   <div class="table-wrap"><table class="styled-table">
   <tr><th>Categoria</th><th>Abrangida?</th><th>Fundamento</th></tr>
   <tr><td>Forças Armadas, polícias federal, rodoviária, ferroviária, civis, militares e bombeiros</td><td>Sim</td><td>Arts. 142 e 144, <em>caput</em>, da CF</td></tr>
   <tr><td>Guardas municipais</td><td>Sim</td><td>Art. 144, § 8º — a lei não restringiu ao <em>caput</em>. Lei nº 13.022/2014</td></tr>
   <tr><td>Membros do sistema prisional</td><td>Sim</td><td>Inclui diretores, agentes, comissão técnica de classificação, conselho penitenciário</td></tr>
   <tr><td>Agentes de segurança viária</td><td>Sim</td><td>Art. 144, § 10, da CF</td></tr>
   <tr><td>Servidores aposentados</td><td><strong>Em regra, não</strong></td><td>Deixam de ser agentes. Exceção: morte em vingança por atuação funcional pretérita — o texto fala "em decorrência dela"</td></tr>
   <tr><td>Parentes por afinidade (sogro, cunhado, genro, nora)</td><td><strong>Não</strong></td><td>A lei fala em parente <strong>consanguíneo</strong> até 3º grau</td></tr></table></div>
   <p><strong>Parentes consanguíneos até 3º grau</strong> abrange: ascendentes (pais, avós, bisavós); descendentes (filhos, netos, bisnetos); colaterais até 3º grau (irmãos, tios e sobrinhos).</p>
   <div class="callout"><strong>Exigência central:</strong> o crime deve ser cometido contra o agente <strong>no exercício da função ou em decorrência dela</strong>. Matar um policial em dia de folga, por circunstância sem vínculo com a função, não configura esta qualificadora — ainda que o autor soubesse tratar-se de policial. O bem jurídico tutelado é <strong>a função pública</strong>, não a pessoa do agente.</div>`},
  {id:"pe2-6", h:"Demais qualificadoras e homicídio culposo", body:`
   <div class="artigo"><strong>VIII</strong> — com emprego de arma de fogo de uso restrito ou proibido (Lei nº 13.964/2019).<br><span class="pena">Pena — reclusão, de 12 a 30 anos</span><br><br><strong>IX</strong> — contra menor de 14 anos (Lei nº 14.344/2022).<br><span class="pena">Pena — reclusão, de 12 a 30 anos</span></div>
   <p><strong>§ 2º-B</strong> — A pena do homicídio contra menor de 14 anos é aumentada de: <strong>1/3 até a metade</strong> se a vítima é pessoa com deficiência ou doença que aumente sua vulnerabilidade; <strong>2/3</strong> se o autor é ascendente, padrasto, madrasta, tio, irmão, cônjuge, companheiro, tutor, curador, preceptor ou empregador, ou tem autoridade sobre a vítima; <strong>2/3</strong> se praticado em instituição de educação básica (Lei nº 14.811/2024).</p>
   <h4 style="margin-top:26px">Homicídio culposo (§ 3º)</h4>
   <div class="artigo"><strong>§ 3º</strong> Se o homicídio é culposo: <span class="pena">Pena — detenção, de 1 a 3 anos</span></div>
   <p>Pune-se quando o agente provoca a morte por <strong>negligência, imprudência ou imperícia</strong>.</p>
   <div class="caracteristicas-grid">
     <div class="carac-card"><div class="carac-num">I</div><h4>Negligência</h4><p class="small muted">Deixa de tomar a atitude esperada para a situação.</p></div>
     <div class="carac-card"><div class="carac-num">II</div><h4>Imprudência</h4><p class="small muted">Toma atitude precipitada, sem a cautela exigida, com desleixo.</p></div>
     <div class="carac-card"><div class="carac-num">III</div><h4>Imperícia</h4><p class="small muted">Age sem possuir a qualificação necessária para o ato.</p></div>
   </div>
   <div class="callout callout-warning"><strong>Competência:</strong> o homicídio culposo <strong>não vai ao Tribunal do Júri</strong>, que julga apenas crimes dolosos contra a vida. É processado perante juiz singular, pelo rito comum.</div>
   <p><strong>§ 4º — causas de aumento (1/3):</strong> inobservância de regra técnica de profissão, arte ou ofício; ou deixar de prestar imediato socorro, não procurar diminuir as consequências, ou fugir para evitar prisão em flagrante.</p>
   <div class="callout"><strong>Inobservância de regra técnica ≠ imperícia.</strong> Aqui o agente <strong>possui</strong> a qualificação, mas age com negligência ao não seguir as regras — como o profissional de saúde que deixa de esterilizar os instrumentos.</div>
   <p><strong>§ 5º — perdão judicial:</strong> o juiz pode deixar de aplicar a pena se as consequências da infração atingirem o próprio agente de forma tão grave que a sanção se torne desnecessária. Gera extinção da punibilidade (art. 107, IX).</p>
   <p><strong>§ 6º</strong> — aumento de 1/3 até a metade se praticado por <strong>milícia privada</strong> sob pretexto de segurança, ou por <strong>grupo de extermínio</strong>.</p>`},
  {id:"pe2-7", h:"Vicaricídio (art. 121-B)", body:`
   <span class="badge badge-lei">Art. 121-B do CP</span>
   <p>Tipifica a chamada <strong>violência vicária</strong>: quando o agressor ataca alguém ligado à mulher para atingi-la emocionalmente.</p>
   <div class="artigo"><strong>Art. 121-B.</strong> Matar descendente, ascendente, dependente, enteado ou pessoa sob guarda ou responsabilidade direta da mulher, com o <strong>fim específico</strong> de causar-lhe sofrimento, punição ou controle, no contexto de violência doméstica e familiar.<br><span class="pena">Pena — reclusão, de 20 a 40 anos</span><br><br><strong>Parágrafo único.</strong> A pena é aumentada de <strong>1/3 até a metade</strong> se o crime for praticado:<br>I – na presença da mulher a quem se pretende causar sofrimento, punição ou controle;<br>II – contra criança ou adolescente ou pessoa idosa ou com deficiência;<br>III – em descumprimento de medida protetiva de urgência.</div>
   <div class="callout callout-warning">É <strong>crime hediondo</strong>, incluído na Lei nº 8.072/90.</div>
   <p><strong>Vítimas abrangidas:</strong> descendentes (filhos, netos), ascendentes (pais, avós), dependentes, enteados ou pessoas sob guarda ou responsabilidade direta da mulher.</p>
   <div class="callout">O elemento decisivo é o <strong>fim específico</strong>: causar sofrimento, punição ou controle sobre a mulher. Sem esse elemento subjetivo especial, o fato será outro crime.</div>`},
  {id:"pe2-8", h:"Infanticídio (art. 123)", body:`
   <span class="badge badge-lei">Art. 123 do CP</span>
   <p>É o ato de a mãe matar o próprio filho, <strong>durante o parto ou logo após</strong>, sob a <strong>influência do estado puerperal</strong>.</p>
   <div class="artigo"><span class="pena">Pena — detenção, de 2 a 6 anos</span></div>
   <p>Trata-se de espécie de homicídio privilegiado, um <em>delictum exceptum</em>, tipificado de modo autônomo para mitigar as consequências penais.</p>
   <h4 style="margin-top:24px">Os dois critérios históricos</h4>
   <div class="table-wrap"><table class="styled-table">
   <tr><th>Critério</th><th>Fundamento</th><th>Adotado?</th></tr>
   <tr><td><strong>Psicológico</strong></td><td>Motivo de honra — gravidez de relações ilícitas, temor da desonra e da reprovação social</td><td><strong>Não</strong></td></tr>
   <tr><td><strong>Fisiológico</strong> (ou fisiopsíquico)</td><td>Influência do estado puerperal: perturbações físico-psíquicas sofridas durante o parto (dores, perda de sangue, esforço muscular) que atenuam a imputabilidade</td><td><strong>Sim</strong></td></tr></table></div>
   <p><strong>Estado puerperal</strong> é a situação transitória enfrentada pela mulher durante ou após o parto, com alterações físicas e psíquicas que podem abalar suas faculdades mentais, reduzindo-lhe a capacidade de discernimento.</p>
   <div class="callout"><strong>Prova e presunção:</strong> praticada a conduta durante o parto ou imediatamente após, <strong>presume-se</strong> a influência do estado puerperal, cabendo à acusação afastar a presunção. Com a passagem do tempo (muitas horas ou dias), <strong>inverte-se a presunção</strong>, passando à defesa o ônus de demonstrar a influência.</div>
   <p>A prova é difícil na prática: o exame pericial é feito dias depois, em condições diversas, e o crime geralmente ocorre sem testemunhas.</p>`},
  {id:"pe2-9", h:"Infanticídio: sujeitos, concurso e classificação", body:`
   <div class="table-wrap"><table class="styled-table">
   <tr><th>Elemento</th><th>Conteúdo</th></tr>
   <tr><td><strong>Objeto jurídico</strong></td><td>A vida humana, tanto do <strong>nascente</strong> (durante o parto) quanto do <strong>neonato</strong> (recém-nascido)</td></tr>
   <tr><td><strong>Sujeito ativo</strong></td><td>A mãe da criança — <strong>crime próprio</strong></td></tr>
   <tr><td><strong>Sujeito passivo</strong></td><td>O próprio filho. Como se exige qualidade especial também aqui, parte da doutrina classifica como <strong>crime bipróprio</strong></td></tr>
   <tr><td><strong>Tipo subjetivo</strong></td><td>Dolo direto ou eventual. <strong>Não admite forma culposa</strong></td></tr>
   <tr><td><strong>Ação penal</strong></td><td>Pública incondicionada</td></tr>
   <tr><td><strong>Competência</strong></td><td>Tribunal do Júri (CF, art. 5º, XXXVIII)</td></tr></table></div>
   <p><strong>Infanticídio putativo:</strong> se a genitora, nas circunstâncias do art. 123, voltar-se contra outra criança acreditando ser seu filho, responde por infanticídio — aplicam-se as regras do <strong>art. 20, § 3º</strong>, considerando-se as qualidades da vítima <em>virtual</em>, não da vítima <em>real</em>.</p>
   <h4 style="margin-top:24px">Concurso de agentes: três posições</h4>
   <div class="caracteristicas-grid">
     <div class="carac-card"><div class="carac-num">POSIÇÃO A</div><h4>Homicídio</h4><p class="small muted">O estado puerperal seria circunstância personalíssima, incomunicável. Invoca-se ainda a cooperação dolosamente distinta (art. 29, § 2º).</p></div>
     <div class="carac-card"><div class="carac-num">POSIÇÃO B</div><h4>Posição mista</h4><p class="small muted">Homicídio se o terceiro praticar ato executório; infanticídio se tiver participação apenas acessória.</p></div>
     <div class="carac-card"><div class="carac-num">PREDOMINA</div><h4>Infanticídio</h4><p class="small muted">Teoria monista (art. 29). Pelo art. 30, condições pessoais não se comunicam <strong>salvo quando elementares</strong> — e a influência do estado puerperal é elementar do tipo.</p></div>
   </div>
   <div class="callout">O próprio <strong>Nelson Hungria</strong>, um dos principais defensores da primeira corrente, posteriormente mudou de posição e passou a adotar o entendimento predominante.</div>
   <div class="callout callout-warning"><strong>Vedação ao bis in idem:</strong> as agravantes do art. 61, II, "e" (crime contra descendente) e "h" (contra criança) são <strong>inaplicáveis</strong> ao infanticídio, por já integrarem o próprio tipo penal.</div>
   <p><strong>Classificação:</strong> crime próprio; material; instantâneo; unissubjetivo; comissivo ou omissivo; de dano; de forma livre; não transeunte; plurissubsistente em regra; <strong>admite tentativa</strong>.</p>`},
  {id:"pe2-10", h:"Infanticídio: distinções e concurso de crimes", body:`
   <div class="table-wrap"><table class="styled-table">
   <tr><th>Situação</th><th>Crime</th></tr>
   <tr><td>Matar o próprio filho <strong>fora</strong> das hipóteses do art. 123 (sem estado puerperal ou fora do elemento temporal)</td><td>Homicídio (art. 121)</td></tr>
   <tr><td>Agressão contra o feto <strong>antes</strong> do parto</td><td>Aborto (arts. 124 e ss.)</td></tr>
   <tr><td>Expor ou abandonar recém-nascido para <strong>ocultar desonra própria</strong></td><td>Art. 134 — não exige imediatidade nem estado puerperal</td></tr>
   <tr><td>Abandono decorrente do estado puerperal, logo após o parto</td><td>Apenas art. 123 — o abandono é meio para a prática</td></tr>
   <tr><td>Após o infanticídio, destruir, subtrair ou ocultar o cadáver</td><td>Infanticídio em <strong>concurso material</strong> com o art. 211</td></tr></table></div>
   <div class="callout"><strong>Infanticídio culposo?</strong> Duas correntes: para uma, a mãe responderia por homicídio culposo (art. 121, § 3º), pois não há ressalva legal. Para outra, o fato é <strong>atípico</strong>: se o legislador deslocou a conduta para o art. 123 e previu punição apenas para a figura dolosa, é porque pretendeu excluir a culposa.</div>`},
  {id:"pe2-11", h:"Induzimento ou auxílio a suicídio e automutilação (art. 122)", body:`
   <span class="badge badge-lei">Art. 122 do CP — Lei nº 13.968/2019</span>
   <div class="artigo"><strong>Art. 122.</strong> Induzir ou instigar alguém a suicidar-se ou a praticar automutilação ou prestar-lhe auxílio material para que o faça:<br><span class="pena">Pena — reclusão, de 6 meses a 2 anos</span></div>
   <div class="table-wrap"><table class="styled-table">
   <tr><th>Conduta</th><th>Significado</th></tr>
   <tr><td><strong>Induzir</strong></td><td>Criar na mente da vítima a ideia, até então inexistente</td></tr>
   <tr><td><strong>Instigar</strong></td><td>Estimular, reforçar ideia <strong>preexistente</strong></td></tr>
   <tr><td><strong>Prestar auxílio</strong></td><td>Participar materialmente no cometimento</td></tr></table></div>
   <p><strong>Bem jurídico:</strong> vida humana ou integridade corporal. <strong>Sujeito ativo:</strong> qualquer pessoa (crime comum). <strong>Sujeito passivo:</strong> pessoa capaz. <strong>Ação penal:</strong> pública incondicionada.</p>
   <div class="callout callout-warning"><strong>Natureza formal:</strong> após a Lei nº 13.968/2019, o <em>caput</em> é crime <strong>formal puro</strong> — consuma-se com a simples conduta de induzir, instigar ou auxiliar, independentemente de a vítima efetivamente atentar contra a própria vida ou corpo. Antes da lei, o entendimento majoritário o via como material.</div>
   <h4 style="margin-top:24px">Formas qualificadas</h4>
   <div class="artigo"><strong>§ 1º</strong> Se da automutilação ou da tentativa de suicídio resulta lesão corporal de natureza <strong>grave ou gravíssima</strong>: <span class="pena">reclusão, de 1 a 3 anos</span><br><br><strong>§ 2º</strong> Se o <strong>suicídio se consuma</strong> ou se da automutilação resulta <strong>morte</strong>: <span class="pena">reclusão, de 2 a 6 anos</span></div>
   <h4 style="margin-top:24px">Causas de aumento</h4>
   <ul class="styled-list">
     <li><strong>§ 3º — pena duplicada:</strong> I – motivo egoístico, torpe ou fútil; II – vítima menor (maior de 14 e menor de 18 anos) ou com capacidade de resistência diminuída</li>
     <li><strong>§ 4º — até o dobro:</strong> conduta realizada por rede de computadores, rede social ou transmissão em tempo real, contra pessoa determinada</li>
     <li><strong>§ 5º — metade:</strong> se o agente é <strong>líder ou coordenador</strong> de grupo ou rede virtual</li>
   </ul>
   <h4 style="margin-top:24px">Desclassificação (§§ 6º e 7º)</h4>
   <div class="table-wrap"><table class="styled-table">
   <tr><th>Hipótese</th><th>Vítima</th><th>Responde por</th></tr>
   <tr><td>§ 6º — resulta lesão gravíssima</td><td>Menor de 14 anos, ou sem discernimento, ou que não pode resistir</td><td><strong>Lesão gravíssima</strong> (art. 129, § 2º) — reclusão de 2 a 8 anos</td></tr>
   <tr><td>§ 7º — suicídio consumado ou morte</td><td>Menor de 14 anos, ou sem discernimento, ou que não pode resistir</td><td><strong>Homicídio</strong> (art. 121) — reclusão de 6 a 20 anos</td></tr></table></div>
   <div class="callout">A lógica é a mesma nos dois parágrafos: diante de vítima vulnerável, o agente responde pelo crime <strong>mais grave</strong>, cuja pena é superior à do tipo qualificado do art. 122.</div>
   <p class="small muted" style="margin-top:20px">Este é um tema sensível. Se em algum momento o assunto deixar de ser apenas acadêmico para você, vale conversar com alguém de confiança — e o CVV atende de graça pelo 188, 24 horas por dia.</p>`}],
 casos:[
  {t:"Homem mata a ex-companheira por não aceitar o fim do relacionamento", resumo:"Após semanas de ameaças, o agente mata a ex-companheira na frente do filho de ambos, descumprindo medida protetiva.", detalhe:"Configura feminicídio (art. 121-A), pois a motivação é de gênero — o agente não aceita que ela tenha 'direito' de se separar. Incidem duas causas de aumento do § 2º: inciso III (presença física de descendente da vítima) e inciso IV (descumprimento de medida protetiva de urgência). Sendo crime hediondo, e não cabendo privilégio ao art. 121-A, a pena parte de 20 a 40 anos com o acréscimo de 1/3 até a metade."},
  {t:"Agressor mata o filho da companheira para puni-la", resumo:"No contexto de violência doméstica, o agente mata o enteado com o propósito declarado de fazer a mãe sofrer.", detalhe:"É o vicaricídio do art. 121-B: matar enteado com o fim específico de causar sofrimento, punição ou controle à mulher, no contexto de violência doméstica. Crime hediondo, pena de 20 a 40 anos. Se praticado na presença dela, ou sendo a vítima criança ou adolescente, incide o aumento de 1/3 até a metade do parágrafo único."},
  {t:"A enfermeira que ajudou a parturiente", resumo:"Logo após o parto, a mãe, sob influência do estado puerperal, decide matar o recém-nascido, e uma terceira pessoa a auxilia materialmente.", detalhe:"Pela posição predominante, ambas respondem por infanticídio. O Código adotou a teoria monista (art. 29), e o art. 30 estabelece que condições pessoais não se comunicam salvo quando elementares — e a influência do estado puerperal é elementar do tipo do art. 123. Não se trata de cooperação dolosamente distinta, pois a intenção de ambas é a morte da criança."}]},

{ id:3, title:"Aborto e lesão corporal", subtitle:"Aula 3 — Arts. 124 a 128 e o art. 129 do Código Penal.",
 sections:[
  {id:"pe3-1", h:"Espécies de aborto", body:`
   <div class="table-wrap"><table class="styled-table">
   <tr><th>Espécie</th><th>Definição</th><th>É crime?</th></tr>
   <tr><td><strong>Criminoso</strong></td><td>Interrupção dolosa da gravidez (arts. 124 a 127)</td><td>Sim</td></tr>
   <tr><td><strong>Legal ou permitido</strong></td><td>Necessário/terapêutico e sentimental/humanitário (art. 128)</td><td><strong>Não</strong>, por expressa previsão legal</td></tr>
   <tr><td><strong>Eugênico ou eugenésico</strong></td><td>Evitar nascimento com graves deformidades genéticas</td><td>Sim — o direito brasileiro não autoriza</td></tr>
   <tr><td><strong>Econômico ou social</strong></td><td>Evitar agravar a miserabilidade da mãe ou da família</td><td>Sim — não acolhido pelo direito penal brasileiro</td></tr></table></div>
   <div class="callout">Em todas as figuras, o bem jurídico tutelado é único: <strong>o direito à vida, do qual o feto é titular</strong>.</div>`},
  {id:"pe3-2", h:"Autoaborto e consentimento (art. 124)", body:`
   <div class="artigo"><strong>Art. 124.</strong> Provocar aborto em si mesma ou consentir que outrem lho provoque:<br><span class="pena">Pena — detenção, de 1 a 3 anos</span></div>
   <p>O artigo abrange <strong>duas figuras</strong>:</p>
   <div class="caracteristicas-grid">
     <div class="carac-card"><div class="carac-num">1ª PARTE</div><h4>Autoaborto</h4><p class="small muted">A gestante efetua contra si o procedimento por qualquer meio: golpes, quedas propositais, ingestão de medicamentos abortivos.</p></div>
     <div class="carac-card"><div class="carac-num">2ª PARTE</div><h4>Consentimento para o aborto</h4><p class="small muted">A grávida não pratica o aborto, mas autoriza terceiro — que não precisa ser médico — a fazê-lo.</p></div>
   </div>
   <div class="callout callout-warning"><strong>Exceção à teoria monista (art. 29):</strong> no consentimento para o aborto, a gestante é autora do art. 124, 2ª parte, enquanto o terceiro que provoca o aborto é autor do <strong>art. 126</strong>. São os chamados <strong>crimes de encontro</strong> ou bilaterais.</div>
   <p><strong>Concurso de pessoas no autoaborto:</strong> é <strong>crime de mão própria</strong>, mas compatível com participação. O namorado que fornece o medicamento abortivo à gestante responde pelo mesmo crime, como <strong>partícipe</strong> — desde que não pratique manobras abortivas. Se as praticar, recai no art. 126.</p>
   <p><strong>Jurisprudência (TJSP):</strong> incide no art. 126, e não no art. 124, aquele que emprega pessoalmente meios abortivos na gestante e ainda a conduz à parteira, remunerando-a para provocar o aborto.</p>
   <div class="callout">As penas do art. 124 são de <strong>detenção de 1 a 3 anos</strong>, compatíveis com a <strong>suspensão condicional do processo</strong> do art. 89 da Lei nº 9.099/95 (pena mínima igual ou inferior a 1 ano).</div>`},
  {id:"pe3-3", h:"Aborto sofrido (art. 125)", body:`
   <p>É o aborto provocado por terceiro <strong>sem o consentimento</strong> da gestante — figura mais grave. Ocorre em duas hipóteses:</p>
   <ul class="styled-list">
     <li><strong>Não houve consentimento algum</strong> — ex.: agressão pelo antigo namorado, medicamento abortivo colocado na comida, gestante empurrada da escada</li>
     <li><strong>Houve consentimento inválido</strong>, por enquadrar-se no art. 126, parágrafo único</li>
   </ul>
   <div class="table-wrap"><table class="styled-table">
   <tr><th>Vício do consentimento</th><th>Tipo de dissenso</th></tr>
   <tr><td>Gestante <strong>não maior de 14 anos</strong></td><td>Presumido</td></tr>
   <tr><td>Gestante alienada ou débil mental</td><td>Presumido</td></tr>
   <tr><td>Consentimento obtido mediante fraude, grave ameaça ou violência</td><td>Real</td></tr></table></div>
   <div class="callout"><strong>Gravidez múltipla:</strong> conhecendo o terceiro a existência de gêmeos ou mais, responde por dois ou mais abortos em <strong>concurso formal imperfeito</strong> (art. 70). Se desconhecia o número de fetos, responde por um único crime — afasta-se a responsabilidade penal objetiva.</div>`},
  {id:"pe3-4", h:"Aborto consentido (art. 126) e validade do consentimento", body:`
   <p>Aplica-se <strong>somente ao terceiro</strong> que pratica o aborto com o consentimento válido da gestante. Ela responde pelo art. 124; ele, pelo art. 126 — por força da exceção à teoria monista. Decidiu-se tratar a mulher de forma mais branda em razão dos abalos físicos e mentais que ela enfrenta.</p>
   <div class="callout callout-warning"><strong>O consentimento deve persistir até a consumação.</strong> Se durante o procedimento a gestante se arrepender e pedir a interrupção das manobras, mas não for obedecida, para ela o fato é <strong>atípico</strong> e o terceiro responde pelo <strong>art. 125</strong>.</div>
   <p>O consentimento pode ser verbal, escrito, ou resultar da própria conduta — como quando a gestante coopera com movimentos corpóreos.</p>
   <h4 style="margin-top:24px">Idade e validade do consentimento</h4>
   <div class="table-wrap"><table class="styled-table">
   <tr><th>Idade da gestante</th><th>Consentimento</th><th>Consequência</th></tr>
   <tr><td>Não maior de 14 anos</td><td><strong>Inválido</strong></td><td>O médico responde pelo art. 125 (aborto sem consentimento)</td></tr>
   <tr><td>Maior de 14 e menor de 18</td><td><strong>Válido</strong></td><td>Ela pratica ato infracional análogo a crime, apurado na Vara da Infância e Juventude</td></tr>
   <tr><td>Maior de 18 anos</td><td>Válido</td><td>Responde pelo art. 124 perante a Justiça Comum</td></tr></table></div>
   <div class="callout"><strong>Caso da gestante de 15 anos levada pelo namorado à clínica:</strong> ela responde por ato infracional (consentimento para aborto) na Vara da Infância; o namorado, partícipe, responde perante a Justiça Comum se maior de idade; e o médico incorre no art. 126.</div>
   <div class="callout callout-warning"><strong>Menor de 14 anos:</strong> a gravidez leva à conclusão de que houve <strong>estupro de vulnerável</strong> (art. 217-A). Nessa hipótese o aborto é permitido, mas apenas com <strong>autorização dos representantes legais</strong>, conforme o art. 128, II.</div>
   <p><strong>Consentimento fraudulento:</strong> médico e pai da criança que falsificam exame e convencem a gestante de que a gravidez a mataria respondem por aborto <strong>sem</strong> consentimento. Para a gestante enganada, o fato não é crime.</p>`},
  {id:"pe3-5", h:"Aborto qualificado (art. 127)", body:`
   <p>Embora o legislador use a expressão "formas qualificadas", o art. 127 contém, em verdade, <strong>duas causas de aumento de pena</strong>.</p>
   <div class="callout callout-warning">Aplicam-se <strong>apenas aos arts. 125 e 126</strong> — ou seja, incidem somente sobre o <strong>terceiro</strong>, nunca sobre a gestante.</div>
   <p>São hipóteses de <strong>crime qualificado pelo resultado, de natureza preterdolosa</strong>: pune-se o aborto na modalidade <strong>dolosa</strong> e o resultado agravador (lesão grave ou morte da gestante) a título de <strong>culpa</strong>.</p>
   <div class="artigo"><strong>Art. 19 do CP</strong> — Pelo resultado que agrava especialmente a pena, só responde o agente que o houver causado ao menos culposamente.</div>
   <div class="table-wrap"><table class="styled-table">
   <tr><th>Situação</th><th>Consequência</th></tr>
   <tr><td>Dolo no aborto, culpa no resultado agravador</td><td>Aborto qualificado (art. 127) — preterdolo</td></tr>
   <tr><td>Dolo (direto ou eventual) em <strong>ambos</strong></td><td>Aborto <strong>e</strong> lesão grave ou homicídio, em concurso material ou formal imperfeito</td></tr>
   <tr><td>Mata a mulher dolosamente, <strong>ciente</strong> da gravidez</td><td>Homicídio doloso <strong>e</strong> aborto — há ao menos dolo eventual quanto ao aborto</td></tr>
   <tr><td>Mata a mulher dolosamente, <strong>ignorando</strong> a gravidez</td><td>Apenas homicídio doloso — exclui-se o aborto, sob risco de responsabilidade penal objetiva</td></tr></table></div>`},
  {id:"pe3-6", h:"Aborto legal (art. 128) e anencefalia", body:`
   <p>O art. 128 traz duas <strong>causas especiais de exclusão da ilicitude</strong>: o fato é típico, mas <strong>não há crime</strong>.</p>
   <div class="caracteristicas-grid">
     <div class="carac-card"><div class="carac-num">INCISO I</div><h4>Aborto necessário ou terapêutico</h4><p class="small muted">Conflito entre a vida da gestante e a do feto. Por política criminal, optou-se pela <strong>vida humana madura</strong>.</p></div>
     <div class="carac-card"><div class="carac-num">INCISO II</div><h4>Aborto sentimental ou humanitário</h4><p class="small muted">Gravidez resultante de estupro. Fundamento: <strong>dignidade da pessoa humana</strong> (CF, art. 1º, III).</p></div>
   </div>
   <p><strong>Requisitos do aborto necessário:</strong> que a vida da gestante corra perigo em razão da gravidez; e que não exista outro meio de salvá-la. O risco <strong>não precisa ser atual</strong> — basta que exista e seja atestado por médico.</p>
   <div class="callout callout-warning"><strong>Ponto de prova:</strong> por ser a vida bem indisponível, <strong>não é necessário o consentimento</strong> da gestante para o aborto necessário, nem autorização judicial. A decisão recai sobre o médico.</div>
   <p><strong>Requisitos do aborto sentimental:</strong> ser realizado por médico; haver consentimento válido da gestante ou do representante legal, se incapaz; e ser a gravidez resultante de estupro.</p>
   <div class="callout">No <strong>estupro de vulnerável</strong>, aplica-se <strong>analogia <em>in bonam partem</em></strong>, autorizando o aborto. Apenas o médico está habilitado a realizar os abortos permitidos.</div>
   <h4 style="margin-top:26px">Feto anencefálico e a ADPF 54</h4>
   <p><strong>Anencefalia</strong> é a malformação do tubo neural caracterizada pela ausência do encéfalo e da calota craniana, ocorrida entre o 16º e o 26º dia de gestação. A medicina a considera <strong>patologia letal</strong>: não há atividade cerebral nem possibilidade de vida independente.</p>
   <div class="callout callout-success">No julgamento da <strong>ADPF 54/DF</strong>, ajuizada pela CNTS, o <strong>STF declarou inconstitucional</strong> a interpretação segundo a qual a interrupção da gravidez de feto anencéfalo seria conduta tipificada nos arts. 124, 126 e 128, I e II, do CP. Reconheceu-se o direito da gestante à <strong>antecipação terapêutica de parto</strong>, previamente diagnosticada por profissional habilitado, <strong>sem autorização judicial</strong>.</div>
   <p>O fundamento: nesses casos não há vida em potencial, e sim a <strong>certeza da morte</strong> — incompatibilidade com a vida extrauterina —, razão pela qual não se pode falar em aborto.</p>`},
  {id:"pe3-7", h:"Lesão corporal (art. 129): tipo básico e formas graves", body:`
   <div class="artigo"><strong>Art. 129.</strong> Ofender a integridade corporal ou a saúde de outrem:<br><span class="pena">Pena — detenção, de 3 meses a 1 ano</span></div>
   <h4 style="margin-top:22px">Lesão de natureza GRAVE (§ 1º)</h4>
   <div class="artigo">I – incapacidade para as ocupações habituais, por mais de <strong>30 dias</strong>;<br>II – perigo de vida;<br>III – debilidade permanente de membro, sentido ou função;<br>IV – aceleração de parto.<br><span class="pena">Pena — reclusão, de 1 a 5 anos</span></div>
   <h4 style="margin-top:22px">Lesão de natureza GRAVÍSSIMA (§ 2º)</h4>
   <div class="artigo">I – incapacidade permanente para o trabalho;<br>II – enfermidade incurável;<br>III – perda ou inutilização do membro, sentido ou função;<br>IV – deformidade permanente;<br>V – aborto.<br><span class="pena">Pena — reclusão, de 2 a 8 anos</span></div>
   <div class="callout"><strong>Macete para não confundir:</strong> a <strong>grave</strong> tem quatro incisos e traz situações <em>temporárias ou de risco</em> (30 dias, perigo de vida, debilidade, aceleração de parto). A <strong>gravíssima</strong> tem cinco incisos e traz situações <em>permanentes ou definitivas</em> (incapacidade permanente, enfermidade incurável, perda, deformidade, aborto).</div>
   <h4 style="margin-top:22px">Lesão seguida de morte (§ 3º)</h4>
   <div class="artigo">Se resulta morte e as circunstâncias evidenciam que o agente <strong>não quis o resultado nem assumiu o risco</strong> de produzi-lo:<br><span class="pena">Pena — reclusão, de 4 a 12 anos</span></div>
   <p>É <strong>crime preterdoloso</strong>: dolo na lesão, culpa na morte. Ex.: agride com um soco, a vítima bate a cabeça e morre da pancada.</p>`},
  {id:"pe3-8", h:"Lesão corporal: privilégio, forma culposa e aumentos", body:`
   <p><strong>§ 4º — diminuição de pena:</strong> se o agente comete o crime impelido por motivo de relevante valor social ou moral, ou sob o domínio de violenta emoção logo em seguida a injusta provocação da vítima, o juiz pode reduzir a pena de <strong>1/6 a 1/3</strong>. Note o paralelo exato com o homicídio privilegiado.</p>
   <p><strong>§ 5º — substituição por multa:</strong> não sendo graves as lesões, o juiz pode substituir a detenção por multa: I – nas hipóteses do § 4º; II – se as <strong>lesões são recíprocas</strong>.</p>
   <div class="artigo"><strong>§ 6º — Lesão corporal culposa</strong><br><span class="pena">Pena — detenção, de 2 meses a 1 ano</span></div>
   <p><strong>§ 7º</strong> — aumento de 1/3 nas hipóteses dos §§ 4º e 6º do art. 121 (inobservância de regra técnica, omissão de socorro, fuga; milícia privada ou grupo de extermínio).</p>
   <p><strong>§ 8º</strong> — aplica-se à lesão culposa o <strong>perdão judicial</strong> do art. 121, § 5º.</p>`},
  {id:"pe3-9", h:"Lesão corporal: violência doméstica e formas especiais", body:`
   <div class="artigo"><strong>§ 9º — Violência doméstica</strong><br>Se a lesão for praticada contra ascendente, descendente, irmão, cônjuge ou companheiro, ou com quem conviva ou tenha convivido, ou ainda prevalecendo-se o agente das relações domésticas, de coabitação ou de hospitalidade:<br><span class="pena">Pena — detenção, de 2 a 5 anos</span></div>

const PEN_D = [
 {q:"Explique o homicídio qualificado-privilegiado: é admissível? Quais qualificadoras são compatíveis e qual a consequência quanto à hediondez?", nivel:"difícil", aula:1,
  model:"A figura é objeto de controvérsia doutrinária, mas prevalece o entendimento de que é admissível, desde que a qualificadora seja de natureza objetiva. O fundamento está na natureza das circunstâncias: as do privilégio (relevante valor social ou moral, e violenta emoção logo após injusta provocação) são todas subjetivas, ligadas à motivação do agente. Assim, são incompatíveis com o privilégio as qualificadoras relativas ao motivo — paga ou promessa de recompensa e motivo torpe (§ 2º, I) e motivo fútil (§ 2º, II) —, bem como a relativa ao fim conexo a outro crime (§ 2º, V), pois seria contraditório afirmar simultaneamente que o agente agiu por relevante valor moral e por motivo torpe. Já as qualificadoras relativas ao meio empregado (§ 2º, III) e ao modo de execução (§ 2º, IV) são perfeitamente compatíveis, por serem objetivas. Quanto à hediondez, embora o homicídio qualificado seja crime hediondo (Lei nº 8.072/90, art. 1º, I), o homicídio qualificado-privilegiado NÃO integra esse rol: a lei não faz referência a essa figura, e sua inclusão por extensão violaria o princípio da reserva legal, conforme decidiu o STJ no HC 153.728."},
 {q:"Analise a legítima defesa como tese no Tribunal do Júri: requisitos, excesso e a modalidade putativa.", nivel:"difícil", aula:1, model:"A legítima defesa é excludente de ilicitude do art. 23, II, definida no art. 25: quem, usando moderadamente dos meios necessários, repele injusta agressão, atual ou iminente, a direito seu ou de outrem. São cinco requisitos cumulativos. Primeiro, a agressão deve ser injusta, isto é, contrária ao direito — não cabe legítima defesa contra quem age acobertado por outra excludente. Segundo, deve ser atual ou iminente: agressão já cessada configura vingança, e agressão futura e remota não autoriza a reação, hipóteses em que o agente responde por homicídio. Terceiro, deve dirigir-se a direito próprio ou de terceiro. Quarto, exige-se o uso dos meios necessários, os menos lesivos à disposição do agredido. Quinto, esses meios devem ser empregados moderadamente. Faltando os dois últimos requisitos há excesso, e o parágrafo único do art. 23 determina que o agente responda por ele, a título de dolo ou de culpa. Distingue-se ainda a legítima defesa real da putativa: nesta o agente supõe, por erro, encontrar-se em situação que autorizaria a reação. É descriminante putativa, regida pelo art. 20, § 1º — o erro escusável exclui o dolo, e se evitável o agente responde por culpa. A relevância prática é máxima no Júri: reconhecida a legítima defesa já na primeira fase, o juiz profere absolvição sumária; chegando o caso ao plenário, o reconhecimento pelos jurados leva à absolvição, ainda que a morte tenha efetivamente ocorrido."},
 {q:"Discorra sobre o feminicídio (art. 121-A), diferenciando-o do simples homicídio contra mulher e apontando por que não há inconstitucionalidade no tipo.", nivel:"médio", aula:2,
  model:"O art. 121-A tipifica o homicídio praticado contra mulher por razões da condição do sexo feminino, com pena de reclusão de 20 a 40 anos, sendo crime hediondo. O § 1º esclarece que há razões da condição do sexo feminino quando o crime envolve violência doméstica e familiar (inciso I) ou menosprezo ou discriminação à condição de mulher (inciso II). A questão essencial, que supera o falso debate sobre a constitucionalidade, é compreender que não é feminicídio simplesmente matar mulher. Se assim fosse, haveria notória inconstitucionalidade, pois se estaria atribuindo valoração diversa ao mesmo bem jurídico — a vida humana — em razão do sexo da vítima, discriminando a punição pela morte de homem em relação à de mulher. O que fundamenta o tratamento mais gravoso é a motivação de gênero: o crime praticado por menosprezo, discriminação ou no contexto de violência de gênero. Por isso, ainda que a violência ocorra no ambiente doméstico e a vítima seja mulher, não haverá feminicídio se faltar essa motivação — como no caso de irmãs que disputam herança e uma mata a outra por interesse patrimonial. O sujeito ativo pode ser qualquer pessoa, inclusive mulher; o sujeito passivo deve ser necessariamente do sexo feminino. Registre-se ainda que não se admite feminicídio privilegiado, pois o § 1º do art. 121 refere-se ao próprio art. 121, não alcançando o art. 121-A."},
 {q:"Analise o concurso de agentes no infanticídio, expondo as três correntes e o fundamento da posição predominante.", nivel:"difícil", aula:2,
  model:"A questão consiste em saber se o terceiro que concorre para o crime praticado pela genitora responde por homicídio ou por infanticídio. Há três posições. A primeira sustenta o homicídio, sob dois argumentos: o estado puerperal seria circunstância personalíssima, incomunicável aos comparsas; e haveria cooperação dolosamente distinta (art. 29, § 2º, primeira parte), respondendo a genitora pelo crime mais brando e o terceiro pelo mais grave. A segunda é posição mista: o terceiro responde por homicídio se praticar ato executório, pois o infanticídio pressuporia que o núcleo do tipo fosse praticado exclusivamente pela mãe; mas responde por infanticídio se tiver participação apenas acessória. A terceira corrente, predominante e mais adequada, sustenta o infanticídio para ambos. Seu fundamento está na teoria monista adotada pelo art. 29 ('quem, de qualquer modo, concorre para o crime incide nas penas a este cominadas'), combinada com o art. 30, segundo o qual as circunstâncias e condições de caráter pessoal não se comunicam, salvo quando elementares do crime. Sendo a influência do estado puerperal elementar do tipo do art. 123, ela se comunica aos comparsas por força da ressalva final do dispositivo. Ademais, não há cooperação dolosamente distinta, pois a intenção de ambos é a mesma: a morte da criança. O próprio Nelson Hungria, inicialmente defensor da primeira corrente, posteriormente aderiu a esse entendimento."},
 {q:"Explique a exceção à teoria monista no crime de aborto e suas consequências práticas.", nivel:"médio", aula:3,
  model:"O art. 29 do Código Penal adota a teoria monista ou unitária, segundo a qual todos os que concorrem para o crime respondem pelo mesmo delito, na medida de sua culpabilidade. No aborto consentido, porém, o Código abre exceção expressa. A gestante que não pratica em si o aborto, mas autoriza terceiro a fazê-lo, responde pelo art. 124, segunda parte (consentimento para o aborto), com pena de detenção de 1 a 3 anos. O terceiro que efetivamente provoca o aborto responde por crime diverso, o do art. 126, com pena de reclusão de 1 a 4 anos. São os chamados crimes de encontro ou bilaterais: uma única situação fática gera dois enquadramentos distintos. A razão da diferenciação é político-criminal: decidiu-se tratar a mulher de forma mais branda em razão dos abalos físicos e mentais que ela mesma enfrenta com o aborto. Duas consequências práticas merecem destaque. Primeira: as causas de aumento do art. 127 aplicam-se apenas aos arts. 125 e 126, incidindo somente sobre o terceiro e nunca sobre a gestante. Segunda: o consentimento deve persistir até a consumação — se a gestante se arrepender durante o procedimento e não for atendida, o fato para ela é atípico, e o terceiro responde pelo art. 125, figura mais grave."},
 {q:"Diferencie lesão corporal grave, gravíssima e seguida de morte, indicando os incisos e as penas.", nivel:"médio", aula:3,

const STORAGE_KEY = 'curso-juridico-v1';
function persist(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      subject:state.subject, theme:state.theme, done:state.done, favs:state.favs,
      quiz:state.quiz, flashFilter:state.flashFilter, certName:state.certName,
      route:state.route, scrollY:state.scrollY
    }));
  }catch(e){ /* localStorage indisponível (modo privado, quota excedida etc.) */ }
}
let isResetting = false;
function saveScrollAndPersist(){ if(isResetting) return; state.scrollY = window.scrollY; persist(); }
function loadPersisted(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return;
    const saved = JSON.parse(raw);
    Object.assign(state, saved);
  }catch(e){ /* dado salvo corrompido — mantém o estado padrão */ }
}

  isResetting = true;
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}

}
