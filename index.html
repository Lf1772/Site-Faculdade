/* ============ MATÉRIA 2 — PROCESSO CIVIL ============ */
const PROC_L = [
{ id:1, title:"Jurisdição, ação, processo e procedimento", subtitle:"Aula 1 — 06/08. Os institutos fundamentais e a formação da relação processual.",
 sections:[
  {id:"p1-1", h:"Panorama histórico dos institutos", body:`<div class="caracteristicas-grid">
   <div class="carac-card"><div class="carac-num">I</div><h4>Autotutela</h4><p class="small muted">Solução pela força. Hoje excepcional — sobrevive no <strong>desforço imediato</strong> na posse.</p></div>
   <div class="carac-card"><div class="carac-num">II</div><h4>Arbitragem</h4><p class="small muted">Forma alternativa e <strong>facultativa</strong>, regida pela <strong>Lei nº 9.307/96</strong>.</p></div>
   <div class="carac-card"><div class="carac-num">III</div><h4>Roma</h4><p class="small muted"><em>Juris dictio</em> — "dizer o direito". A figura do <strong>pretor</strong>.</p></div></div>
   <ul class="styled-list"><li><strong>Jurisdição privada</strong> — arbitragem</li><li><strong>Jurisdição pública</strong> — juízes e tribunais</li><li><strong>Jurisdição inerte</strong> — depende de provocação: <strong>CF, art. 5º, XXXV</strong></li></ul>`},
  {id:"p1-2", h:"Processo x Procedimento", body:`<p>O <strong>processo</strong> é o instrumento de realização da jurisdição. O <strong>procedimento</strong> é o rito, o caminho.</p>
   <div class="table-wrap"><table class="styled-table"><tr><th>Conceito</th><th>Espécies</th></tr>
   <tr><td>Processo Civil</td><td>De Execução · De Conhecimento</td></tr>
   <tr><td>Procedimento do Processo de Conhecimento</td><td>Comum · Especiais · Executório</td></tr></table></div>
   <div class="callout">Separe: <strong>processo de conhecimento</strong> é a categoria ampla; <strong>procedimento comum</strong> é o rito geral; <strong>especial</strong> é o rito diferenciado (ex.: Juizados, Lei nº 9.099/95).</div>`},
  {id:"p1-3", h:"Direito de Ação x Ação", body:`<div class="caracteristicas-grid">
   <div class="carac-card"><div class="carac-num">DIREITO DE AÇÃO</div><h4>Abstrato e incondicional</h4><p class="small muted">Direito constitucional de provocar a jurisdição. Existe independentemente de o autor ter razão.</p></div>
   <div class="carac-card"><div class="carac-num">AÇÃO</div><h4>Concreta e condicionada</h4><p class="small muted"><strong>Materializada na petição inicial</strong>. Condicionada à legitimidade das partes e ao interesse processual.</p></div></div>
   <div class="callout">Ter direito de ação não significa vencer. Significa poder obter uma resposta jurisdicional.</div>`},
  {id:"p1-4", h:"A relação jurídica processual", body:`<ul class="styled-list">
   <li><strong>Fato</strong> — acontecimento qualquer</li><li><strong>Fato jurídico</strong> — com repercussão jurídica (dano → indenização)</li>
   <li><strong>Ato jurídico</strong> — depende da vontade humana</li><li><strong>Negócio jurídico</strong> — fato que repercute na economia</li></ul>
   <div class="table-wrap"><table class="styled-table"><tr><th>Sujeito</th><th>Posição</th><th>Papel</th></tr>
   <tr><td>Estado-Juiz</td><td>Sujeito processual, <strong>não é parte</strong></td><td>Exerce a jurisdição, com imparcialidade</td></tr>
   <tr><td>Autor</td><td>Polo ativo · é parte</td><td>Exerce o direito de ação</td></tr>
   <tr><td>Réu</td><td>Polo passivo · é parte</td><td>Exerce o direito de defesa — resistência</td></tr></table></div>`},
  {id:"p1-5", h:"Conceitos avulsos e vocabulário", body:`<ul class="styled-list">
   <li>Voto minerva · Dura lex</li><li>Medida cautelar · Tutela provisória · Liminar</li>
   <li>Citação x intimação</li><li>Juizados especiais</li><li>Embargo de execução · Impugnação</li>
   <li>Expropriação · Ação monitória · Escritura pública</li></ul>
   <div class="callout callout-success"><strong>Fica a dica da aula:</strong> desconfie do estagiário.</div>`}],
 casos:[{t:"Desforço imediato: autotutela que sobreviveu", resumo:"O possuidor esbulhado reage de imediato para retomar a posse.", detalhe:"É a exceção que confirma a regra: o Estado monopoliza a solução de conflitos. Serve em aula para mostrar por que a jurisdição estatal surgiu — substituir a força pela decisão."},
 {t:"Cláusula compromissória de arbitragem", resumo:"Contrato prevê que o conflito será resolvido por arbitragem.", detalhe:"Jurisdição privada da Lei nº 9.307/96. Conecta com a Aula 3: a convenção de arbitragem é preliminar (art. 337, X) e, se não alegada, o §6º considera aceita a jurisdição estatal."}]},
{ id:2, title:"Petição inicial e pronunciamentos do juiz", subtitle:"Aula 2 — 13/08. Requisitos da inicial, máquina judiciária e início do fluxograma.",
 sections:[
  {id:"p2-1", h:"Petição inicial: arts. 319, 320 e 106", body:`<p>A petição inicial é a <strong>materialização da ação</strong>.</p>
   <div class="artigo"><strong>CPC, Art. 319 — A petição inicial indicará:</strong>
   I - o juízo a que é dirigida;<br>II - nomes, prenomes, estado civil, união estável, profissão, CPF ou CNPJ, endereço eletrônico, domicílio e residência do autor e do réu;<br>III - o fato e os fundamentos jurídicos do pedido;<br>IV - o pedido com suas especificações;<br>V - o valor da causa;<br>VI - as provas com que o autor pretende demonstrar a verdade dos fatos;<br>VII - a opção pela realização ou não de audiência de conciliação ou mediação.</div>
   <div class="table-wrap"><table class="styled-table"><tr><th>Inciso</th><th>Observação da aula</th></tr>
   <tr><td>I — Juízo</td><td>Em relação à matéria e ao lugar</td></tr>
   <tr><td>II — Qualificação</td><td>Réu e autor devem estar qualificados</td></tr>
   <tr><td>III — Fatos</td><td>Fato jurídico é o acontecimento com repercussão. Provar de forma clara o dano não reparado, com sustentação na lei</td></tr>
   <tr><td>IV — Pedido</td><td>O juiz julga pedido certo e determinado</td></tr>
   <tr><td>VI — Provas</td><td>Único momento do autor: a petição. Do réu: a contestação. Exceções: fato novo e matéria de ofício</td></tr></table></div>
   <div class="callout"><strong>§§ 1º a 3º:</strong> faltando dados do inciso II, o autor pode requerer diligências; a inicial <strong>não será indeferida</strong> se ainda for possível citar o réu, ou se a obtenção tornar o acesso à justiça excessivamente oneroso.</div>
   <div class="artigo"><strong>CPC, Art. 320</strong> — A inicial será instruída com os documentos indispensáveis à propositura da ação.</div>
   <div class="artigo"><strong>CPC, Art. 106</strong> — Em causa própria, o advogado declara endereço, inscrição na OAB e sociedade. Descumprido, o juiz manda suprir em <strong>5 dias</strong>, sob pena de indeferimento.</div>`},
  {id:"p2-2", h:"Movimentação da máquina judiciária", body:`<p><strong>Vias no processo físico:</strong> 1 permanente (autos), 1 de prova (protocolo carimbado) e 1 para cada réu (contrafé).</p>
   <div class="table-wrap"><table class="styled-table"><tr><th>Nº de réus</th><th>Cálculo</th><th>Total</th></tr>
   <tr><td>1 réu</td><td>1 + 1 + 1</td><td>3 vias</td></tr><tr><td>2 réus</td><td>1 + 1 + 2</td><td>4 vias</td></tr>
   <tr><td>3 réus</td><td>1 + 1 + 3</td><td>5 vias</td></tr><tr><td>10 réus</td><td>1 + 1 + 10</td><td>12 vias</td></tr></table></div>
   <ul class="styled-list"><li><strong>Distribuidor</strong> — órgão auxiliar: certidões e sorteio</li>
   <li><strong>Cartório</strong> — tombamento (livro "tombo") e processamento</li><li><strong>Juiz</strong> — de Direito (Estadual) ou Federal</li></ul>
   <div class="artigo"><strong>CPC, Art. 203, § 4º</strong> — Os atos meramente ordinatórios, como a juntada e a vista obrigatória, independem de despacho, sendo praticados de ofício pelo servidor.</div>`},
  {id:"p2-3", h:"Pronunciamentos do juiz (art. 203)", body:`<div class="artigo"><strong>CPC, Art. 203</strong> — Os pronunciamentos do juiz consistirão em <strong>sentenças</strong>, <strong>decisões interlocutórias</strong> e <strong>despachos</strong>.</div>
   <div class="table-wrap"><table class="styled-table"><tr><th>Pronunciamento</th><th>Definição</th><th>Recurso</th><th>Prazo</th></tr>
   <tr><td><strong>Sentença</strong> (§1º)</td><td>Com fundamento nos arts. 485 e 487, põe fim à fase cognitiva ou extingue a execução</td><td>Apelação</td><td>15 dias</td></tr>
   <tr><td><strong>Interlocutória</strong> (§2º)</td><td>Pronunciamento decisório que não se enquadre no §1º</td><td>Agravo de instrumento (art. 1.015)</td><td>15 dias</td></tr>
   <tr><td><strong>Despacho</strong> (§3º)</td><td>Mero expediente, sem conteúdo decisório</td><td>Irrecorrível</td><td>—</td></tr></table></div>
   <div class="artigo"><strong>CPC, Art. 1.003, § 5º</strong> — Excetuados os embargos de declaração, o prazo para interpor recursos e responder-lhes é de 15 dias.</div>
   <p><strong>Espécies de sentença:</strong></p>
   <ul class="styled-list"><li>Sem resolução de mérito — terminativa (art. 485)</li><li>Com resolução de mérito — definitiva (art. 487)</li><li>Extintiva da execução — declaratória (art. 925)</li></ul>`},
  {id:"p2-4", h:"Juízo de retratação", body:`<p>Retratação é a possibilidade de o juiz reconsiderar sua decisão após o recurso e antes da remessa ao tribunal. Finalidade dupla: <strong>economia processual</strong> e <strong>celeridade</strong>.</p>
   <div class="callout"><strong>Irretratabilidade da sentença (art. 494):</strong> publicada, o juiz só a altera para corrigir inexatidões materiais ou erros de cálculo, ou por embargos de declaração.</div>
   <p><strong>As três hipóteses expressas na apelação:</strong></p>
   <div class="table-wrap"><table class="styled-table"><tr><th>Hipótese</th><th>Artigo</th><th>Prazo</th></tr>
   <tr><td>Indeferimento da petição inicial</td><td>Art. 331, caput</td><td>5 dias</td></tr>
   <tr><td>Improcedência liminar do pedido</td><td>Art. 332, § 3º</td><td>5 dias</td></tr>
   <tr><td>Sentença sem resolução do mérito</td><td>Art. 485, § 7º</td><td>5 dias</td></tr></table></div>
   <div class="artigo"><strong>CPC, Art. 1.018</strong> — § 1º Se o juiz reformar inteiramente a decisão, o relator considera prejudicado o agravo. § 2º Não sendo eletrônicos os autos, o agravante junta cópia em <strong>3 dias</strong>. § 3º O descumprimento, arguido pelo agravado, importa inadmissibilidade.</div>
   <div class="callout callout-warning"><strong>Dúvida da aula:</strong> qual o prazo para o juiz se retratar no agravo? O CPC não fixa prazo expresso.</div>`},
  {id:"p2-5", h:"Fluxograma: da petição à sentença", body:`<p><strong>Defeito sanável — emenda</strong></p>
   <div class="artigo"><strong>CPC, Art. 321</strong> — Não preenchidos os requisitos dos arts. 319 e 320, ou havendo defeitos capazes de dificultar o julgamento, o juiz determina que o autor, em <strong>15 dias</strong>, emende ou complete, <strong>indicando com precisão</strong> o que corrigir. Não cumprida a diligência, indefere a inicial.</div>
   <p><strong>Defeito insanável — indeferimento</strong></p>
   <div class="artigo"><strong>CPC, Art. 330</strong> — A inicial será indeferida quando: I - for inepta; II - a parte for manifestamente ilegítima; III - o autor carecer de interesse processual; IV - não atendidos os arts. 106 e 321.<br><br><strong>§ 1º — Inépcia:</strong> I - faltar pedido ou causa de pedir; II - pedido indeterminado; III - da narração dos fatos não decorrer logicamente a conclusão; IV - pedidos incompatíveis entre si.</div>
   <p>Resultado: <strong>extinção sem resolução do mérito</strong>. Cabe apelação, com retratação em 5 dias (art. 331).</p>
   <p><strong>Improcedência liminar</strong></p>
   <div class="artigo"><strong>CPC, Art. 332</strong> — Nas causas que dispensem instrução, o juiz, <strong>independentemente da citação</strong>, julgará liminarmente improcedente o pedido que contrariar: I - súmula do STF ou STJ; II - acórdão em repetitivos; III - IRDR ou assunção de competência; IV - súmula de TJ sobre direito local.<br><br>§ 1º Também se verificar <strong>decadência ou prescrição</strong>.<br>§ 3º Interposta a apelação, o juiz pode <strong>retratar-se em 5 dias</strong>.<br>§ 4º Havendo retratação, prossegue com citação; não havendo, cita o réu para contrarrazões em 15 dias.</div>
   <div class="callout"><strong>Distinção-chave:</strong> indeferimento extingue <strong>sem</strong> resolução do mérito (vício processual). Improcedência liminar resolve o mérito, rejeitando o pedido.</div>
   <p><strong>Tutela provisória</strong> — de urgência ou evidência. Decisão interlocutória; agravo em 15 dias (art. 1.015, I) e retratação (art. 1.018).</p>`},
  {id:"p2-6", h:"Vocabulário da aula 2", body:`<ul class="styled-list">
   <li>Advogado militante · Pro bono · Honorários sucumbenciais</li><li>Contrato leonino · Litigância de má-fé · Lide temerária</li>
   <li>Litisconsorte ativo e passivo</li><li>Preclusão · Decadência x prescrição</li>
   <li>Embargos de declaração · Desistência x renúncia</li><li>Recursos repetitivos</li></ul>
   <div class="callout"><strong>Caução de rato:</strong> prazo extra de 15 dias, prorrogáveis por mais 15, para o advogado juntar procuração. "Caução" = garantia; "rato" = ratificação. Sob pena de serem havidos como inexistentes os atos praticados. <em>Exemplo: cliente em viagem que precisa ser representado.</em></div>
   <div class="callout callout-success"><strong>Fica a dica da aula:</strong> tudo tem que ter contrato.</div>`}],
 casos:[{t:"Inicial sem CPF do réu", resumo:"O autor não consegue obter o CPF e protocola a inicial sem essa informação.", detalhe:"Os §§ 1º a 3º do art. 319 resolvem: o autor pode requerer diligências; a inicial não será indeferida se ainda for possível a citação, nem se a obtenção do dado tornar o acesso à justiça excessivamente oneroso. É a primazia do julgamento do mérito."},
 {t:"Pedido contra súmula do STJ", resumo:"A causa dispensa instrução e o pedido contraria súmula do STJ.", detalhe:"Art. 332, I: improcedência liminar, sem citação. É sentença de mérito, não extinção por vício. Interposta apelação, o juiz pode retratar-se em 5 dias."}]},
{ id:3, title:"Audiência, citação e contestação", subtitle:"Aula 3 — 20/08. Art. 334 e a resposta do réu.",
 sections:[
  {id:"p3-1", h:"Audiência de conciliação (art. 334)", body:`<div class="artigo"><strong>CPC, Art. 334</strong> — Preenchidos os requisitos essenciais e não sendo caso de improcedência liminar, o juiz designará audiência de conciliação ou mediação com antecedência mínima de <strong>30 dias</strong>, devendo o réu ser citado com pelo menos <strong>20 dias</strong> de antecedência.</div>
   <div class="table-wrap"><table class="styled-table"><tr><th>Parágrafo</th><th>Conteúdo</th></tr>
   <tr><td>§ 2º</td><td>Mais de uma sessão, não excedendo <strong>2 meses</strong> da primeira</td></tr>
   <tr><td>§ 3º</td><td>A intimação do autor é feita na pessoa de seu advogado</td></tr>
   <tr><td>§ 4º</td><td><strong>Não será realizada</strong>: I - desinteresse de ambas as partes; II - quando não se admitir autocomposição</td></tr>
   <tr><td>§ 5º</td><td>Autor indica na <strong>petição inicial</strong>; réu por <strong>petição</strong> com <strong>10 dias</strong> de antecedência</td></tr>
   <tr><td>§ 6º</td><td>No litisconsórcio, o desinteresse deve ser manifestado por <strong>todos</strong></td></tr>
   <tr><td>§ 8º</td><td>Ausência injustificada é <strong>ato atentatório à dignidade da justiça</strong>: multa de até 2%</td></tr>
   <tr><td>§ 11</td><td>A autocomposição será reduzida a termo e <strong>homologada por sentença</strong></td></tr>
   <tr><td>§ 12</td><td>Intervalo mínimo de <strong>20 minutos</strong> entre audiências</td></tr></table></div>
   <p><strong>Na audiência:</strong> pauta → pregão → formação da mesa (juiz ao centro, escrivão e MP, advogados, autor e réu).</p>`},
  {id:"p3-2", h:"Resultados da audiência", body:`<ul class="styled-list">
   <li><strong>Ausente qualquer parte</strong> — conciliação impossível; multa (§8º)</li>
   <li><strong>Rejeitada a conciliação</strong> — segue para a contestação</li>
   <li><strong>Havendo acordo</strong> — lavra-se o termo e o juiz homologa por sentença</li></ul>
   <p>A <strong>lavratura de termo</strong> é a formalização escrita do acordo, garantindo segurança jurídica e prova material.</p>
   <div class="artigo"><strong>CPC, Art. 487</strong> — Haverá resolução de mérito quando o juiz: III - homologar: b) a transação.</div>
   <div class="callout callout-warning"><strong>Pegadinha da aula!</strong> Da sentença que homologa o acordo cabe apelação? <strong>Não.</strong> Não há sucumbência nem prejuízo. A sentença transita em julgado.</div>
   <p><strong>Vício na sentença homologatória?</strong> Não cabe apelação, mas <strong>ação rescisória</strong>.</p>
   <div class="artigo"><strong>CPC, Art. 966</strong> — A decisão de mérito transitada em julgado pode ser rescindida quando: I - prevaricação, concussão ou corrupção do juiz; II - juiz impedido ou juízo absolutamente incompetente; III - dolo, coação, simulação ou colusão; IV - ofensa à coisa julgada; V - violação manifesta de norma jurídica; VI - prova falsa; VII - prova nova; VIII - erro de fato.</div>
   <div class="artigo"><strong>CPC, Art. 975</strong> — O direito à rescisão se extingue em <strong>2 anos</strong> do trânsito em julgado da última decisão.</div>
   <div class="callout"><strong>Passados os 2 anos?</strong> Cabe <strong>querela nullitatis</strong>.</div>`},
  {id:"p3-3", h:"Contestação: prazo e concentração", body:`<div class="artigo"><strong>CPC, Art. 335</strong> — O réu oferece contestação em <strong>15 dias</strong>, cujo termo inicial será:<br>I - da audiência ou da última sessão, sem autocomposição;<br>II - do protocolo do pedido de cancelamento apresentado pelo réu;<br>III - do art. 231, conforme o modo da citação, nos demais casos.</div>
   <div class="table-wrap"><table class="styled-table"><tr><th>Situação</th><th>Termo inicial</th></tr>
   <tr><td>Audiência sem acordo</td><td>Data da audiência ou última sessão</td></tr>
   <tr><td>Réu pediu cancelamento</td><td>Data do protocolo</td></tr>
   <tr><td>Não houve audiência</td><td>Marco do art. 231</td></tr></table></div>
   <div class="artigo"><strong>CPC, Art. 336</strong> — Incumbe ao réu alegar <strong>toda a matéria de defesa</strong>, expondo razões de fato e de direito e especificando as provas.</div>
   <div class="callout"><strong>Concentração da defesa:</strong> atacar item a item. Não se admite contestação genérica.</div>
   <div class="artigo"><strong>CPC, Art. 342</strong> — Depois da contestação, só cabem novas alegações quando: I - direito ou fato superveniente; II - matéria de ofício; III - autorização legal expressa.</div>`},
  {id:"p3-4", h:"Preliminares do art. 337", body:`<div class="artigo"><strong>CPC, Art. 337</strong> — Incumbe ao réu, <strong>antes de discutir o mérito</strong>, alegar:<br>I - inexistência ou nulidade da citação;<br>II - incompetência absoluta e relativa;<br>III - incorreção do valor da causa;<br>IV - inépcia da inicial;<br>V - perempção;<br>VI - litispendência;<br>VII - coisa julgada;<br>VIII - conexão;<br>IX - incapacidade da parte, defeito de representação ou falta de autorização;<br>X - convenção de arbitragem;<br>XI - ausência de legitimidade ou interesse processual;<br>XII - falta de caução;<br>XIII - indevida concessão de gratuidade.</div>
   <div class="table-wrap"><table class="styled-table"><tr><th>Parágrafo</th><th>Conteúdo</th></tr>
   <tr><td>§ 2º</td><td>Ação idêntica: mesmas <strong>partes</strong>, <strong>causa de pedir</strong> e <strong>pedido</strong></td></tr>
   <tr><td>§ 3º</td><td><strong>Litispendência</strong>: repete-se ação <em>em curso</em></td></tr>
   <tr><td>§ 4º</td><td><strong>Coisa julgada</strong>: repete-se ação já decidida com trânsito</td></tr>
   <tr><td>§ 5º</td><td>Excetuadas <strong>convenção de arbitragem</strong> e <strong>incompetência relativa</strong>, o juiz conhece de ofício</td></tr>
   <tr><td>§ 6º</td><td>Não alegar arbitragem implica aceitação da jurisdição estatal</td></tr></table></div>
   <div class="callout callout-warning"><strong>Ponto de prova:</strong> as duas matérias que o juiz <strong>não</strong> conhece de ofício são convenção de arbitragem e incompetência relativa.</div>`},
  {id:"p3-5", h:"Ilegitimidade e ônus da impugnação", body:`<div class="artigo"><strong>CPC, Art. 338</strong> — Alegando o réu ser parte ilegítima, o juiz faculta ao autor, em <strong>15 dias</strong>, a substituição do réu. O autor reembolsa despesas e paga honorários de <strong>3% a 5%</strong> do valor da causa.</div>
   <div class="artigo"><strong>CPC, Art. 339</strong> — Ao alegar ilegitimidade, incumbe ao réu <strong>indicar o sujeito passivo</strong>, sob pena de arcar com despesas e indenizar o autor. O autor pode substituir o réu (§1º) ou incluí-lo como <strong>litisconsorte</strong> (§2º).</div>
   <div class="callout">Os arts. 338 e 339 substituíram a antiga <strong>nomeação à autoria</strong> do CPC/73.</div>
   <div class="artigo"><strong>CPC, Art. 340</strong> — Alegada incompetência, a contestação pode ser protocolada no <strong>foro de domicílio do réu</strong>. § 3º Suspende-se a audiência. § 4º Definida a competência, designa-se nova data.</div>
   <div class="artigo"><strong>CPC, Art. 341</strong> — Incumbe ao réu manifestar-se precisamente sobre as alegações, <strong>presumindo-se verdadeiras as não impugnadas</strong>, salvo: I - inadmissível a confissão; II - falta de instrumento da substância do ato; III - contradição com a defesa em conjunto.<br>Parágrafo único: não se aplica ao defensor público, advogado dativo e curador especial.</div>`},
  {id:"p3-6", h:"Querela nullitatis e conceitos", body:`<div class="table-wrap"><table class="styled-table"><tr><th></th><th>Ação rescisória</th><th>Querela nullitatis</th></tr>
   <tr><td>Base legal</td><td>Art. 966 do CPC</td><td>Sem artigo específico; princípios constitucionais</td></tr>
   <tr><td>Prazo</td><td>2 anos (decadencial)</td><td><strong>Não se submete a prazo</strong></td></tr>
   <tr><td>Hipóteses</td><td>Erro de fato, dolo, violação de norma</td><td>Vícios de ordem pública: ausência de citação, juiz incompetente</td></tr></table></div>
   <p>A querela é sustentada pelo <strong>devido processo legal</strong> (art. 5º, LIV) e pela <strong>ampla defesa</strong> (art. 5º, LV).</p>
   <ul class="styled-list"><li>Autocomposição · Revelia · Juiz leigo</li><li><strong>Dies a quo</strong> (inicial) x <strong>dies ad quem</strong> (final)</li>
   <li>Direitos disponíveis x indisponíveis</li><li>Ônus da prova · Lide temerária</li><li>Coisa julgada material x formal</li></ul>
   <div class="callout callout-warning"><strong>Datas:</strong> Teste em 03/09 · A1 em 24/09.</div>`}],
 casos:[{t:"Réu que não alega a arbitragem", resumo:"Havia cláusula compromissória, mas o réu contesta sem alegá-la.", detalhe:"Pelo art. 337, §6º, a ausência de alegação implica aceitação da jurisdição estatal e renúncia ao juízo arbitral. É uma das duas matérias que o juiz não conhece de ofício."},
 {t:"Acordo homologado com vício, oito anos depois", resumo:"Descobre-se simulação na sentença homologatória, mas já se passaram oito anos.", detalhe:"A rescisória está fora de prazo (art. 975: dois anos). Restaria a querela nullitatis, que não se submete a prazo — desde que o vício seja de ordem pública, como ausência de citação válida. Simulação, em regra, é hipótese do art. 966, III."}]},
{ id:4, title:"Linha do tempo dos recursos", subtitle:"Material complementar. Da apelação ao STF, com base legal e prazos.",
 sections:[
  {id:"p4-1", h:"Ordem lógica dos recursos", body:`<p>Primeiro contra decisões interlocutórias (agravo de instrumento), depois contra decisões finais (apelação), em seguida os tribunais superiores (REsp e RE) e, por fim, os incidentes internos.</p>
   <div class="callout"><strong>Regra de prazo:</strong> 15 dias para praticamente todos (art. 1.003, §5º). Única exceção: <strong>embargos de declaração, 5 dias</strong> (art. 1.023).</div>`},
  {id:"p4-2", h:"Agravo de instrumento (1.015 a 1.020)", body:`<div class="artigo"><strong>CPC, Art. 1.015 — Cabe agravo de instrumento contra decisões que versarem sobre:</strong><br>I - tutelas provisórias;<br>II - mérito do processo;<br>III - rejeição da alegação de convenção de arbitragem;<br>IV - incidente de desconsideração da personalidade jurídica;<br>V - rejeição da gratuidade ou acolhimento de sua revogação;<br>VI - exibição ou posse de documento ou coisa;<br>VII - exclusão de litisconsorte;<br>VIII - rejeição do pedido de limitação do litisconsórcio;<br>IX - admissão ou inadmissão de intervenção de terceiros;<br>X - efeito suspensivo aos embargos à execução;<br>XI - redistribuição do ônus da prova;<br>XIII - outros casos previstos em lei.<br><br>Parágrafo único: também na <strong>liquidação, cumprimento de sentença, execução e inventário</strong>.</div>
   <p><strong>Trâmite:</strong> petição ao tribunal (1.016) → instrução obrigatória (1.017) → relator decide em 5 dias (1.019) → agravado responde em 15 dias → julgamento em até 1 mês (1.020).</p>
   <div class="callout callout-warning"><strong>Não tem efeito suspensivo</strong> (art. 1.026), salvo concessão pelo relator.</div>`},
  {id:"p4-3", h:"Apelação (1.009 a 1.014)", body:`<p>Recurso contra <strong>sentenças</strong>. Prazo de <strong>15 dias</strong>.</p>
   <p><strong>Trâmite:</strong> interposição na origem → contrarrazões em 15 dias (1.010, §1º) → remessa ao tribunal → julgamento colegiado.</p>
   <ul class="styled-list"><li>Pode ter <strong>efeito suspensivo</strong> (art. 1.012)</li>
   <li>O apelado pode pedir reforma nas próprias contrarrazões (1.009, §3º)</li>
   <li>Se ambas as partes apelarem, a do réu depende da do autor (1.009, §1º)</li></ul>`},
  {id:"p4-4", h:"Embargos de declaração (1.022 a 1.026)", body:`<p>Cabem contra <strong>qualquer decisão judicial</strong>. Prazo de <strong>5 dias</strong>.</p>
   <div class="artigo"><strong>CPC, Art. 1.022 — Finalidades:</strong><br>I - esclarecer obscuridade ou eliminar contradição;<br>II - suprir omissão de ponto ou questão;<br>III - corrigir erro material.</div>
   <div class="table-wrap"><table class="styled-table"><tr><th>Característica</th><th>Detalhe</th></tr>
   <tr><td>Efeito suspensivo</td><td>Não tem (art. 1.026)</td></tr>
   <tr><td>Efeito sobre o prazo</td><td><strong>Interrompe</strong> o prazo dos outros recursos</td></tr>
   <tr><td>Protelatórios</td><td>Multa de até 10% e vedação a novos embargos</td></tr>
   <tr><td>Efeitos infringentes</td><td>Se acolhidos, podem alterar a decisão</td></tr></table></div>`},
  {id:"p4-5", h:"Agravo interno (art. 1.021)", body:`<p>Contra <strong>decisão monocrática do relator</strong> — em 2º grau e no STJ/STF. Prazo de <strong>15 dias</strong>.</p>
   <p>A petição impugna <strong>especificamente</strong> os fundamentos (§1º) → agravado responde em 15 dias (§2º) → se julgado manifestamente improcedente por unanimidade, multa de <strong>1% a 5%</strong> do valor atualizado da causa.</p>
   <div class="callout callout-warning"><strong>Nomenclatura:</strong> alguns materiais escrevem "embargo interno". O nome correto é <strong>agravo interno</strong>, do art. 1.021.</div>`},
  {id:"p4-6", h:"REsp, RE e agravo do art. 1.042", body:`<p><strong>REsp (STJ)</strong> por violação a lei federal. <strong>RE (STF)</strong> por violação à Constituição. Arts. 1.029 a 1.041, <strong>15 dias</strong>.</p>
   <ul class="styled-list"><li><strong>Prequestionamento</strong> (art. 1.030, I)</li><li>No RE, <strong>repercussão geral</strong> (art. 1.035)</li>
   <li>Requisitos de admissibilidade (arts. 1.030 e 1.031)</li><li>Interposição no <strong>tribunal de origem</strong>, que pode inadmitir</li></ul>
   <p><strong>Inadmitido</strong>, cabe o <strong>agravo do art. 1.042</strong>, em 15 dias, sem custas. Pode haver retratação; não havendo, remete-se ao tribunal superior. Com REsp e RE juntos, um agravo para cada — primeiro ao STJ, depois ao STF.</p>`},
  {id:"p4-7", h:"Últimas etapas no STJ e STF", body:`<div class="table-wrap"><table class="styled-table"><tr><th>Etapa</th><th>Recurso</th><th>Base legal</th><th>Prazo</th></tr>
   <tr><td>Decisão monocrática no STJ/STF</td><td>Agravo interno</td><td>Art. 1.021</td><td>15 dias</td></tr>
   <tr><td>Julgamento colegiado</td><td>—</td><td>—</td><td>—</td></tr>
   <tr><td>Embargos contra acórdão</td><td>Embargos de declaração</td><td>1.022 a 1.026</td><td>5 dias</td></tr>
   <tr><td>Divergência entre turmas (STJ)</td><td>Embargos de divergência</td><td>1.043 a 1.047</td><td>15 dias</td></tr>
   <tr><td>Embargos acolhidos com efeitos infringentes (STF)</td><td><strong>Não há outro recurso</strong></td><td>—</td><td>—</td></tr></table></div>
   <div class="callout callout-success"><strong>Memorize:</strong> sentença → apelação. Interlocutória agravável → agravo de instrumento. Monocrática do relator → agravo interno. Omissão/contradição/obscuridade → embargos de declaração. Inadmissão de REsp/RE → agravo do 1.042.</div>`}],
 casos:[{t:"Embargos de declaração e o prazo da apelação", resumo:"A parte opõe embargos no terceiro dia após a sentença. O que acontece com o prazo da apelação?", detalhe:"Os embargos interrompem o prazo — não suspendem. Julgados os embargos, os 15 dias da apelação recomeçam integralmente do zero, e não apenas os 12 restantes. Distinção clássica de prova."},
 {t:"Relator nega o agravo monocraticamente", resumo:"O relator decide sozinho, mantendo a decisão de primeiro grau.", detalhe:"Cabe agravo interno em 15 dias (art. 1.021), levando ao colegiado. A petição deve impugnar especificamente os fundamentos; se julgado manifestamente improcedente por unanimidade, multa de 1% a 5%."}]},
{ id:5, title:"Do saneamento à sentença", subtitle:"Complemento — a fase que fecha o procedimento comum: réplica, julgamento conforme o estado, instrução e sentença.",
 sections:[
  {id:"p5-1", h:"Providências preliminares e réplica", body:`<span class="badge badge-comp">Complemento</span>
   <p class="comp-note">Conteúdo acrescentado para completar o tema — não constava no material de aula.</p>
   <p>Apresentada a contestação, o juiz adota as <strong>providências preliminares</strong>: medidas destinadas a resolver questões pendentes, garantir o contraditório e verificar se o processo já pode ser julgado.</p>
   <p>A principal delas é a intimação do autor para a <strong>réplica</strong> — manifestação sobre preliminares, fatos impeditivos, modificativos ou extintivos, e documentos juntados com a contestação.</p>
   <div class="callout">A réplica concretiza o contraditório e impede a <strong>decisão-surpresa</strong>: o juiz não pode decidir com base em argumento relevante sobre o qual a parte não tenha podido se pronunciar (arts. 9º e 10 do CPC).</div>
   <h4 style="margin-top:22px">Revelia</h4>
   <p>Não apresentada a contestação, o réu poderá ser considerado <strong>revel</strong>. O efeito material é a presunção de veracidade das alegações de fato — mas ele <strong>não é automático</strong>.</p>
   <div class="artigo"><strong>CPC, Art. 345 — A revelia não produz o efeito da presunção quando:</strong><br>I - havendo pluralidade de réus, algum deles contestar a ação;<br>II - o litígio versar sobre direitos indisponíveis;<br>III - a petição inicial não estiver acompanhada de instrumento que a lei considere indispensável à prova do ato;<br>IV - as alegações de fato formuladas pelo autor forem inverossímeis ou estiverem em contradição com prova constante dos autos.</div>
   <div class="callout callout-warning"><strong>Não confunda:</strong> revelia é a <em>ausência de contestação</em> (fato processual); os <em>efeitos</em> da revelia são consequência, e podem não incidir. O revel pode intervir no processo a qualquer tempo, recebendo-o no estado em que se encontrar.</div>`},
  {id:"p5-2", h:"Julgamento conforme o estado do processo", body:`<span class="badge badge-comp">Complemento</span>
   <p>Cumpridas as providências preliminares, o juiz avalia se o processo já pode ser encerrado ou se precisa avançar para a prova. São <strong>quatro caminhos possíveis</strong>.</p>
   <div class="table-wrap"><table class="styled-table">
   <tr><th>Possibilidade</th><th>Artigo</th><th>Quando ocorre</th><th>Resultado</th></tr>
   <tr><td>Extinção sem resolução do mérito</td><td>Art. 354</td><td>Há vício ou causa que impede o julgamento do pedido (art. 485)</td><td>Sentença terminativa</td></tr>
   <tr><td>Julgamento antecipado do mérito</td><td>Art. 355</td><td>Não há necessidade de outras provas; ou o réu é revel, com os efeitos aplicáveis</td><td>Sentença de mérito</td></tr>
   <tr><td>Julgamento antecipado <strong>parcial</strong></td><td>Art. 356</td><td>Um ou mais pedidos, ou parcela deles, estão incontroversos ou imediatamente decidíveis</td><td><strong>Decisão interlocutória</strong> de mérito — cabe agravo de instrumento</td></tr>
   <tr><td>Saneamento e organização</td><td>Art. 357</td><td>Ainda há questões de fato ou de direito a organizar e provar</td><td>Processo segue para instrução</td></tr></table></div>
   <div class="callout callout-warning"><strong>Ponto de prova:</strong> o julgamento antecipado <strong>parcial</strong> do mérito (art. 356) resolve mérito, mas por <strong>decisão interlocutória</strong> — logo, o recurso é <strong>agravo de instrumento</strong> (art. 1.015, II), e não apelação. É a exceção que confirma a regra "mérito → apelação".</div>
   <div class="callout">Julgamento antecipado <strong>não</strong> significa ausência de análise. Significa que, diante do material disponível, a produção de novas provas é desnecessária ou inadequada.</div>`},
  {id:"p5-3", h:"Saneamento e organização do processo (art. 357)", body:`<span class="badge badge-comp">Complemento</span>
   <p>Não sendo caso de julgamento imediato, o juiz profere a <strong>decisão de saneamento</strong>. É o planejamento da fase probatória.</p>
   <div class="artigo"><strong>CPC, Art. 357 — Na decisão de saneamento, o juiz deverá:</strong><br>I - resolver as questões processuais pendentes;<br>II - delimitar as questões de fato sobre as quais recairá a atividade probatória;<br>III - definir a distribuição do ônus da prova;<br>IV - delimitar as questões de direito relevantes para a decisão do mérito;<br>V - designar, se necessário, audiência de instrução e julgamento.</div>
   <div class="table-wrap"><table class="styled-table">
   <tr><th>Providências preliminares</th><th>Saneamento</th></tr>
   <tr><td>Resolvem questões pendentes após a contestação</td><td>Organiza a fase probatória</td></tr>
   <tr><td>Garantem a manifestação do autor sobre a defesa</td><td>Define fatos controvertidos e questões jurídicas relevantes</td></tr>
   <tr><td>Podem levar à extinção ou ao julgamento antecipado</td><td>Normalmente encaminha o processo para a instrução</td></tr></table></div>
   <div class="callout callout-success"><strong>Para memorizar:</strong> as providências preliminares verificam <em>se há algo pendente</em>; o saneamento define <em>o que deverá ser provado</em> para que o juiz possa julgar.</div>
   <p>Em causas complexas, o § 3º permite a <strong>audiência de saneamento cooperativo</strong>, com participação das partes. E o § 2º admite a <strong>delimitação consensual</strong> das questões de fato e de direito, que, homologada, vincula as partes e o juiz.</p>`},
  {id:"p5-4", h:"Ônus da prova e instrução probatória", body:`<span class="badge badge-comp">Complemento</span>
   <div class="artigo"><strong>CPC, Art. 373</strong> — O ônus da prova incumbe:<br>I - ao <strong>autor</strong>, quanto ao fato constitutivo de seu direito;<br>II - ao <strong>réu</strong>, quanto à existência de fato impeditivo, modificativo ou extintivo do direito do autor.<br><br><strong>§ 1º</strong> Nos casos previstos em lei ou diante de peculiaridades da causa relacionadas à impossibilidade ou à excessiva dificuldade de cumprir o encargo, o juiz poderá atribuir o ônus de modo diverso, por decisão fundamentada, dando à parte a oportunidade de se desincumbir.</div>
   <div class="callout"><strong>Distribuição dinâmica do ônus:</strong> é o § 1º. Exige decisão <strong>fundamentada</strong> e <strong>oportunidade</strong> para a parte cumprir o encargo — não pode ser feita na sentença, sob pena de prova diabólica reversa.</div>
   <h4 style="margin-top:22px">Meios de prova</h4>
   <p>Admitem-se todos os meios <strong>legais e moralmente legítimos</strong> (art. 369): prova documental, testemunhal, pericial, depoimento pessoal, inspeção judicial e confissão. A prova deve recair sobre fatos <strong>controvertidos e relevantes</strong>; o juiz indefere as diligências inúteis ou protelatórias, sempre fundamentando.</p>
   <div class="artigo"><strong>CPC, Art. 374 — Não dependem de prova os fatos:</strong><br>I - notórios;<br>II - afirmados por uma parte e confessados pela parte contrária;<br>III - admitidos no processo como incontroversos;<br>IV - em cujo favor milita presunção legal de existência ou de veracidade.</div>
   <p><strong>Sistema de valoração:</strong> o CPC adota o <strong>livre convencimento motivado</strong> (ou persuasão racional). O juiz aprecia a prova constante dos autos e deve <strong>indicar as razões</strong> de seu convencimento (art. 371). Não há tabela prévia fixando o valor de cada prova.</p>
   <p>Na <strong>audiência de instrução e julgamento</strong> ocorrem depoimento pessoal, oitiva de testemunhas, esclarecimentos periciais e debates orais. Encerrada a instrução, cabem alegações finais orais ou, em causas complexas, <strong>memoriais escritos</strong>.</p>`},
  {id:"p5-5", h:"A sentença: arts. 485 e 487", body:`<span class="badge badge-comp">Complemento</span>
   <div class="table-wrap"><table class="styled-table">
   <tr><th>Tipo</th><th>Artigo</th><th>Efeito</th><th>Coisa julgada</th></tr>
   <tr><td><strong>Terminativa</strong></td><td>Art. 485</td><td>Extingue o processo <strong>sem</strong> resolver o mérito</td><td>Apenas <strong>formal</strong> — em regra, permite repropor a ação (art. 486)</td></tr>
   <tr><td><strong>Definitiva</strong></td><td>Art. 487</td><td>Resolve o mérito</td><td><strong>Material</strong> — impede rediscussão</td></tr></table></div>
   <p><strong>Principais hipóteses do art. 485:</strong> indeferimento da inicial; abandono da causa por mais de 1 ano ou pelo autor por 30 dias; ausência de pressupostos processuais; perempção, litispendência ou coisa julgada; ausência de legitimidade ou de interesse; convenção de arbitragem; desistência da ação.</p>
   <p><strong>Hipóteses do art. 487:</strong> I – acolher ou rejeitar o pedido; II – decidir sobre <strong>decadência ou prescrição</strong>; III – homologar reconhecimento da procedência, transação ou renúncia.</p>
   <div class="callout callout-warning"><strong>Ponto clássico:</strong> prescrição e decadência são <strong>questões prejudiciais de mérito</strong>. A sentença que as reconhece é <strong>de mérito</strong> (art. 487, II) e faz coisa julgada material — não é mera extinção processual.</div>
   <h4 style="margin-top:22px">Elementos da sentença (art. 489)</h4>
   <div class="caracteristicas-grid">
     <div class="carac-card"><div class="carac-num">I</div><h4>Relatório</h4><p class="small muted">Nomes das partes, identificação do caso, suma do pedido e da contestação, registro das principais ocorrências.</p></div>
     <div class="carac-card"><div class="carac-num">II</div><h4>Fundamentação</h4><p class="small muted">As razões de fato e de direito. É onde o juiz analisa as questões.</p></div>
     <div class="carac-card"><div class="carac-num">III</div><h4>Dispositivo</h4><p class="small muted">A conclusão decisória — resolve as questões principais que as partes submeteram.</p></div>
   </div>
   <div class="artigo"><strong>CPC, Art. 489, § 1º — Não se considera fundamentada a decisão que:</strong><br>I - se limita à indicação, reprodução ou paráfrase de ato normativo, sem explicar sua relação com a causa;<br>II - emprega conceitos jurídicos indeterminados sem explicar o motivo concreto de sua incidência;<br>III - invoca motivos que se prestariam a justificar qualquer outra decisão;<br>IV - não enfrenta todos os argumentos capazes de infirmar a conclusão adotada;<br>V - se limita a invocar precedente ou súmula sem identificar seus fundamentos determinantes;<br>VI - deixa de seguir precedente invocado pela parte sem demonstrar distinção ou superação.</div>
   <div class="callout">O § 1º do art. 489 é uma das grandes inovações do CPC/2015 e cai muito em prova. Ele materializa o <strong>dever de fundamentação</strong> do art. 93, IX, da Constituição.</div>`},
  {id:"p5-6", h:"Limites da sentença e coisa julgada", body:`<span class="badge badge-comp">Complemento</span>
   <p>A sentença deve observar os <strong>limites do pedido e da causa de pedir</strong>. Violações geram vícios com nomes próprios:</p>
   <div class="table-wrap"><table class="styled-table">
   <tr><th>Vício</th><th>O que ocorre</th></tr>
   <tr><td><strong>Extra petita</strong></td><td>Concede coisa <strong>diversa</strong> da pedida</td></tr>
   <tr><td><strong>Ultra petita</strong></td><td>Concede <strong>além</strong> do que foi pedido</td></tr>
   <tr><td><strong>Citra</strong> ou <strong>infra petita</strong></td><td>Deixa de apreciar pedido formulado — omissão sanável por embargos de declaração</td></tr></table></div>
   <h4 style="margin-top:22px">Coisa julgada</h4>
   <p>É a autoridade que torna <strong>imutável e indiscutível</strong> a decisão de mérito não mais sujeita a recurso (art. 502).</p>
   <div class="table-wrap"><table class="styled-table">
   <tr><th></th><th>Formal</th><th>Material</th></tr>
   <tr><td>Alcance</td><td>Dentro do processo — impede rediscussão naquele feito</td><td>Fora do processo — impede rediscussão em outro processo</td></tr>
   <tr><td>Decorre de</td><td>Qualquer sentença transitada</td><td>Apenas sentença <strong>de mérito</strong></td></tr></table></div>
   <p><strong>Limites objetivos</strong> (art. 504): não fazem coisa julgada os <em>motivos</em>, ainda que importantes, nem a verdade dos fatos estabelecida como fundamento. O que transita é o <strong>dispositivo</strong>.</p>
   <p><strong>Limites subjetivos</strong> (art. 506): a sentença faz coisa julgada às <strong>partes</strong>, não prejudicando terceiros.</p>
   <div class="callout callout-success"><strong>Preclusão x coisa julgada:</strong> a preclusão impede a prática ou repetição de ato <strong>dentro</strong> do processo. A coisa julgada impede a rediscussão da decisão de mérito <strong>em outro</strong> processo.</div>
   <div class="callout"><strong>Fechando o ciclo:</strong> transitada em julgado e havendo vício enquadrado no art. 966, o instrumento é a <strong>ação rescisória</strong> — prazo de 2 anos (art. 975). Esgotado esse prazo, resta a <strong>querela nullitatis</strong> para vícios de ordem pública, como visto na Aula 3.</div>`}],
 casos:[
  {t:"Réu revel em ação sobre direito indisponível", resumo:"Em ação de alimentos, o réu citado não apresenta contestação.", detalhe:"Há revelia, mas não incide o efeito material da presunção de veracidade: o art. 345, II, excepciona os litígios sobre direitos indisponíveis. O autor continua tendo de provar os fatos constitutivos de seu direito, e o processo segue para instrução. Isso mostra por que revelia e efeitos da revelia são coisas distintas."},
  {t:"Dois pedidos, um incontroverso", resumo:"O autor cumula pedido de cobrança (que o réu reconhece) e de danos morais (que o réu contesta e exige prova).", detalhe:"Cabe o julgamento antecipado parcial do mérito (art. 356): o juiz decide desde logo o pedido incontroverso e o processo prossegue quanto ao outro. Atenção ao recurso: por ser decisão interlocutória de mérito, cabe agravo de instrumento (art. 1.015, II), e não apelação. A parte decidida pode ser executada desde logo."},
  {t:"Sentença que só cita a lei", resumo:"O juiz julga improcedente o pedido reproduzindo o texto do artigo e afirmando que 'não estão presentes os requisitos legais'.", detalhe:"A decisão não se considera fundamentada. Incide o art. 489, § 1º, I (limitar-se a reproduzir ato normativo sem explicar a relação com a causa) e III (invocar motivos que se prestariam a justificar qualquer outra decisão). Cabem embargos de declaração para sanar a omissão e, em seguida, apelação."}]}

const PROC_D = [
 {q:"Diferencie o indeferimento da inicial (art. 330) da improcedência liminar (art. 332), indicando natureza, resultado e retratação.", nivel:"médio", aula:2, model:"O indeferimento ocorre diante de vício processual: inépcia, ilegitimidade manifesta, falta de interesse ou descumprimento dos arts. 106 e 321. É sentença que extingue o processo SEM resolução do mérito. Interposta apelação, o juiz pode retratar-se em 5 dias (art. 331). A improcedência liminar é decisão de mérito: nas causas que dispensem instrução, o juiz julga improcedente o pedido, sem citação do réu, quando contrariar súmula do STF ou STJ, acórdão em repetitivos, IRDR, assunção de competência ou súmula de TJ sobre direito local; também quando verificar decadência ou prescrição (§1º). Aqui o pedido é rejeitado com resolução do mérito. Interposta apelação, cabe retratação em 5 dias (§3º); havendo retratação, o processo prossegue com a citação (§4º)."},
 {q:"Explique o juízo de retratação: conceito, finalidade e as três hipóteses expressas na apelação.", nivel:"médio", aula:2, model:"É a possibilidade de a autoridade que proferiu a decisão reconsiderá-la após a interposição do recurso e antes da remessa à instância superior. Cria-se etapa intermediária em que o recurso é apresentado ao próprio prolator. A finalidade é dupla: economia processual, corrigindo de imediato o equívoco e evitando o julgamento colegiado; e celeridade, sem aguardar a pauta do tribunal. A regra é a irretratabilidade da sentença (art. 494): publicada, só se altera para corrigir inexatidões materiais ou erros de cálculo, ou por embargos de declaração. As três hipóteses expressas, todas com prazo de 5 dias, são: indeferimento da inicial (art. 331), improcedência liminar (art. 332, §3º) e sentença sem resolução do mérito (art. 485, §7º)."},
 {q:"Discorra sobre o termo inicial do prazo de contestação (art. 335) e a concentração da defesa.", nivel:"difícil", aula:3, model:"O prazo é de 15 dias, mas o termo inicial varia. No inciso I, conta-se da audiência ou da última sessão, quando qualquer parte não comparecer ou não houver autocomposição. No inciso II, do protocolo do pedido de cancelamento apresentado pelo réu. No inciso III, do marco do art. 231, conforme o modo da citação. Havendo litisconsórcio passivo, o §1º prevê que o termo do inciso II será, para cada réu, a data de seu respectivo pedido. Quanto à defesa, o art. 336 consagra a concentração: incumbe ao réu alegar toda a matéria de defesa, expondo razões de fato e de direito e especificando as provas. Na prática, atacar item a item, sem contestação genérica, sobretudo diante do art. 341, que presume verdadeiras as alegações não impugnadas. Após a contestação, só cabem novas alegações nas hipóteses do art. 342."},
 {q:"Distinga ação rescisória e querela nullitatis quanto à base legal, prazo e hipóteses.", nivel:"difícil", aula:3, model:"A rescisória está no art. 966 e desconstitui decisão de mérito transitada em julgado nas hipóteses taxativas: prevaricação, concussão ou corrupção do juiz; juiz impedido ou juízo absolutamente incompetente; dolo, coação, simulação ou colusão; ofensa à coisa julgada; violação manifesta de norma; prova falsa; prova nova; erro de fato. Prazo decadencial de 2 anos do trânsito em julgado da última decisão (art. 975). A querela nullitatis não tem artigo específico, sustentando-se no devido processo legal (art. 5º, LIV) e na ampla defesa (LV). Não se submete a prazo decadencial ou preclusivo, pois se volta contra vícios de ordem pública que comprometem a formação válida do processo — ausência de citação ou juízo absolutamente incompetente. Esgotado o prazo da rescisória, a querela permanece como via possível diante desses vícios."},
 {q:"Explique o julgamento conforme o estado do processo, indicando as quatro possibilidades e o recurso cabível em cada uma.", nivel:"difícil", aula:5, model:"Cumpridas as providências preliminares, o juiz avalia se o processo pode ser encerrado ou deve avançar para a instrução, abrindo-se quatro caminhos. O primeiro é a extinção sem resolução do mérito (art. 354), quando presente vício ou causa do art. 485 que impeça o julgamento do pedido; profere-se sentença terminativa, atacável por apelação. O segundo é o julgamento antecipado do mérito (art. 355), cabível quando não houver necessidade de outras provas, ou quando o réu for revel e incidirem os efeitos da revelia; profere-se sentença de mérito, também atacável por apelação. O terceiro é o julgamento antecipado parcial do mérito (art. 356), quando um ou mais pedidos, ou parcela deles, estiverem incontroversos ou em condições de imediato julgamento; aqui a decisão é interlocutória de mérito, sendo o recurso cabível o agravo de instrumento, na forma do art. 1.015, II — exceção relevante à regra de que mérito se ataca por apelação. Essa decisão parcial pode ser desde logo liquidada e executada. O quarto caminho é o saneamento e organização do processo (art. 357), quando ainda houver questões de fato ou de direito a delimitar; o processo segue para a instrução probatória."},
 {q:"Disserte sobre o dever de fundamentação no CPC, com base no art. 489, § 1º, e sua relação com a Constituição.", nivel:"médio", aula:5, model:"A sentença deve conter relatório, fundamentação e dispositivo (art. 489). A fundamentação é a exposição das razões de fato e de direito, e o CPC/2015 inovou ao definir negativamente, no § 1º, o que NÃO se considera decisão fundamentada. São seis hipóteses: limitar-se à indicação, reprodução ou paráfrase de ato normativo sem explicar sua relação com a causa; empregar conceitos jurídicos indeterminados sem explicar o motivo concreto de sua incidência; invocar motivos que se prestariam a justificar qualquer outra decisão; não enfrentar todos os argumentos capazes de infirmar a conclusão adotada; limitar-se a invocar precedente ou súmula sem identificar seus fundamentos determinantes nem demonstrar que o caso se ajusta a eles; e deixar de seguir precedente invocado pela parte sem demonstrar distinção ou superação. O dispositivo materializa o art. 93, IX, da Constituição, que exige fundamentação de todas as decisões judiciais sob pena de nulidade, e dialoga com o princípio do contraditório em sua dimensão substancial (arts. 9º e 10): a parte tem direito não apenas de falar, mas de influenciar efetivamente a decisão, o que pressupõe que seus argumentos sejam enfrentados. A consequência prática do descumprimento é a omissão sanável por embargos de declaração e, persistindo, a nulidade da decisão."},
 {q:"Explique os pronunciamentos do art. 203 e o recurso cabível contra cada um.", nivel:"médio", aula:2, model:"São três. A sentença (§1º) é o pronunciamento pelo qual o juiz, com fundamento nos arts. 485 e 487, põe fim à fase cognitiva ou extingue a execução; cabe apelação em 15 dias. A decisão interlocutória (§2º) é todo pronunciamento decisório que não se enquadre no §1º, resolvendo questão incidental; cabe agravo de instrumento em 15 dias, nas hipóteses do art. 1.015. O despacho (§3º) abrange os demais pronunciamentos; é ato de mero expediente, sem conteúdo decisório capaz de causar prejuízo — não havendo sucumbência, é irrecorrível. Acrescente-se o §4º: os atos meramente ordinatórios, como juntada e vista obrigatória, independem de despacho, sendo praticados de ofício pelo servidor."}];

 {aula:2, f:"As três hipóteses de retratação", b:"Indeferimento (331); improcedência liminar (332, §3º); sentença sem mérito (485, §7º). Prazo: 5 dias."},
 {aula:2, f:"Irretratabilidade da sentença", b:"Art. 494: só se altera para corrigir inexatidões materiais ou erros de cálculo, ou por embargos."},
 {aula:2, f:"Hipóteses de improcedência liminar", b:"Contrariar súmula do STF/STJ, acórdão em repetitivos, IRDR ou súmula de TJ. Também decadência ou prescrição."},
 {aula:2, f:"O que é caução de rato?", b:"Termo do advogado para apresentar procuração em 15 dias, prorrogáveis por mais 15, sob pena de inexistência dos atos."},
 {aula:2, f:"Vias no processo físico", b:"1 (autos) + 1 (protocolo) + 1 por réu (contrafé). Com 3 réus: 5 vias."},
 {aula:3, f:"Prazos do art. 334", b:"Audiência com 30 dias de antecedência; citação com 20; réu manifesta desinteresse com 10."},
 {aula:3, f:"Quando a audiência não será realizada?", b:"Art. 334, §4º: desinteresse expresso de ambas as partes; ou quando não se admitir autocomposição."},
 {aula:3, f:"Ausência injustificada à audiência", b:"Ato atentatório à dignidade da justiça: multa de até 2% da vantagem pretendida ou do valor da causa."},
 {aula:3, f:"Cabe apelação do acordo homologado?", b:"Não. Sem sucumbência nem prejuízo. Havendo vício, cabe ação rescisória."},
 {aula:3, f:"Termo inicial da contestação", b:"I - da audiência sem acordo; II - do protocolo do cancelamento; III - do marco do art. 231."},
 {aula:3, f:"Concentração da defesa", b:"Art. 336: alegar toda a matéria de defesa na contestação. Atacar item a item."},
 {aula:3, f:"Preliminares não conhecíveis de ofício", b:"Art. 337, §5º: convenção de arbitragem e incompetência relativa."},
 {aula:3, f:"Litispendência x coisa julgada", b:"Litispendência: ação em curso. Coisa julgada: ação já decidida com trânsito. Ação idêntica: partes, causa de pedir e pedido."},
 {aula:3, f:"O que substituiu a nomeação à autoria?", b:"Arts. 338 e 339: o réu indica o sujeito passivo e o autor pode substituí-lo ou incluí-lo como litisconsorte."},
 {aula:3, f:"Prazo da ação rescisória", b:"2 anos do trânsito em julgado da última decisão (art. 975)."},
 {aula:3, f:"Querela nullitatis x rescisória", b:"A rescisória tem base no art. 966 e prazo de 2 anos. A querela não tem prazo e ataca vícios de ordem pública."},
 {aula:5, f:"O que é a réplica?", b:"Manifestação do autor sobre preliminares, fatos impeditivos/modificativos/extintivos e documentos juntados com a contestação."},
 {aula:5, f:"Quando a revelia NÃO gera presunção? (art. 345)", b:"Pluralidade de réus com um contestante; direitos indisponíveis; falta de instrumento indispensável; alegações inverossímeis ou contraditadas pelos autos."},
 {aula:5, f:"As quatro saídas do julgamento conforme o estado", b:"Extinção sem mérito (354); julgamento antecipado (355); julgamento antecipado parcial (356); saneamento (357)."},
 {aula:5, f:"Recurso do julgamento antecipado parcial", b:"Agravo de instrumento (art. 1.015, II) — é decisão interlocutória de mérito, não sentença."},
 {aula:5, f:"O que o juiz faz no saneamento (art. 357)?", b:"Resolve questões pendentes; delimita questões de fato; define o ônus da prova; delimita questões de direito; designa AIJ se necessário."},
 {aula:5, f:"Providências preliminares x saneamento", b:"As preliminares verificam SE HÁ ALGO PENDENTE. O saneamento define O QUE DEVERÁ SER PROVADO."},
 {aula:5, f:"Ônus da prova (art. 373)", b:"Autor: fato constitutivo de seu direito. Réu: fato impeditivo, modificativo ou extintivo. O § 1º permite distribuição dinâmica, fundamentada."},
 {aula:5, f:"Fatos que não dependem de prova (art. 374)", b:"Notórios; confessados; incontroversos; e aqueles em cujo favor milita presunção legal."},
 {aula:5, f:"Sistema de valoração da prova no CPC", b:"Livre convencimento motivado (persuasão racional): o juiz aprecia a prova e deve indicar as razões de seu convencimento (art. 371)."},
 {aula:5, f:"Sentença terminativa x definitiva", b:"Terminativa (485): sem mérito, coisa julgada apenas formal. Definitiva (487): com mérito, coisa julgada material."},
 {aula:5, f:"Prescrição gera que tipo de sentença?", b:"De mérito (art. 487, II) — é questão prejudicial de mérito, com coisa julgada material."},
 {aula:5, f:"Os três elementos da sentença (art. 489)", b:"Relatório, fundamentação e dispositivo."},
 {aula:5, f:"Decisão não fundamentada (art. 489, § 1º)", b:"Seis hipóteses: reproduzir norma sem relacioná-la à causa; conceito indeterminado sem motivo concreto; motivos genéricos; não enfrentar argumentos; invocar precedente sem fundamentos determinantes; não seguir precedente sem distinguir."},
 {aula:5, f:"Extra, ultra e citra petita", b:"Extra: coisa DIVERSA da pedida. Ultra: ALÉM do pedido. Citra/infra: DEIXA DE APRECIAR pedido formulado."},
 {aula:5, f:"Limites objetivos da coisa julgada", b:"Art. 504: os motivos NÃO fazem coisa julgada, ainda que importantes. Transita o dispositivo."},
 {aula:5, f:"Preclusão x coisa julgada", b:"Preclusão impede ato DENTRO do processo. Coisa julgada impede rediscussão EM OUTRO processo."},
 {aula:4, f:"Regra geral de prazo recursal", b:"15 dias (art. 1.003, §5º). Exceção: embargos de declaração, 5 dias."},
 {aula:4, f:"Efeito dos embargos sobre os prazos", b:"INTERROMPEM — o prazo recomeça integralmente. Não têm efeito suspensivo."},
 {aula:4, f:"Finalidades dos embargos (1.022)", b:"Esclarecer obscuridade, eliminar contradição, suprir omissão, corrigir erro material."},
 {aula:4, f:"O agravo tem efeito suspensivo?", b:"Não automaticamente (art. 1.026), salvo concessão pelo relator."},
 {aula:4, f:"Recurso contra decisão monocrática do relator", b:"Agravo interno, art. 1.021, 15 dias. Deve impugnar especificamente os fundamentos."},
 {aula:4, f:"Recurso contra inadmissão de REsp/RE", b:"Agravo do art. 1.042, 15 dias, sem custas. Pode haver retratação."},
 {aula:4, f:"Requisitos do REsp e do RE", b:"Prequestionamento (1.030, I); no RE, repercussão geral (1.035). Interposição no tribunal de origem."}];
