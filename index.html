/* ============ MATÉRIA 3 — DIREITO DAS OBRIGAÇÕES CIVIS ============ */
const OBR_L = [
{ id:1, title:"Conceito, elementos e estrutura", subtitle:"O que é uma obrigação civil, seus elementos e como se distingue da relação jurídica em geral.",
 sections:[
  {id:"o1-1", h:"Relação jurídica x relação jurídica obrigacional", body:`
   <p>A <strong>relação jurídica</strong> (gênero) é o vínculo reconhecido pelo ordenamento entre duas ou mais pessoas, do qual surgem direitos e deveres mútuos. Seu ponto de partida é sempre um <strong>fato jurídico</strong>.</p>
   <p>A <strong>relação jurídica obrigacional</strong> (espécie) também nasce de um fato jurídico, mas se distingue pelo objeto: a prestação tem <strong>conteúdo patrimonial</strong>, com expressão econômica direta ou indireta.</p>
   <div class="artigo"><strong>CC, Art. 1º</strong> — Toda pessoa é capaz de direitos e deveres na ordem civil.</div>
   <div class="callout">Em paralelo, diplomas de ordem pública e interesse social — como o <strong>CDC (Lei nº 8.078/1990)</strong> — regulam relações específicas para proteger sujeitos vulneráveis, com regras de observância obrigatória.</div>
   <p>Segundo <strong>Carlos Roberto Gonçalves</strong>, o direito das obrigações consiste num complexo de normas que regem relações jurídicas de ordem patrimonial, tendo por objeto prestações de um sujeito em proveito de outro.</p>`},
  {id:"o1-2", h:"Elementos constitutivos da obrigação", body:`
   <p>A fórmula básica é: <strong>credor + devedor + prestação + vínculo jurídico</strong>.</p>
   <div class="table-wrap"><table class="styled-table">
   <tr><th>Elemento</th><th>Conceito</th><th>Exemplo</th></tr>
   <tr><td><strong>Sujeito ativo</strong></td><td>O credor, titular do direito de exigir a prestação</td><td>O comprador que pode exigir a entrega do produto</td></tr>
   <tr><td><strong>Sujeito passivo</strong></td><td>O devedor, obrigado a cumprir a prestação</td><td>O vendedor que deve entregar o produto</td></tr>
   <tr><td><strong>Objeto</strong></td><td>A prestação devida: dar, fazer ou não fazer</td><td>Entregar um bem, prestar um serviço, não divulgar informação</td></tr>
   <tr><td><strong>Vínculo jurídico</strong></td><td>A ligação que permite exigir a prestação</td><td>A possibilidade de cobrar judicialmente</td></tr></table></div>
   <p>Tradicionalmente, fala-se em três elementos: o <strong>subjetivo</strong> (os sujeitos), o <strong>objetivo ou material</strong> (a prestação) e o <strong>vínculo jurídico</strong> ou elemento imaterial.</p>`},
  {id:"o1-3", h:"Sujeito ativo: o credor (accipiens)", body:`
   <p>O credor, também chamado <strong>accipiens</strong>, é, nas palavras de <strong>Maria Helena Diniz</strong>, aquele a quem a prestação — positiva ou negativa — é devida, tendo por isso o direito de exigi-la.</p>
   <p>O credor pode ser <strong>único ou coletivo</strong>. Sendo coletivo, terá direito a uma quota-parte ou à totalidade da prestação, conforme a natureza da relação creditória.</p>
   <div class="callout">Uma mesma relação contratual pode conter <strong>obrigações recíprocas</strong>. Na compra e venda, o comprador é credor da entrega do bem e devedor do pagamento; simultaneamente, o vendedor é credor do pagamento e devedor da entrega.</div>`},
  {id:"o1-4", h:"Sujeito passivo: o devedor (solvens)", body:`
   <p>O devedor, ou <strong>solvens</strong>, deve cumprir a prestação obrigacional, limitando sua liberdade: deverá <strong>dar, fazer ou não fazer</strong> algo em atenção ao interesse de outrem. Não cumprindo, poderá <strong>responder com seu patrimônio</strong>.</p>
   <p>Pode ser único ou plural. Havendo mais de um devedor, a prestação consistirá numa <strong>fração do objeto</strong> ou na <strong>totalidade</strong>.</p>
   <div class="callout"><strong>Exemplo:</strong> numa dívida de R$ 100 com <strong>10 devedores</strong>, cada um responde por R$ 10 de sua parte. Se um deles pagar os R$ 100 integralmente, terá <strong>direito regressivo</strong> contra os codevedores quanto à parte proporcional que lhes cabe — ou seja, cobra R$ 10 de cada um.</div>
   <div class="callout callout-warning"><strong>Atenção à precisão:</strong> o direito de regresso alcança a <strong>quota-parte</strong> de cada codevedor, não o valor total da dívida. Alguns resumos redigem isso de forma ambígua.</div>`},
  {id:"o1-5", h:"O vínculo jurídico: débito e responsabilidade", body:`
   <p>O vínculo transforma uma relação de fato em relação obrigacional <strong>exigível</strong>. A doutrina o relaciona a dois aspectos:</p>
   <div class="caracteristicas-grid">
     <div class="carac-card"><div class="carac-num">SCHULD</div><h4>Débito</h4><p class="small muted">O dever de cumprir a prestação.</p></div>
     <div class="carac-card"><div class="carac-num">HAFTUNG</div><h4>Responsabilidade</h4><p class="small muted">A sujeição às consequências jurídicas do inadimplemento.</p></div>
   </div>
   <p>O objeto imediato da obrigação é a <strong>prestação</strong>: o comportamento que o devedor deve adotar. Ela precisa ser juridicamente <strong>possível, lícita e determinada ou determinável</strong>. Quando a obrigação decorre de negócio jurídico, valem também os requisitos de validade do <strong>art. 104</strong>.</p>
   <p>Descumprida a obrigação, podem surgir perdas e danos, juros, atualização monetária e honorários.</p>`}],
 casos:[
  {t:"Compra e venda: obrigações recíprocas", resumo:"João compra um imóvel de Maria. Quem é credor e quem é devedor?", detalhe:"Ambos são, simultaneamente. João é credor da transferência do domínio e devedor do preço; Maria é credora do preço e devedora dos atos de transferência. O art. 481 estrutura o contrato: um se obriga a transferir o domínio de certa coisa, o outro a pagar certo preço em dinheiro. É contrato bilateral e oneroso."},
  {t:"Prestação sem valor econômico", resumo:"Alguém promete a um amigo que irá acompanhá-lo ao cinema no sábado.", detalhe:"Não há relação obrigacional em sentido técnico: falta patrimonialidade e, sobretudo, o vínculo jurídico de exigibilidade. Trata-se de compromisso social, não juridicamente exigível. O vínculo é justamente o que distingue a obrigação de uma simples promessa informal."}]},
{ id:2, title:"Fontes das obrigações e classificações", subtitle:"De onde nascem as obrigações e a distinção entre propter rem e obrigações pessoais.",
 sections:[
  {id:"o2-1", h:"Fonte imediata e fontes mediatas", body:`
   <p>As <strong>fontes das obrigações</strong> são os fatos ou atos jurídicos capazes de fazer nascer uma relação obrigacional.</p>
   <div class="caracteristicas-grid">
     <div class="carac-card"><div class="carac-num">FONTE IMEDIATA</div><h4>A lei</h4><p class="small muted">É a lei que reconhece que determinado fato ou ato pode produzir efeitos obrigacionais. Mesmo a obrigação nascida de contrato depende do reconhecimento do ordenamento.</p></div>
     <div class="carac-card"><div class="carac-num">FONTES MEDIATAS</div><h4>Fatos e atos concretos</h4><p class="small muted">São os acontecimentos que fazem surgir a obrigação, sempre dentro dos limites da lei.</p></div>
   </div>
   <div class="table-wrap"><table class="styled-table">
   <tr><th>Fonte mediata</th><th>Explicação</th><th>Exemplo</th></tr>
   <tr><td><strong>Contratos</strong></td><td>Acordos de vontade que criam obrigações</td><td>Compra e venda, locação, prestação de serviços</td></tr>
   <tr><td><strong>Declarações unilaterais</strong></td><td>Vontade de uma só pessoa, nas hipóteses legais</td><td>Promessa pública de recompensa</td></tr>
   <tr><td><strong>Atos ilícitos</strong></td><td>Condutas que violam direito e causam dano</td><td>Acidente causado por negligência</td></tr>
   <tr><td><strong>Abuso de direito</strong></td><td>Exercício excessivo, contrário à finalidade, boa-fé ou bons costumes</td><td>Cobrança vexatória de uma dívida</td></tr>
   <tr><td><strong>Enriquecimento sem causa</strong></td><td>Vantagem injustificada à custa de outrem</td><td>Recebimento indevido de quantia</td></tr></table></div>`},
  {id:"o2-2", h:"Declaração unilateral de vontade", body:`
   <p>Ocorre quando a manifestação de vontade de <strong>uma única pessoa</strong> é suficiente para criar obrigação jurídica, desde que haja previsão legal. Não se confunde com simples intenção ou promessa informal.</p>
   <div class="artigo"><strong>CC, Art. 854</strong> — Quem quer que, por anúncios públicos, se comprometer a recompensar quem desempenhe certo serviço ou satisfaça certa condição, fica obrigado a cumprir o prometido.</div>
   <p><strong>Exemplo:</strong> uma pessoa anuncia que pagará R$ 1.000 a quem encontrar e devolver seu animal perdido. Cumprida a condição anunciada, surge o direito à recompensa.</p>
   <p>No contexto das <strong>fontes não contratuais</strong>, também se estudam:</p>
   <ul class="styled-list">
     <li><strong>Gestão de negócios</strong> — arts. 861 a 875</li>
     <li><strong>Pagamento indevido</strong> — arts. 876 a 883</li>
     <li><strong>Enriquecimento sem causa</strong> — arts. 884 a 886</li>
     <li><strong>Títulos de crédito</strong> — arts. 887 a 926</li>
   </ul>
   <div class="callout">O enquadramento dessas figuras varia conforme a classificação doutrinária adotada. O ponto central é que elas <strong>geram obrigações sem contrato bilateral</strong>.</div>`},
  {id:"o2-3", h:"Obrigações propter rem", body:`
   <p><em>Propter rem</em> significa <strong>"em razão da coisa"</strong>. São obrigações que surgem em razão da titularidade, posse ou relação jurídica da pessoa com determinado bem.</p>
   <p>A obrigação está vinculada à coisa e, em regra, <strong>acompanha o bem</strong> na transferência da titularidade. Por isso é também chamada de <strong>obrigação ambulatória</strong>.</p>
   <p><strong>Exemplos:</strong> despesas condominiais vinculadas ao imóvel, deveres de vizinhança e despesas de conservação de coisa comum.</p>
   <div class="artigo"><strong>CC, Art. 1.345</strong> — O adquirente de unidade responde pelos débitos do alienante, em relação ao condomínio, inclusive multas e juros moratórios.</div>`},
  {id:"o2-4", h:"Propter rem x pessoal: por que é híbrida?", body:`
   <p>As <strong>obrigações pessoais</strong> (ou <em>in personam</em>) vinculam um credor a um devedor determinado ou determinável, sem depender da titularidade de uma coisa. Exemplos: pagar o preço, pagar aluguel, executar serviço contratado, indenizar dano.</p>
   <p>A obrigação <em>propter rem</em> é <strong>híbrida</strong> porque combina traços de direito real e de direito pessoal: aproxima-se do real por estar ligada a uma coisa e acompanhá-la; mantém natureza obrigacional por impor a alguém o dever de cumprir uma prestação.</p>
   <div class="table-wrap"><table class="styled-table">
   <tr><th>Critério</th><th>Direito real</th><th>Direito pessoal</th><th>Propter rem</th></tr>
   <tr><td>Objeto</td><td>Coisa ou bem</td><td>Prestação de um devedor</td><td>Prestação relacionada a uma coisa</td></tr>
   <tr><td>Sujeito passivo</td><td>Indeterminado, em regra</td><td>Determinado ou determinável</td><td>Titular atual da relação com o bem</td></tr>
   <tr><td>Eficácia</td><td>Contra todos (<em>erga omnes</em>)</td><td>Entre credor e devedor</td><td>Vinculada à coisa, conforme a lei</td></tr>
   <tr><td>Exemplo</td><td>Propriedade</td><td>Dívida contratual</td><td>Despesa condominial do imóvel</td></tr></table></div>
   <div class="callout callout-success"><strong>Para memorizar:</strong> <em>propter rem</em> = obrigação por causa da coisa. Obrigação pessoal = obrigação de uma pessoa em relação a outra.</div>`},
  {id:"o2-5", h:"Ligações com contratos e ato ilícito", body:`
   <div class="artigo"><strong>CC, Art. 481</strong> — Pelo contrato de compra e venda, um dos contratantes se obriga a transferir o domínio de certa coisa, e o outro, a pagar-lhe certo preço em dinheiro.</div>
   <p>É contrato <strong>bilateral</strong> (gera obrigações para ambas as partes) e <strong>oneroso</strong> (sacrifícios e vantagens recíprocos). O contrato cria a obrigação de transferir, mas a transferência da propriedade depende do modo legal: nos imóveis, o <strong>registro</strong>; nos móveis, a <strong>tradição</strong>.</p>
   <div class="artigo"><strong>CC, Art. 108</strong> — Não dispondo a lei em contrário, a escritura pública é essencial à validade dos negócios jurídicos que visem à constituição, transferência, modificação ou renúncia de direitos reais sobre imóveis de valor superior a trinta vezes o maior salário mínimo vigente no País.</div>
   <div class="callout">Não confunda: a <strong>escritura</strong> formaliza o negócio; o <strong>registro</strong> no Cartório de Registro de Imóveis transfere a propriedade perante terceiros (art. 1.245).</div>
   <div class="artigo"><strong>CC, Art. 422</strong> — Os contratantes são obrigados a guardar, assim na conclusão do contrato, como em sua execução, os princípios de probidade e boa-fé.</div>
   <p><strong>Probidade:</strong> honestidade, correção, integridade. <strong>Boa-fé objetiva:</strong> lealdade, cooperação, transparência, proteção da confiança e dever de informação. Não é estado psicológico, e sim <strong>padrão concreto de conduta exigível</strong>.</p>
   <div class="table-wrap"><table class="styled-table">
   <tr><th>Artigo</th><th>Conceito</th><th>Exemplo</th></tr>
   <tr><td><strong>Art. 186</strong></td><td>Ato ilícito: violação de direito com dano, por ação, omissão, negligência ou imprudência</td><td>Motorista desatento causa acidente</td></tr>
   <tr><td><strong>Art. 187</strong></td><td>Abuso de direito: exercício que excede manifestamente os limites do fim econômico ou social, da boa-fé ou dos bons costumes</td><td>Credor faz cobrança vexatória, embora possa cobrar</td></tr>
   <tr><td><strong>Art. 927</strong></td><td>Dever de indenizar. O parágrafo único traz a responsabilidade objetiva</td><td>Reparação independentemente de culpa, nos casos legais ou de atividade de risco</td></tr></table></div>`}],
 casos:[
  {t:"Comprador do apartamento com dívida de condomínio", resumo:"João compra imóvel de Maria. Há despesas condominiais vencidas anteriores à venda.", detalhe:"A obrigação condominial é propter rem — acompanha o bem. Pelo art. 1.345, o adquirente responde pelos débitos do alienante, inclusive multas e juros moratórios. Isso não impede que João, no plano interno, busque ressarcimento de Maria, mas perante o condomínio ele responde."},
  {t:"Promessa de recompensa retirada antes do cumprimento", resumo:"O anúncio público de recompensa é revogado antes que alguém encontre o animal.", detalhe:"A promessa de recompensa (art. 854) é declaração unilateral de vontade que vincula. A revogação é possível nas condições legais, com a mesma publicidade, mas quem já tiver cumprido a condição ou realizado despesas pode ter direito protegido. O ponto da aula é que a vontade de uma só pessoa basta para gerar obrigação quando há previsão legal."}]},
{ id:3, title:"Modalidades: dar, fazer e não fazer", subtitle:"Obrigação de dar coisa certa e incerta, obrigação de fazer fungível e infungível, e o dever de abstenção.",
 sections:[
  {id:"o3-1", h:"Positivas e negativas: o quadro geral", body:`
   <p>Segundo <strong>Tartuce</strong>, de acordo com o conteúdo da prestação a obrigação pode ser <strong>positiva</strong> (ação ou comissão) ou <strong>negativa</strong> (abstenção ou omissão).</p>
   <ul class="styled-list">
     <li>São <strong>positivas</strong> as obrigações de <strong>dar</strong> e de <strong>fazer</strong></li>
     <li>A obrigação de <strong>não fazer</strong> é a <strong>única negativa</strong> admitida no ordenamento</li>
   </ul>
   <div class="table-wrap"><table class="styled-table">
   <tr><th>Modalidade</th><th>Tipo</th><th>Conteúdo</th></tr>
   <tr><td><strong>Dar</strong></td><td>Positiva</td><td>Entregar, transferir ou restituir uma coisa, determinada ou determinável</td></tr>
   <tr><td><strong>Fazer</strong></td><td>Positiva</td><td>Ato ou serviço do devedor</td></tr>
   <tr><td><strong>Não fazer</strong></td><td>Negativa</td><td>Dever de abstenção</td></tr></table></div>
   <div class="callout">A diferença entre dar e fazer: na de <strong>dar</strong>, a prestação consiste na <strong>entrega de uma coisa</strong>; na de <strong>fazer</strong>, o objeto é um <strong>ato ou serviço</strong> do devedor.</div>`},
  {id:"o3-2", h:"Obrigação de dar coisa certa", body:`
   <p>A <em>obligatio ad dandum</em> de coisa certa (obrigação <strong>específica</strong>) tem por objeto coisa <strong>determinada, perfeitamente individualizada</strong>. O devedor deve entregar ou restituir coisa inconfundível com outra.</p>
   <div class="artigo"><strong>CC, Art. 313</strong> — O credor não é obrigado a receber prestação diversa da que lhe é devida, ainda que mais valiosa. <em>(Salvo se o credor anuir com o recebimento.)</em></div>
   <p>A transferência se dá mediante <strong>tradição</strong> (entrega), não pela simples transferência de domínio.</p>
   <div class="artigo"><strong>CC, Art. 1.226</strong> — Os direitos reais sobre coisas móveis, quando constituídos ou transmitidos por atos entre vivos, só se adquirem com a tradição.<br><br><strong>CC, Art. 1.227</strong> — Os direitos reais sobre imóveis constituídos ou transmitidos por atos entre vivos só se adquirem com o registro no Cartório de Registro de Imóveis.</div>
   <div class="artigo"><strong>CC, Art. 233</strong> — A obrigação de dar coisa certa abrange os acessórios dela embora não mencionados, salvo se o contrário resultar do título ou das circunstâncias do caso.</div>
   <div class="callout"><strong>Princípio da gravitação jurídica:</strong> o bem principal é acompanhado de seu acessório.</div>
   <div class="artigo"><strong>CC, Art. 237</strong> — Até a tradição pertence ao devedor a coisa, com os seus melhoramentos e acrescidos, pelos quais poderá exigir aumento no preço; se o credor não anuir, poderá o devedor resolver a obrigação.</div>
   <p><strong>Frutos:</strong> em regra, os <strong>estantes e percebidos</strong> pertencem ao devedor. Já os <strong>percipiendos</strong> — aqueles que deveriam ter sido colhidos, mas não o foram — se não colhidos até a tradição, passam a pertencer ao credor, novo proprietário do bem principal.</p>`},
  {id:"o3-3", h:"Perda e deterioração: arts. 234 a 240", body:`
   <p>Este é o quadro mais cobrado da matéria. Cruze <strong>obrigação</strong> (dar ou restituir), <strong>fato</strong> (perda ou deterioração) e <strong>culpa</strong>.</p>
   <div class="table-wrap"><table class="styled-table">
   <tr><th>Obrigação</th><th>Artigo</th><th>Fato</th><th>Sem culpa</th><th>Com culpa</th></tr>
   <tr><td><strong>Dar</strong></td><td>Art. 234 (1ª parte sem culpa; 2ª parte com culpa)</td><td>Perda</td><td>Fica resolvida a obrigação para ambas as partes</td><td>Responderá pelo equivalente mais perdas e danos</td></tr>
   <tr><td><strong>Dar</strong></td><td>Art. 235 (sem culpa) · Art. 236 (com culpa)</td><td>Deterioração</td><td>O credor pode resolver a obrigação, ou aceitar a coisa abatido de seu preço o valor que perdeu</td><td>O credor pode exigir o equivalente, ou aceitar a coisa no estado em que se acha, com direito a perdas e danos em ambos os casos</td></tr>
   <tr><td><strong>Restituir</strong></td><td>Art. 238 (sem culpa) · Art. 239 (com culpa)</td><td>Perda</td><td>Resolve-se a obrigação para ambas as partes</td><td>Responderá pelo equivalente mais perdas e danos</td></tr>
   <tr><td><strong>Restituir</strong></td><td>Art. 240 (1ª parte sem culpa; 2ª parte com culpa)</td><td>Deterioração</td><td>O credor recebe a coisa no estado em que se encontra</td><td>Exigir o equivalente OU aceitar a coisa com abatimento do preço — mais perdas e danos nos dois casos</td></tr></table></div>
   <div class="callout"><strong>Padrão geral:</strong> sem culpa, na maioria das vezes a obrigação se <strong>resolve</strong> (desfaz-se o negócio jurídico), ou o credor aceita a coisa como está com restituição do restante — salvo o disposto no art. 240.</div>
   <div class="callout callout-success">Quando a lei fala em <strong>"equivalente"</strong>, refere-se a questão pecuniária: o <strong>valor em moeda corrente</strong> da coisa.</div>`},
  {id:"o3-4", h:"Obrigação de dar coisa incerta", body:`
   <p>Também chamada de <strong>obrigação genérica</strong>. O objeto é indeterminado, ao menos inicialmente, sendo indicado apenas pelo <strong>gênero e pela quantidade</strong>. A indicação da qualidade é posterior e, em regra, cabe ao devedor.</p>
   <div class="artigo"><strong>CC, Art. 243</strong> — A coisa incerta será indicada, ao menos, pelo gênero e pela quantidade.<br><br><strong>CC, Art. 244</strong> — Nas coisas determinadas pelo gênero e pela quantidade, a escolha pertence ao devedor, se o contrário não resultar do título da obrigação; mas não poderá dar a coisa pior, nem será obrigado a prestar a melhor.</div>
   <p>A obrigação de dar coisa incerta é <strong>transitória</strong>: escolhidos gênero, quantidade e qualidade, ela passa a ser objeto certo e desagua no regime da coisa certa. Esse ato de escolha é a <strong>concentração</strong>.</p>
   <div class="artigo"><strong>CC, Art. 246</strong> — Antes da escolha, não poderá o devedor alegar perda ou deterioração da coisa, ainda que por força maior ou caso fortuito.</div>
   <div class="callout callout-success"><strong>Máxima clássica:</strong> <em>genus nunquam perit</em> — o gênero nunca perece. Por isso o devedor não pode alegar perda antes da concentração.</div>
   <div class="callout callout-warning"><strong>Precisão:</strong> a escolha cabe ao devedor <strong>se outra coisa não se estipulou</strong> (art. 244). Dizer que "sempre será do devedor" é impreciso — as partes podem atribuí-la ao credor.</div>`},
  {id:"o3-5", h:"Obrigação de fazer", body:`
   <p>A <em>obligatio faciendi</em> abrange o serviço humano em geral, material ou imaterial, a realização de obras e artefatos, ou a prestação de fatos úteis ao credor. Qualquer atividade humana <strong>lícita, possível e vantajosa</strong> ao credor pode ser objeto.</p>
   <div class="caracteristicas-grid">
     <div class="carac-card"><div class="carac-num">INFUNGÍVEL</div><h4>Personalíssima (<em>intuitu personae</em>)</h4><p class="small muted">Deve ser cumprida pelo próprio devedor, em razão de seus atributos pessoais. Pode decorrer de cláusula expressa ou da própria natureza da prestação — pintor de renome, cirurgião plástico.</p></div>
     <div class="carac-card"><div class="carac-num">FUNGÍVEL</div><h4>Material ou impessoal</h4><p class="small muted">Pode ser realizada por terceiro, sem prejuízo relevante ao credor. Ex.: pintar uma parede, reformas, serviços comuns.</p></div>
   </div>
   <div class="artigo"><strong>CC, Art. 247</strong> — Incorre na obrigação de indenizar perdas e danos o devedor que recusar a prestação a ele só imposta, ou só por ele exequível.<br><br><strong>CC, Art. 249</strong> — Se o fato puder ser executado por terceiro, será livre ao credor mandá-lo executar à custa do devedor, havendo recusa ou mora deste, sem prejuízo da indenização cabível.</div>
   <p><strong>Inadimplemento:</strong> sendo a obrigação <strong>infungível</strong>, não há como compelir diretamente o devedor. Há meios indiretos, cumuláveis com perdas e danos — como a <strong>multa diária</strong>, semelhante às <em>astreintes</em> do direito francês. Sendo <strong>fungível</strong>, o credor pode optar pela execução específica por terceiro, à custa do devedor.</p>
   <div class="callout">Fungível ou infungível, <strong>será sempre possível ao credor optar pela conversão em perdas e danos</strong>, caso a inadimplência decorra de culpa do devedor.</div>`},
  {id:"o3-6", h:"Obrigação de não fazer", body:`
   <p>Impõe ao devedor um <strong>dever de abstenção</strong>: não praticar o ato que poderia livremente fazer, se não se houvesse obrigado.</p>
   <p>Além de não praticar determinados atos — não divulgar segredo industrial, não abrir estabelecimento de certo ramo —, há casos em que o devedor está obrigado a <strong>tolerar ou permitir</strong> que outrem pratique atos. Exemplos: o proprietário rural que permite a terceiro caçar em seu imóvel; o dono do prédio que tolera a entrada do vizinho para reparar o que lhe pertence.</p>
   <div class="artigo"><strong>CC, Art. 250</strong> — Extingue-se a obrigação de não fazer, desde que, sem culpa do devedor, se lhe torne impossível abster-se do ato, que se obrigou a não praticar.<br><br><strong>CC, Art. 251</strong> — Praticado pelo devedor o ato, a cuja abstenção se obrigara, o credor pode exigir dele que o desfaça, sob pena de se desfazer à sua custa, ressarcindo o culpado perdas e danos.<br><br><strong>Parágrafo único.</strong> Em caso de urgência, poderá o credor desfazer ou mandar desfazer, <strong>independentemente de autorização judicial</strong>, sem prejuízo do ressarcimento devido.</div>
   <div class="callout callout-warning">O <strong>parágrafo único do art. 251</strong> é ponto de prova: em urgência, o credor age <strong>sem autorização judicial</strong>.</div>`}],
 casos:[
  {t:"O cavalo que morre antes da entrega", resumo:"O devedor se obriga a entregar um cavalo específico, que morre antes da tradição.", detalhe:"É obrigação de dar coisa certa com perda. Sem culpa do devedor (doença súbita), aplica-se o art. 234, 1ª parte: resolve-se a obrigação para ambas as partes — cada um volta ao estado anterior. Com culpa (o devedor deixou de alimentá-lo), aplica-se a 2ª parte: responde pelo equivalente em dinheiro mais perdas e danos."},
  {t:"Dez sacas de café ainda não escolhidas", resumo:"O devedor deve dez sacas de café. Antes de separá-las, um incêndio destrói seu estoque.", detalhe:"É obrigação de dar coisa incerta, antes da concentração. Pelo art. 246, o devedor não pode alegar perda ou deterioração, ainda que por força maior ou caso fortuito — genus nunquam perit. Ele deve adquirir outras sacas e cumprir. Só após a escolha, quando a obrigação se torna certa, é que passa a incidir o regime dos arts. 234 e seguintes."},
  {t:"O muro construído em violação ao contrato", resumo:"O devedor se obrigara a não construir acima de certa altura, mas construiu.", detalhe:"Aplica-se o art. 251: o credor pode exigir o desfazimento, sob pena de mandar desfazer à custa do devedor, com ressarcimento de perdas e danos. Se houver urgência, o parágrafo único permite ao credor desfazer ou mandar desfazer independentemente de autorização judicial."}]},
{ id:4, title:"Obrigações compostas e solidariedade", subtitle:"Alternativa, facultativa, divisível, indivisível e o regime da solidariedade ativa e passiva.",
 sections:[
  {id:"o4-1", h:"Simples, cumulativas e alternativas", body:`
   <p>Quando a obrigação tem por objeto <strong>uma só prestação</strong> — entregar um veículo — diz-se que é <strong>simples</strong>. O mesmo vale quando há um só sujeito ativo e um único passivo.</p>
   <p>Havendo <strong>pluralidade de prestação</strong>, a obrigação é <strong>complexa ou composta</strong>, desdobrando-se em cumulativas, alternativas e facultativas.</p>
   <div class="caracteristicas-grid">
     <div class="carac-card"><div class="carac-num">"E"</div><h4>Cumulativa (conjuntiva)</h4><p class="small muted">O devedor deve <strong>todas</strong> as prestações. Só se libera cumprindo cada uma. Ex.: entregar o carro <strong>e</strong> a moto.</p></div>
     <div class="carac-card"><div class="carac-num">"OU"</div><h4>Alternativa (disjuntiva)</h4><p class="small muted">Compreende dois ou mais objetos e <strong>extingue-se com a prestação de apenas um</strong>. Ex.: entregar o carro <strong>ou</strong> a moto.</p></div>
   </div>
   <div class="artigo"><strong>CC, Art. 252</strong> — Nas obrigações alternativas, a escolha cabe ao devedor, se outra coisa não se estipulou.</div>
   <p>O devedor <strong>não pode obrigar o credor a receber parte em uma prestação e parte em outra</strong>. Quem se obriga a entregar duas sacas de café ou duas de arroz não pode compelir o credor a receber uma de cada.</p>
   <div class="callout">Em <strong>prestações periódicas</strong> (mensais, anuais), pode-se escolher o que entregar a cada período — arroz num mês, feijão no outro. Vedada continua a divisão <em>dentro</em> do mesmo período.</div>`},
  {id:"o4-2", h:"Impossibilidade nas obrigações alternativas", body:`
   <div class="table-wrap"><table class="styled-table">
   <tr><th>Situação</th><th>Artigo</th><th>Consequência</th></tr>
   <tr><td>Uma prestação se torna inexequível</td><td>Art. 253</td><td>Subsiste o débito quanto à outra — a obrigação se <strong>concentra na restante</strong> (redução do objeto)</td></tr>
   <tr><td>Todas impossíveis por culpa do devedor, escolha do devedor</td><td>Art. 254</td><td>Paga o valor da que <strong>por último</strong> se impossibilitou, mais perdas e danos</td></tr>
   <tr><td>Uma impossível por culpa do devedor, escolha do credor</td><td>Art. 255</td><td>O credor pode: a) exigir a prestação subsistente mais perdas e danos; ou b) exigir o valor da que se perdeu, com perdas e danos</td></tr>
   <tr><td>Todas impossíveis sem culpa do devedor</td><td>Art. 256</td><td><strong>Extingue-se</strong> a obrigação</td></tr></table></div>
   <div class="callout">O art. 253 opera a <strong>conversão da obrigação composta alternativa em obrigação simples</strong>.</div>`},
  {id:"o4-3", h:"Obrigações facultativas", body:`
   <p>É <strong>criação doutrinária</strong> — não está no Código Civil. O objeto da prestação é determinado: o devedor não deve outra coisa e o credor não pode pedir outra coisa. Mas, por derrogação ao rigor da obrigação, o devedor <strong>pode</strong> pagar coisa diversa da que constitui objeto da dívida.</p>
   <p><strong>Exemplo:</strong> o devedor pactua a entrega de dez sacas de milho, ficando à sua escolha entregar as sacas ou R$ 1.000 no dia 10/01/2024. Chegado o dia, ele escolhe. O credor não pode recusar, pois deu anuência anteriormente.</p>
   <div class="callout">A prestação <em>in facultate solutionis</em> (os mil reais) <strong>não é objeto da obrigação</strong>: o credor não pode reclamá-la. O devedor pode optar por ela, mas não pode ser coagido a fazê-lo.</div>
   <p>Havendo impossibilidade <strong>sem culpa</strong> de satisfazer a prestação devida, extingue-se a obrigação. Se a impossibilidade resultar de causa <strong>imputável ao devedor</strong>, o credor pode exigir o equivalente mais perdas e danos.</p>
   <div class="callout callout-success"><strong>Alternativa x facultativa:</strong> na alternativa há <strong>duas ou mais prestações devidas</strong>, e o credor pode exigir qualquer uma (conforme a escolha). Na facultativa há <strong>uma só prestação devida</strong>, com faculdade de substituição apenas pelo devedor.</div>`},
  {id:"o4-4", h:"Obrigações divisíveis e indivisíveis", body:`
   <p><strong>Divisível</strong> é a obrigação que admite cumprimento em partes, em prestações. <strong>Indivisível</strong> é a que só pode ser cumprida integralmente — por sua natureza, por motivo de ordem econômica ou pela razão determinante do negócio jurídico (art. 258).</p>
   <div class="artigo"><strong>CC, Art. 257</strong> — Havendo mais de um devedor ou credor em obrigação divisível, esta presume-se dividida em tantas obrigações, iguais e distintas, quantos os credores ou devedores.</div>
   <p>Assim, na <strong>divisível</strong>, cada credor só faz jus à sua parcela do crédito e cada devedor só responde por sua porção da dívida.</p>
   <div class="artigo"><strong>CC, Art. 259</strong> — Se, havendo dois ou mais devedores, a prestação não for divisível, <strong>cada um será obrigado pela dívida toda</strong>.<br><br><strong>Parágrafo único.</strong> O devedor que paga a dívida sub-roga-se no direito do credor em relação aos outros coobrigados.</div>
   <p>Havendo <strong>pluralidade de credores em obrigação indivisível</strong>, cada um pode exigir a dívida por inteiro, mas o devedor só se desobriga pagando a todos conjuntamente, ou pagando a um que dê <strong>caução de ratificação</strong> dos demais. Sem essa garantia, cabe ao devedor constituir os credores em mora e <strong>depositar judicialmente</strong> a coisa.</p>
   <div class="artigo"><strong>CC, Art. 261</strong> — Se um só dos credores receber a prestação por inteiro, a cada um dos outros assistirá o direito de exigir dele em dinheiro a parte que lhe caiba no total.<br><br><strong>CC, Art. 262</strong> — Se um dos credores remitir a dívida, a obrigação não ficará extinta para com os outros; mas estes só a poderão exigir descontada a quota do credor remitente. Parágrafo único: a mesma regra vale para transação, novação, compensação ou confusão.</div>
   <div class="artigo"><strong>CC, Art. 263</strong> — Perde a qualidade de indivisível a obrigação que se resolver em perdas e danos. § 1º Se houver culpa de todos os devedores, respondem todos por partes iguais. § 2º Se for de um só a culpa, ficarão exonerados os outros, respondendo só esse pelas perdas e danos.</div>
   <div class="callout callout-warning"><strong>Atenção:</strong> a regra de que "cada credor pode exigir toda a dívida" pertence à obrigação <strong>indivisível</strong> (art. 260), não à divisível. Na divisível vale o art. 257: cada um exige apenas sua parte. Alguns resumos misturam os dois regimes.</div>`},
  {id:"o4-5", h:"Solidariedade: conceito e distinção", body:`
   <div class="artigo"><strong>CC, Art. 264</strong> — Há solidariedade quando na mesma obrigação concorre mais de um credor, ou mais de um devedor, cada um com direito, ou obrigado, à dívida toda.</div>
   <p>Cada credor tem direito à <strong>totalidade</strong> da prestação, como se fosse o único credor; cada devedor está obrigado pelo <strong>débito todo</strong>, como se fosse o único devedor.</p>
   <div class="artigo"><strong>CC, Art. 275</strong> — O credor tem direito a exigir e receber de um ou de alguns dos devedores, parcial ou totalmente, a dívida comum; se o pagamento tiver sido parcial, todos os demais devedores continuam obrigados solidariamente pelo resto.</div>
   <p><strong>Exemplo:</strong> se A e B causam dano no prédio de C, no valor de R$ 100.000, C pode cobrar a dívida toda apenas de A ou apenas de B — são solidários passivos.</p>
   <div class="callout"><strong>Solidariedade x indivisibilidade:</strong> assemelham-se num ponto — em ambas o credor pode exigir de um só devedor a totalidade. Mas diferem: o devedor <strong>solidário</strong> é devedor <strong>do todo</strong> e pode ser compelido a pagar sozinho a dívida inteira. Na <strong>indivisível</strong>, o codevedor só deve sua quota-parte; é compelido ao todo apenas porque o objeto não pode ser fracionado.</div>
   <div class="artigo"><strong>CC, Art. 265</strong> — A solidariedade não se presume; resulta da lei ou da vontade das partes.</div>
   <p>Espécies: <strong>ativa</strong> (de credores), <strong>passiva</strong> (de devedores) e <strong>recíproca ou mista</strong> (simultaneamente de credores e devedores).</p>`},
  {id:"o4-6", h:"Solidariedade ativa", body:`
   <p>Há multiplicidade de credores, cada um com direito a uma quota. Mas, em razão da solidariedade, <strong>cada qual pode reclamar a prestação por inteiro</strong> do devedor comum. O devedor pagará a um só; o credor que receber entregará aos demais as quotas de cada um.</p>
   <div class="artigo"><strong>CC, Art. 267</strong> — Cada um dos credores solidários tem direito a exigir do devedor o cumprimento da prestação por inteiro.<br><br><strong>CC, Art. 268</strong> — Enquanto alguns dos credores solidários não demandarem o devedor comum, a qualquer daqueles poderá este pagar.<br><br><strong>CC, Art. 269</strong> — O pagamento feito a um dos credores solidários extingue a dívida até o montante do que foi pago.<br><br><strong>CC, Art. 270</strong> — Falecendo um dos credores solidários com herdeiros, cada um destes só terá direito a exigir e receber a quota do crédito correspondente ao seu quinhão hereditário, salvo se a obrigação for indivisível.<br><br><strong>CC, Art. 271</strong> — Convertendo-se a prestação em perdas e danos, <strong>subsiste</strong>, para todos os efeitos, a solidariedade.<br><br><strong>CC, Art. 273</strong> — A um dos credores solidários não pode o devedor opor as exceções pessoais oponíveis aos outros.</div>
   <div class="callout callout-success"><strong>Contraste-chave (art. 271):</strong> convertida em perdas e danos, a obrigação <strong>solidária</strong> mantém a solidariedade. Já a obrigação <strong>indivisível</strong> perde essa qualidade e vira divisível (art. 263), porque a soma em dinheiro é divisível.</div>
   <p><strong>Exceções pessoais (art. 273):</strong> se o devedor está sendo cobrado por credor plenamente capaz, não pode alegar em seu benefício defeito na representação de <em>outro</em> credor solidário — a exceção é pessoal e só a este pode ser oposta.</p>`},
  {id:"o4-7", h:"Solidariedade passiva e direito de regresso", body:`
   <p>Concorrência de dois ou mais devedores, cada um com dever de prestar a <strong>dívida toda</strong>. O credor pode cobrar de qualquer deles, de alguns ou de todos. Nessa modalidade o credor tem maiores chances de receber, pois escolhe o devedor de maior patrimônio.</p>
   <div class="artigo"><strong>CC, Art. 277</strong> — O pagamento parcial feito por um dos devedores e a remissão por ele obtida não aproveitam aos outros devedores, senão até à concorrência da quantia paga ou relevada.<br><br><strong>CC, Art. 278</strong> — Qualquer cláusula, condição ou obrigação adicional estipulada entre um dos devedores solidários e o credor não poderá agravar a posição dos outros sem consentimento destes.<br><br><strong>CC, Art. 279</strong> — Impossibilitando-se a prestação por culpa de um dos devedores solidários, subsiste para todos o encargo de pagar o equivalente; <strong>mas pelas perdas e danos só responde o culpado</strong>.<br><br><strong>CC, Art. 282</strong> — O credor pode renunciar à solidariedade em favor de um, de alguns ou de todos os devedores. Parágrafo único: exonerado um ou mais devedores, subsistirá a dos demais.</div>
   <div class="artigo"><strong>CC, Art. 283</strong> — O devedor que satisfez a dívida por inteiro tem direito a exigir de cada um dos codevedores a sua quota, <strong>dividindo-se igualmente por todos a do insolvente</strong>, se o houver, presumindo-se iguais, no débito, as partes de todos os codevedores.<br><br><strong>CC, Art. 284</strong> — No caso de rateio entre os codevedores, contribuirão também os exonerados da solidariedade pelo credor, <strong>pela parte que na obrigação incumbia ao insolvente</strong>.</div>
   <div class="callout callout-warning"><strong>Art. 279 é ponto de prova:</strong> o <strong>equivalente</strong> todos devem solidariamente; as <strong>perdas e danos</strong> só o culpado paga.</div>`},
  {id:"o4-8", h:"O caso dos R$ 360.000: rateio com insolvente", body:`
   <p>Este exemplo integra os arts. 283 e 284. Acompanhe passo a passo.</p>
   <p><strong>Situação:</strong> o credor de A, B, C e D, pela quantia de <strong>R$ 360.000</strong>, renunciou à solidariedade em favor de <strong>A</strong>, que lhe pagou sua parte de <strong>R$ 90.000</strong>. Depois, <strong>D</strong> tornou-se insolvente. <strong>B</strong> pagou sozinho os <strong>R$ 270.000</strong> restantes.</p>
   <div class="table-wrap"><table class="styled-table">
   <tr><th>Devedor</th><th>Quota original</th><th>Situação</th><th>Quanto arca ao final</th></tr>
   <tr><td>A</td><td>R$ 90.000</td><td>Exonerado da solidariedade; já pagou sua quota</td><td>R$ 30.000 (participação na quota do insolvente)</td></tr>
   <tr><td>B</td><td>R$ 90.000</td><td>Pagou R$ 270.000; titular do regresso</td><td>R$ 120.000 (90.000 + 30.000)</td></tr>
   <tr><td>C</td><td>R$ 90.000</td><td>Deve a B</td><td>R$ 120.000 (90.000 + 30.000)</td></tr>
   <tr><td>D</td><td>R$ 90.000</td><td><strong>Insolvente</strong></td><td>R$ 0 — sua quota é rateada</td></tr></table></div>
   <p><strong>Como B se ressarce:</strong> exige de C a soma de <strong>R$ 120.000</strong> (R$ 90.000 da quota de C + R$ 30.000 de participação na quota do insolvente) e de A, mesmo exonerado, <strong>R$ 30.000</strong> (participação na quota do insolvente, conforme o art. 284). B fica desfalcado de R$ 120.000.</p>
   <div class="callout callout-success"><strong>Confira a conta:</strong> 120.000 (C) + 30.000 (A) + 120.000 (B) = R$ 270.000. Fecha exatamente com o que B desembolsou.</div>
   <div class="callout"><strong>A lição do art. 284:</strong> a renúncia à solidariedade libera o devedor da dívida toda, mas <strong>não</strong> o libera de contribuir para a quota do insolvente. É por isso que A ainda paga R$ 30.000.</div>`}],
 casos:[
  {t:"O devedor que paga tudo e cobra os demais", resumo:"Três devedores solidários devem R$ 90.000. Um deles paga o valor integral ao credor.", detalhe:"Pelo art. 283, o devedor que satisfez a dívida por inteiro tem direito a exigir de cada codevedor a sua quota — R$ 30.000 de cada um dos outros dois. Note que ele NÃO cobra R$ 90.000 de cada um; cobra a quota-parte. Se um dos codevedores for insolvente, sua parte se divide igualmente entre os demais, inclusive quem já foi exonerado da solidariedade (art. 284)."},
  {t:"O carro destruído por culpa de um só devedor solidário", resumo:"A e B devem solidariamente entregar um veículo. B o destrói por negligência.", detalhe:"Aplica-se o art. 279: subsiste para A e B o encargo de pagar o equivalente em dinheiro — ambos permanecem solidários quanto ao valor. Mas as perdas e danos decorrentes da destruição só B paga, porque só ele teve culpa. É a distinção entre o equivalente (solidário) e a indenização suplementar (pessoal do culpado)."},
  {t:"Remissão concedida a um dos codevedores", resumo:"O credor perdoa a dívida de um dos três devedores solidários.", detalhe:"Pelo art. 277 e pelo art. 388, a remissão concedida a um extingue a dívida na parte a ele correspondente. O credor pode reservar a solidariedade contra os outros, mas já não pode cobrar o débito sem deduzir a parte remitida. A lógica é a mesma da remissão na obrigação indivisível com pluralidade de credores (art. 262)."}]},
{ id:5, title:"Adimplemento, mora e extinção", subtitle:"Complemento — como as obrigações se cumprem, o que acontece quando não se cumprem, e as demais formas de extinção.",
 sections:[
  {id:"o5-1", h:"Pagamento: quem paga, a quem e onde", body:`<span class="badge badge-comp">Complemento</span>
   <p class="comp-note">Conteúdo acrescentado para completar o tema — não constava no material de aula.</p>
   <p>O <strong>pagamento</strong> é a forma natural de extinção da obrigação — o adimplemento voluntário da prestação devida.</p>
   <div class="table-wrap"><table class="styled-table">
   <tr><th>Aspecto</th><th>Regra</th><th>Artigos</th></tr>
   <tr><td><strong>Quem deve pagar</strong></td><td>O devedor, mas também terceiro interessado (que se sub-roga) ou não interessado (que pode reembolsar-se, sem sub-rogação)</td><td>304 a 307</td></tr>
   <tr><td><strong>A quem se paga</strong></td><td>Ao credor ou a seu representante. Paga mal quem paga duas vezes: o pagamento a terceiro só vale se ratificado ou se reverter em proveito do credor</td><td>308 a 312</td></tr>
   <tr><td><strong>Objeto</strong></td><td>O credor não é obrigado a receber prestação diversa, ainda que mais valiosa</td><td>313</td></tr>
   <tr><td><strong>Lugar</strong></td><td>Regra: domicílio do <strong>devedor</strong> — dívida <strong>quesível</strong> (<em>querable</em>). Se ajustado o domicílio do credor, é <strong>portável</strong></td><td>327</td></tr>
   <tr><td><strong>Tempo</strong></td><td>No vencimento. Sem prazo estipulado, o credor pode exigir imediatamente</td><td>331 e 332</td></tr></table></div>
   <div class="callout callout-success"><strong>Macete:</strong> <strong>QU</strong>esível → o credor vai <strong>QU</strong>erer no domicílio do devedor. <strong>PORT</strong>ável → o devedor <strong>PORT</strong>a o pagamento até o credor. A regra do CC é a <em>quesível</em>.</div>
   <p><strong>Prova do pagamento:</strong> a quitação (art. 319) é direito do devedor, que pode reter o pagamento enquanto não lhe for dada. Há presunções úteis: quitação do capital sem ressalva presume pagos os juros (art. 323); quitação da última parcela presume pagas as anteriores (art. 322).</p>`},
  {id:"o5-2", h:"Mora e inadimplemento", body:`<span class="badge badge-comp">Complemento</span>
   <div class="artigo"><strong>CC, Art. 394</strong> — Considera-se em mora o devedor que não efetuar o pagamento e o credor que não quiser recebê-lo no tempo, lugar e forma que a lei ou a convenção estabelecer.</div>
   <div class="table-wrap"><table class="styled-table">
   <tr><th></th><th>Mora do devedor (<em>solvendi</em>)</th><th>Mora do credor (<em>accipiendi</em>)</th></tr>
   <tr><td>Configuração</td><td>Exige <strong>culpa</strong> (art. 396)</td><td><strong>Independe</strong> de culpa</td></tr>
   <tr><td>Efeito principal</td><td>Responde por prejuízos, juros, correção e honorários (art. 395)</td><td>Devedor livra-se da responsabilidade pela conservação da coisa (art. 400)</td></tr>
   <tr><td>Risco</td><td>Responde pela impossibilidade <strong>ainda que por caso fortuito</strong> (art. 399)</td><td>Credor arca com despesas de conservação</td></tr></table></div>
   <h4 style="margin-top:22px">Mora ex re e ex persona</h4>
   <div class="caracteristicas-grid">
     <div class="carac-card"><div class="carac-num">EX RE</div><h4>Automática</h4><p class="small muted">Obrigação positiva, líquida e com termo certo: o inadimplemento constitui de pleno direito o devedor em mora (art. 397, caput). <em>Dies interpellat pro homine</em> — o dia interpela pelo homem.</p></div>
     <div class="carac-card"><div class="carac-num">EX PERSONA</div><h4>Depende de interpelação</h4><p class="small muted">Sem termo certo, a mora se constitui por interpelação judicial ou extrajudicial (art. 397, parágrafo único).</p></div>
   </div>
   <div class="callout callout-warning"><strong>Purgação da mora (art. 401):</strong> o devedor purga oferecendo a prestação mais os prejuízos decorrentes do dia da oferta; o credor, oferecendo-se a receber e ressarcindo as despesas. <strong>Mora ≠ inadimplemento absoluto:</strong> na mora a prestação ainda é útil ao credor; se deixou de sê-lo, o credor pode enjeitá-la e exigir perdas e danos (art. 395, parágrafo único).</div>`},
  {id:"o5-3", h:"Perdas e danos, juros e cláusula penal", body:`<span class="badge badge-comp">Complemento</span>
   <div class="artigo"><strong>CC, Art. 402</strong> — As perdas e danos devidas ao credor abrangem, além do que ele efetivamente perdeu (<strong>dano emergente</strong>), o que razoavelmente deixou de lucrar (<strong>lucro cessante</strong>).<br><br><strong>CC, Art. 403</strong> — Ainda que a inexecução resulte de dolo do devedor, as perdas e danos só incluem os prejuízos <strong>efetivos</strong> e os lucros cessantes <strong>por efeito dela direto e imediato</strong>.</div>
   <div class="callout">O art. 403 consagra a <strong>teoria do dano direto e imediato</strong>: não se indeniza dano remoto, ainda que na cadeia causal.</div>
   <h4 style="margin-top:22px">Cláusula penal (arts. 408 a 416)</h4>
   <div class="table-wrap"><table class="styled-table">
   <tr><th>Espécie</th><th>Função</th><th>Efeito</th></tr>
   <tr><td><strong>Compensatória</strong></td><td>Prefixa perdas e danos pelo inadimplemento total</td><td>O credor escolhe: a pena <strong>ou</strong> o cumprimento (alternativa em benefício do credor — art. 410)</td></tr>
   <tr><td><strong>Moratória</strong></td><td>Sanciona o simples atraso ou o descumprimento de cláusula especial</td><td>Cumula-se com a obrigação principal (art. 411)</td></tr></table></div>
   <div class="callout callout-warning"><strong>Limite (art. 412):</strong> o valor da cominação não pode exceder o da obrigação principal. E, pelo <strong>art. 413</strong>, a penalidade <strong>deve</strong> ser reduzida equitativamente pelo juiz se a obrigação foi cumprida em parte ou se o montante for manifestamente excessivo — é dever, não faculdade.</div>
   <p><strong>Arras (arts. 417 a 420):</strong> o sinal dado na conclusão do contrato. <strong>Confirmatórias</strong> — se houver arrependimento por quem as deu, perde-as; se por quem as recebeu, devolve-as em dobro (art. 418). <strong>Penitenciais</strong> — quando estipulado direito de arrependimento, funcionam como indenização única, sem direito a perdas e danos suplementares (art. 420).</p>`},
  {id:"o5-4", h:"Outras formas de extinção", body:`<span class="badge badge-comp">Complemento</span>
   <p>Além do pagamento direto, o Código prevê formas especiais de extinção.</p>
   <div class="table-wrap"><table class="styled-table">
   <tr><th>Forma</th><th>Conceito</th><th>Artigos</th></tr>
   <tr><td><strong>Consignação em pagamento</strong></td><td>Depósito judicial ou em banco da coisa devida, quando o credor recusa, não comparece ou há dúvida sobre quem deva receber</td><td>334 a 345</td></tr>
   <tr><td><strong>Sub-rogação</strong></td><td>Terceiro paga e assume a posição do credor, com todos os direitos, ações e garantias</td><td>346 a 351</td></tr>
   <tr><td><strong>Imputação do pagamento</strong></td><td>Havendo várias dívidas do mesmo devedor ao mesmo credor, define-se qual está sendo quitada</td><td>352 a 355</td></tr>
   <tr><td><strong>Dação em pagamento</strong></td><td>O credor <strong>consente</strong> em receber prestação diversa da devida</td><td>356 a 359</td></tr>
   <tr><td><strong>Novação</strong></td><td>Cria-se nova obrigação para extinguir a anterior. Pode ser objetiva, subjetiva ativa ou passiva</td><td>360 a 367</td></tr>
   <tr><td><strong>Compensação</strong></td><td>Duas pessoas são simultaneamente credora e devedora uma da outra. Exige dívidas <strong>líquidas, vencidas e de coisas fungíveis</strong></td><td>368 a 380</td></tr>
   <tr><td><strong>Confusão</strong></td><td>Reúnem-se na mesma pessoa as qualidades de credor e devedor</td><td>381 a 384</td></tr>
   <tr><td><strong>Remissão</strong></td><td>Perdão da dívida pelo credor</td><td>385 a 388</td></tr></table></div>
   <div class="callout"><strong>Dação x novação:</strong> na dação, o credor recebe coisa diversa e a obrigação se extingue no ato. Na novação, cria-se uma <strong>nova obrigação</strong> que substitui a antiga — é preciso o <em>animus novandi</em> (art. 361), pois a novação não se presume.</div>
   <div class="callout callout-success"><strong>Confusão x compensação:</strong> na confusão há <strong>uma</strong> obrigação e <strong>uma</strong> pessoa que acumula os dois polos. Na compensação há <strong>duas</strong> obrigações recíprocas que se anulam até onde se equivalem.</div>`},
  {id:"o5-5", h:"Transmissão das obrigações e adimplemento substancial", body:`<span class="badge badge-comp">Complemento</span>
   <div class="table-wrap"><table class="styled-table">
   <tr><th>Instituto</th><th>O que se transmite</th><th>Exige consentimento?</th><th>Artigos</th></tr>
   <tr><td><strong>Cessão de crédito</strong></td><td>A posição de <strong>credor</strong></td><td>Não do devedor — basta <strong>notificá-lo</strong> (art. 290)</td><td>286 a 298</td></tr>
   <tr><td><strong>Assunção de dívida</strong></td><td>A posição de <strong>devedor</strong></td><td><strong>Sim</strong>, consentimento expresso do credor (art. 299)</td><td>299 a 303</td></tr>
   <tr><td><strong>Cessão de contrato</strong></td><td>A posição contratual inteira</td><td>Sim, da outra parte</td><td>Sem disciplina própria no CC</td></tr></table></div>
   <div class="callout callout-warning"><strong>A razão da diferença:</strong> ao credor é indiferente <em>de quem</em> recebe, desde que receba — por isso a cessão de crédito dispensa anuência do devedor. Mas ao credor <strong>não</strong> é indiferente <em>quem</em> lhe deve, pois a solvência muda. Daí a assunção de dívida exigir consentimento expresso.</div>
   <h4 style="margin-top:22px">Teoria do adimplemento substancial</h4>
   <p>Construção doutrinária e jurisprudencial (<em>substantial performance</em>), ancorada na <strong>boa-fé objetiva</strong> (art. 422) e na vedação ao abuso de direito (art. 187): cumprida a obrigação em parte muito significativa, veda-se ao credor a resolução do contrato, restando-lhe as vias de cobrança do saldo.</p>
   <div class="callout"><strong>Exemplo típico:</strong> financiamento de 48 parcelas com 45 pagas. A busca e apreensão do bem seria desproporcional; o credor deve cobrar as três restantes. Atenção, porém: o <strong>STJ tem restringido</strong> a aplicação da teoria na alienação fiduciária regida pelo Decreto-Lei nº 911/69, por haver disciplina legal específica.</div>`}],
 casos:[
  {t:"O terceiro que paga a dívida alheia", resumo:"O irmão do devedor, sem ser fiador nem coobrigado, paga a dívida para evitar a execução.", detalhe:"É terceiro não interessado. Pagando em nome próprio, tem direito a reembolsar-se, mas NÃO se sub-roga nos direitos do credor (art. 305) — ou seja, não herda as garantias. Já o terceiro interessado (fiador, coobrigado) sub-roga-se de pleno direito (art. 346, III), assumindo todos os direitos, ações e garantias do credor primitivo. A distinção é sutil e cai em prova."},
  {t:"A multa que superava o valor da dívida", resumo:"Contrato prevê cláusula penal de R$ 60.000 para obrigação principal de R$ 40.000.", detalhe:"Viola o art. 412: o valor da cominação não pode exceder o da obrigação principal. A cláusula é reduzida ao teto de R$ 40.000. E se a obrigação tiver sido cumprida em parte, o art. 413 impõe ao juiz o dever — não a faculdade — de reduzir equitativamente a penalidade, também quando o montante for manifestamente excessivo diante da natureza e finalidade do negócio."},
  {t:"Atraso que ainda interessa ao credor", resumo:"O fornecedor entrega a mercadoria com quinze dias de atraso; o comprador ainda precisa dela.", detalhe:"É mora, não inadimplemento absoluto: a prestação continua útil. O credor deve recebê-la, podendo exigir os prejuízos do atraso, juros e correção (art. 395). Se, porém, a prestação tiver se tornado inútil — mercadoria para evento que já passou —, o parágrafo único do art. 395 autoriza o credor a enjeitá-la e exigir perdas e danos, convertendo-se em inadimplemento absoluto."}]}
];

 {q:"O art. 422 do Código Civil consagra:", opts:["A função social do contrato","A probidade e a boa-fé objetiva na conclusão e execução do contrato","A autonomia da vontade","O pacta sunt servanda"], correct:1, exp:"Boa-fé objetiva é padrão concreto de conduta: lealdade, cooperação, transparência e dever de informação.", aula:2},
 {q:"A mora do credor exige culpa?", opts:["Sim","Não — apenas a mora do devedor exige culpa (art. 396)","Sim, culpa grave","Depende do contrato"], correct:1, exp:"Na mora accipiendi o credor arca com as despesas de conservação e o devedor livra-se da responsabilidade pela coisa.", aula:5},
 {q:"O que é mora ex re?", opts:["A que depende de interpelação","A automática: obrigação positiva, líquida e com termo certo — dies interpellat pro homine","A mora do credor","A mora culposa"], correct:1, exp:"Sem termo certo, a mora é ex persona e exige interpelação judicial ou extrajudicial (art. 397, parágrafo único).", aula:5},
 {q:"A cessão de crédito exige consentimento do devedor?", opts:["Sim","Não — basta notificá-lo (art. 290)","Sim, por escrito","Só se houver garantia"], correct:1, exp:"Já a assunção de dívida exige consentimento expresso do CREDOR (art. 299), pois a solvência do devedor lhe importa.", aula:5},
 {q:"Perdas e danos abrangem o quê (art. 402)?", opts:["Apenas o dano emergente","O dano emergente e o lucro cessante","Apenas o lucro cessante","Somente o dano moral"], correct:1, exp:"Dano emergente é o que efetivamente se perdeu; lucro cessante é o que razoavelmente se deixou de lucrar.", aula:5},
 {q:"Convertida em perdas e danos, o que acontece com a obrigação solidária?", opts:["Perde a solidariedade","Subsiste a solidariedade (art. 271)","Extingue-se","Torna-se facultativa"], correct:1, exp:"Diferente da indivisível, que perde a indivisibilidade e vira divisível (art. 263).", aula:4}],
dificil:[
 {q:"O devedor deve entregar coisa certa que se perde SEM culpa. Qual a consequência?", opts:["Responde pelo equivalente mais perdas e danos","Fica resolvida a obrigação para ambas as partes (art. 234, 1ª parte)","O credor aceita a coisa com abatimento","Nada muda"], correct:1, exp:"Com culpa, aplica-se a 2ª parte: equivalente mais perdas e danos.", aula:3},
 {q:"Coisa certa a RESTITUIR se deteriora SEM culpa do devedor. Qual a solução do art. 240?", opts:["Resolve-se a obrigação","O credor recebe a coisa no estado em que se encontra","O credor exige o equivalente","O devedor paga perdas e danos"], correct:1, exp:"Note a diferença: na obrigação de DAR com deterioração sem culpa (art. 235), o credor pode resolver a obrigação ou aceitar com abatimento.", aula:3},
 {q:"Impossibilitada a prestação por culpa de um dos devedores solidários, qual a consequência (art. 279)?", opts:["Todos respondem por tudo, inclusive perdas e danos","Subsiste para todos o encargo de pagar o equivalente, mas pelas perdas e danos só responde o culpado","Extingue-se a obrigação","Só o culpado paga o equivalente"], correct:1, exp:"Distinção clássica: o equivalente é solidário; a indenização suplementar é pessoal do culpado.", aula:4},
 {q:"Qual a diferença essencial entre solidariedade e indivisibilidade?", opts:["Não há diferença","Na solidariedade cada devedor é devedor do TODO; na indivisibilidade o codevedor só deve sua quota, sendo compelido ao todo porque o objeto não se fraciona","A solidariedade só existe entre credores","A indivisibilidade decorre sempre da lei"], correct:1, exp:"Assemelham-se apenas em um ponto: o credor pode exigir de um só devedor a totalidade do objeto.", aula:4},
 {q:"Tornando-se impossíveis TODAS as prestações alternativas por culpa do devedor, cabendo a ele a escolha (art. 254):", opts:["Extingue-se a obrigação","Paga o valor da que por último se impossibilitou, mais perdas e danos","Paga o valor da mais cara","O credor escolhe qual valor exigir"], correct:1, exp:"Se a escolha coubesse ao credor e apenas uma se impossibilitasse, aplicar-se-ia o art. 255.", aula:4},
 {q:"Cláusula penal cujo valor excede o da obrigação principal:", opts:["É válida integralmente","É reduzida ao valor da obrigação principal (art. 412)","É nula por inteiro","Depende de acordo das partes"], correct:1, exp:"E pelo art. 413 o juiz DEVE reduzi-la equitativamente se houver cumprimento parcial ou excesso manifesto.", aula:5},
 {q:"Diferença entre compensação e confusão:", opts:["São sinônimos","Na compensação há duas obrigações recíprocas; na confusão, uma obrigação e uma pessoa que acumula os dois polos","A confusão exige dívidas líquidas","A compensação só ocorre judicialmente"], correct:1, exp:"A compensação exige dívidas líquidas, vencidas e de coisas fungíveis (art. 369).", aula:5},
 {q:"Terceiro NÃO interessado que paga dívida alheia em nome próprio:", opts:["Sub-roga-se em todos os direitos do credor","Tem direito a reembolso, mas NÃO se sub-roga (art. 305)","Nada pode exigir","Torna-se credor solidário"], correct:1, exp:"Já o terceiro interessado (fiador, coobrigado) sub-roga-se de pleno direito (art. 346, III), com garantias e ações.", aula:5},
 {q:"O que é a teoria do adimplemento substancial?", opts:["Permite ao credor resolver o contrato a qualquer tempo","Cumprida a obrigação em parte muito significativa, veda-se a resolução, restando a cobrança do saldo","Extingue a dívida remanescente","Autoriza o devedor a não pagar o restante"], correct:1, exp:"Ancorada na boa-fé objetiva (art. 422) e na vedação ao abuso de direito (art. 187). O STJ tem restringido sua aplicação na alienação fiduciária do DL 911/69.", aula:5},
 {q:"Quatro devedores devem R$ 360.000. O credor renuncia à solidariedade quanto a A, que paga R$ 90.000. D fica insolvente e B paga os R$ 270.000. Quanto B exige de A?", opts:["Nada, pois A foi exonerado","R$ 30.000, referentes à participação na quota do insolvente (art. 284)","R$ 90.000","R$ 120.000"], correct:1, exp:"A renúncia à solidariedade não libera o devedor de contribuir para a quota do insolvente. De C, B exige R$ 120.000.", aula:4},
 {q:"Praticado o ato a cuja abstenção o devedor se obrigara, e havendo urgência, o credor:", opts:["Deve necessariamente pedir autorização judicial","Pode desfazer ou mandar desfazer independentemente de autorização judicial (art. 251, parágrafo único)","Só pode pedir perdas e danos","Perde o direito"], correct:1, exp:"Sem prejuízo do ressarcimento devido. Fora da urgência, exige-se que o devedor desfaça, sob pena de se desfazer à sua custa.", aula:3},
 {q:"Sobre os frutos na obrigação de dar coisa certa antes da tradição:", opts:["Todos pertencem ao credor","Os frutos percebidos pertencem ao devedor; os percipiendos não colhidos até a tradição passam ao credor","Todos pertencem ao devedor","Dividem-se igualmente"], correct:1, exp:"Art. 237: até a tradição a coisa pertence ao devedor, com melhoramentos e acrescidos, pelos quais pode exigir aumento no preço.", aula:3}]};
const OBR_D = [
 {q:"Explique os elementos constitutivos da obrigação civil, detalhando o vínculo jurídico em seus dois aspectos.", nivel:"médio", aula:1,
  model:"A obrigação civil possui três elementos. O elemento subjetivo compreende os sujeitos: o sujeito ativo, ou credor (accipiens), titular do direito de exigir a prestação; e o sujeito passivo, ou devedor (solvens), que tem o dever jurídico de cumpri-la e responde com seu patrimônio em caso de descumprimento. O elemento objetivo é a prestação — o comportamento que o devedor deve adotar, consistente em dar, fazer ou não fazer —, que deve ser juridicamente possível, lícita e determinada ou determinável. O terceiro elemento é o vínculo jurídico, ligação imaterial que transforma uma relação de fato em relação obrigacional exigível. A doutrina o desdobra em dois aspectos: o débito (Schuld), correspondente ao dever de cumprir a prestação; e a responsabilidade (Haftung), relacionada à sujeição às consequências jurídicas do inadimplemento, das quais decorrem perdas e danos, juros, atualização monetária e honorários."},
 {q:"Diferencie obrigação propter rem de obrigação pessoal e justifique por que a primeira é considerada híbrida.", nivel:"médio", aula:2,
  model:"A obrigação propter rem — literalmente 'em razão da coisa' — surge da titularidade, posse ou relação jurídica da pessoa com determinado bem. Está vinculada à coisa e, em regra, acompanha o bem quando ocorre a transferência da titularidade, razão pela qual também é chamada de obrigação ambulatória. São exemplos as despesas condominiais, os deveres de vizinhança e as despesas de conservação de coisa comum; o art. 1.345 do Código Civil determina que o adquirente de unidade responde pelos débitos condominiais do alienante, inclusive multas e juros. A obrigação pessoal, ou in personam, vincula credor a devedor determinado ou determinável, sem depender da titularidade de uma coisa: pagar o preço, pagar aluguel, executar serviço, indenizar dano. A propter rem é híbrida porque combina características dos dois regimes: aproxima-se do direito real por estar ligada a uma coisa e acompanhá-la, com sujeito passivo identificado pelo titular atual do bem; mas mantém natureza obrigacional porque impõe a alguém o dever de cumprir uma prestação, e não um poder direto sobre a coisa."},
 {q:"Analise o regime da perda e da deterioração na obrigação de dar coisa certa (arts. 234 a 240), distinguindo as hipóteses com e sem culpa.", nivel:"difícil", aula:3,
  model:"O regime cruza três variáveis: a natureza da obrigação (dar ou restituir), o fato ocorrido (perda ou deterioração) e a presença de culpa. Na obrigação de DAR com PERDA, o art. 234 estabelece que, sem culpa do devedor, fica resolvida a obrigação para ambas as partes, voltando cada uma ao estado anterior; com culpa, o devedor responde pelo equivalente em dinheiro mais perdas e danos. Na obrigação de DAR com DETERIORAÇÃO, sem culpa (art. 235) o credor pode resolver a obrigação ou aceitar a coisa com abatimento, do preço, do valor que ela perdeu; com culpa (art. 236), o credor pode exigir o equivalente ou aceitar a coisa no estado em que se acha, tendo direito, em qualquer dos casos, a perdas e danos. Na obrigação de RESTITUIR com PERDA, sem culpa (art. 238) resolve-se a obrigação para ambas as partes; com culpa (art. 239), o devedor responde pelo equivalente mais perdas e danos. Na obrigação de RESTITUIR com DETERIORAÇÃO, o art. 240 prevê que, sem culpa, o credor recebe a coisa no estado em que se encontra, sem direito a indenização; com culpa, pode exigir o equivalente ou aceitar a coisa com abatimento do preço, mais perdas e danos em ambos os casos. O padrão que se extrai é que, ausente culpa, a obrigação tende a se resolver ou a coisa é recebida como está; presente culpa, acresce-se sempre a indenização por perdas e danos. Registre-se que 'equivalente', na linguagem legal, significa o valor da coisa em moeda corrente."},
 {q:"Distinga obrigação alternativa, facultativa e cumulativa, indicando a quem cabe a escolha e as consequências da impossibilidade.", nivel:"difícil", aula:4,
  model:"Quando a obrigação tem por objeto uma só prestação, é simples. Havendo pluralidade de prestações, é complexa ou composta, desdobrando-se em três modalidades. Na obrigação CUMULATIVA ou conjuntiva, ligada pela partícula 'e', o devedor deve todas as prestações e só se libera cumprindo cada uma delas. Na obrigação ALTERNATIVA, ligada pela partícula 'ou', há duas ou mais prestações devidas, mas a obrigação se extingue com o cumprimento de apenas uma; pelo art. 252, a escolha (concentração) cabe ao devedor se outra coisa não se estipulou, e o devedor não pode obrigar o credor a receber parte em uma prestação e parte em outra. Quanto à impossibilidade: se apenas uma prestação se torna inexequível, subsiste o débito quanto à outra, concentrando-se a obrigação na restante (art. 253); tornando-se todas impossíveis por culpa do devedor, cabendo a ele a escolha, pagará o valor da que por último se impossibilitou mais perdas e danos (art. 254); se a escolha couber ao credor e apenas uma se tornar impossível por culpa do devedor, o credor pode exigir a subsistente mais perdas e danos, ou o valor da que se perdeu com perdas e danos (art. 255); e se todas se tornarem impossíveis sem culpa, extingue-se a obrigação (art. 256). Já a obrigação FACULTATIVA é criação doutrinária, não prevista no Código: há uma única prestação devida, mas o devedor tem a faculdade de substituí-la por outra. A prestação in facultate solutionis não é objeto da obrigação, de modo que o credor não pode reclamá-la, nem coagir o devedor a optar por ela."},
 {q:"Disserte sobre a mora: espécies, requisitos e a distinção em relação ao inadimplemento absoluto.", nivel:"difícil", aula:5, model:"Nos termos do art. 394, considera-se em mora o devedor que não efetuar o pagamento e o credor que não quiser recebê-lo no tempo, lugar e forma convencionados. Há duas espécies. A mora do devedor (solvendi) exige culpa, nos termos do art. 396, segundo o qual não havendo fato ou omissão imputável ao devedor não incorre este em mora. Seus efeitos são severos: responde pelos prejuízos causados, mais juros, atualização monetária e honorários (art. 395), e passa a responder pela impossibilidade da prestação ainda que decorrente de caso fortuito ocorrido durante o atraso (art. 399), salvo se provar isenção de culpa ou que o dano sobreviria mesmo sem a mora. A mora do credor (accipiendi), ao contrário, independe de culpa: basta a recusa injustificada em receber. Seus efeitos são inversos: subtrai o devedor isento de dolo da responsabilidade pela conservação da coisa, obriga o credor a ressarcir as despesas de conservação e sujeita-o a receber a coisa pela estimação mais favorável ao devedor (art. 400). Quanto à constituição, a mora pode ser ex re, quando automática — obrigação positiva, líquida e com termo certo, aplicando-se o brocardo dies interpellat pro homine (art. 397, caput) — ou ex persona, quando dependente de interpelação judicial ou extrajudicial (parágrafo único). A distinção fundamental em relação ao inadimplemento absoluto está na utilidade da prestação: na mora, ela ainda interessa ao credor, sendo possível a purgação (art. 401); tornando-se inútil, o credor pode enjeitá-la e exigir perdas e danos, convertendo-se em inadimplemento absoluto (art. 395, parágrafo único)."},
 {q:"Explique o direito de regresso na solidariedade passiva, incluindo o tratamento da quota do insolvente e do devedor exonerado.", nivel:"difícil", aula:4,
  model:"Na solidariedade passiva, cada devedor está obrigado pela dívida toda, podendo o credor exigi-la integralmente de qualquer deles (arts. 264 e 275). Internamente, porém, cada codevedor responde apenas por sua quota-parte. Por isso o art. 283 assegura que o devedor que satisfez a dívida por inteiro tem direito a exigir de cada um dos codevedores a sua quota, presumindo-se iguais, no débito, as partes de todos. Havendo codevedor insolvente, sua quota divide-se igualmente entre todos os demais. O art. 284 acrescenta regra importante: no rateio, contribuem também os devedores que o credor houver exonerado da solidariedade, pela parte que na obrigação incumbia ao insolvente. Ou seja, a renúncia à solidariedade libera o devedor de responder pela dívida toda perante o credor, mas não o libera de participar do rateio da quota do insolvente. Ilustrando: se quatro devedores devem R$ 360.000, com quotas de R$ 90.000, e o credor renuncia à solidariedade quanto a A, que paga sua parte, tornando-se D insolvente e pagando B os R$ 270.000 restantes, B poderá exigir de C R$ 120.000 (R$ 90.000 da quota de C mais R$ 30.000 de participação na quota do insolvente) e de A, ainda que exonerado, R$ 30.000 pela participação na quota do insolvente, suportando ele próprio R$ 120.000."}];
const OBR_F = [
 {aula:1, f:"Fórmula básica da obrigação", b:"Credor + devedor + prestação + vínculo jurídico."},
 {aula:1, f:"Como se chamam credor e devedor em latim?", b:"Credor: accipiens (sujeito ativo). Devedor: solvens (sujeito passivo)."},
 {aula:1, f:"O que distingue a relação obrigacional?", b:"O objeto: a prestação tem conteúdo patrimonial, com expressão econômica direta ou indireta."},
 {aula:1, f:"Os dois aspectos do vínculo jurídico", b:"Débito (Schuld): o dever de cumprir. Responsabilidade (Haftung): a sujeição às consequências do inadimplemento."},
 {aula:1, f:"Requisitos da prestação", b:"Juridicamente possível, lícita e determinada ou determinável. Se decorrer de negócio jurídico, valem os requisitos do art. 104."},
 {aula:1, f:"Obrigações recíprocas na compra e venda", b:"O comprador é credor da entrega e devedor do preço; o vendedor é credor do preço e devedor da entrega."},
 {aula:5, f:"Dívida quesível x portável", b:"Quesível: paga-se no domicílio do DEVEDOR — é a regra do art. 327. Portável: no domicílio do credor, se ajustado."},
 {aula:5, f:"Terceiro interessado x não interessado", b:"Interessado (fiador, coobrigado): sub-roga-se de pleno direito, com garantias. Não interessado: tem reembolso, mas não se sub-roga (art. 305)."},
 {aula:5, f:"Presunções de quitação", b:"Quitação do capital sem ressalva presume pagos os juros (art. 323). Quitação da última parcela presume pagas as anteriores (art. 322)."},
 {aula:5, f:"Mora do devedor x mora do credor", b:"Solvendi: exige culpa (art. 396) e o devedor responde até por caso fortuito (art. 399). Accipiendi: independe de culpa; o credor arca com a conservação."},
 {aula:5, f:"Mora ex re x ex persona", b:"Ex re: automática, em obrigação positiva, líquida e com termo certo — dies interpellat pro homine. Ex persona: exige interpelação."},
 {aula:5, f:"Mora x inadimplemento absoluto", b:"Na mora a prestação ainda é útil ao credor. Deixando de sê-lo, o credor pode enjeitá-la e exigir perdas e danos (art. 395, parágrafo único)."},
 {aula:5, f:"Perdas e danos (art. 402)", b:"Dano emergente (o que efetivamente se perdeu) + lucro cessante (o que razoavelmente se deixou de lucrar)."},
 {aula:5, f:"Teoria do dano direto e imediato", b:"Art. 403: mesmo havendo dolo, indenizam-se apenas os prejuízos efetivos e os lucros cessantes por efeito direto e imediato da inexecução."},
 {aula:5, f:"Cláusula penal compensatória x moratória", b:"Compensatória: prefixa perdas e danos do inadimplemento total — alternativa em benefício do credor (art. 410). Moratória: sanciona o atraso e cumula com a obrigação (art. 411)."},
 {aula:5, f:"Limite da cláusula penal", b:"Art. 412: não pode exceder o valor da obrigação principal. Art. 413: o juiz DEVE reduzi-la se houver cumprimento parcial ou excesso manifesto."},
 {aula:5, f:"Arras confirmatórias x penitenciais", b:"Confirmatórias: quem deu e se arrepende perde-as; quem recebeu devolve em dobro (art. 418). Penitenciais: indenização única, sem perdas e danos suplementares (art. 420)."},
 {aula:5, f:"Dação em pagamento x novação", b:"Dação: o credor aceita coisa diversa e a obrigação se extingue no ato. Novação: cria-se NOVA obrigação, exigindo animus novandi (art. 361)."},
 {aula:5, f:"Compensação x confusão", b:"Compensação: DUAS obrigações recíprocas que se anulam. Confusão: UMA obrigação, com credor e devedor reunidos na mesma pessoa."},
 {aula:5, f:"Requisitos da compensação", b:"Dívidas líquidas, vencidas e de coisas fungíveis entre as mesmas pessoas (art. 369)."},
 {aula:5, f:"Cessão de crédito x assunção de dívida", b:"Cessão de crédito: basta notificar o devedor (art. 290). Assunção de dívida: exige consentimento EXPRESSO do credor (art. 299)."},
 {aula:5, f:"Adimplemento substancial", b:"Cumprida a obrigação em parte muito significativa, veda-se ao credor a resolução do contrato, restando-lhe a cobrança do saldo. Base: arts. 422 e 187."},
 {aula:2, f:"Fonte imediata das obrigações", b:"A lei. Contratos, atos unilaterais, atos ilícitos e enriquecimento sem causa são fontes mediatas."},
 {aula:2, f:"Cinco fontes mediatas", b:"Contratos, declarações unilaterais de vontade, atos ilícitos, abuso de direito e enriquecimento sem causa."},
 {aula:2, f:"O que diz o art. 854 do CC?", b:"Quem, por anúncios públicos, se comprometer a recompensar quem desempenhe certo serviço ou satisfaça certa condição, fica obrigado a cumprir o prometido."},
 {aula:2, f:"O que é obrigação propter rem?", b:"'Em razão da coisa'. Obrigação ambulatória: vinculada ao bem e que o acompanha na transferência da titularidade."},
 {aula:2, f:"Por que a propter rem é híbrida?", b:"Combina traços de direito real (ligada à coisa, acompanha o bem) e de direito pessoal (impõe dever de prestação)."},
 {aula:2, f:"O que diz o art. 1.345 do CC?", b:"O adquirente de unidade responde pelos débitos do alienante em relação ao condomínio, inclusive multas e juros moratórios."},
 {aula:2, f:"O que estabelece o art. 422?", b:"Os contratantes devem guardar, na conclusão e na execução do contrato, os princípios de probidade e boa-fé."},
 {aula:2, f:"Arts. 186, 187 e 927 — como se ligam?", b:"186 define o ato ilícito; 187, o abuso de direito; 927 estabelece o dever de indenizar, com responsabilidade objetiva no parágrafo único."},
 {aula:2, f:"Escritura pública x registro", b:"A escritura (art. 108) formaliza o negócio; o registro no CRI (art. 1.245) transfere a propriedade perante terceiros."},
 {aula:3, f:"Obrigações positivas e negativas", b:"Positivas: dar e fazer. Negativa: apenas não fazer — a única admitida no ordenamento."},
 {aula:3, f:"O que diz o art. 313 do CC?", b:"O credor não é obrigado a receber prestação diversa da que lhe é devida, ainda que mais valiosa."},
 {aula:3, f:"Princípio da gravitação jurídica (art. 233)", b:"A obrigação de dar coisa certa abrange os acessórios, embora não mencionados, salvo se o contrário resultar do título."},
 {aula:3, f:"Dar coisa certa: perda SEM culpa", b:"Art. 234, 1ª parte: fica resolvida a obrigação para ambas as partes."},
 {aula:3, f:"Dar coisa certa: perda COM culpa", b:"Art. 234, 2ª parte: responde pelo equivalente mais perdas e danos."},
 {aula:3, f:"Dar coisa certa: deterioração SEM culpa", b:"Art. 235: o credor pode resolver a obrigação ou aceitar a coisa, abatido de seu preço o valor que perdeu."},
 {aula:3, f:"Restituir: deterioração SEM culpa", b:"Art. 240: o credor recebe a coisa no estado em que se encontra, sem indenização."},
 {aula:3, f:"O que significa 'equivalente' na lei?", b:"Questão pecuniária — o valor da coisa em moeda corrente."},
 {aula:3, f:"Como se indica a coisa incerta?", b:"Art. 243: ao menos pelo gênero e pela quantidade. A qualidade vem depois, em regra pelo devedor (art. 244)."},
 {aula:3, f:"Genus nunquam perit (art. 246)", b:"Antes da escolha, o devedor não pode alegar perda ou deterioração, ainda que por força maior ou caso fortuito."},
 {aula:3, f:"O que é concentração?", b:"O ato de escolha que transforma a obrigação de dar coisa incerta em obrigação de coisa certa."},
 {aula:3, f:"Obrigação de fazer infungível", b:"Personalíssima (intuitu personae): só o devedor pode cumprir, por cláusula expressa ou pela natureza da prestação. Art. 247."},
 {aula:3, f:"Obrigação de fazer fungível", b:"Pode ser executada por terceiro à custa do devedor, havendo recusa ou mora (art. 249)."},
 {aula:3, f:"Art. 251, parágrafo único", b:"Em caso de urgência, o credor pode desfazer ou mandar desfazer o ato independentemente de autorização judicial."},
 {aula:4, f:"Obrigação simples x composta", b:"Simples: uma só prestação. Composta: pluralidade de prestações — cumulativa, alternativa ou facultativa."},
 {aula:4, f:"Alternativa x cumulativa", b:"Alternativa ('ou'): extingue-se com uma das prestações. Cumulativa ('e'): devem-se todas."},
 {aula:4, f:"Alternativa x facultativa", b:"Alternativa: duas ou mais prestações devidas. Facultativa: uma só devida, com faculdade de substituição apenas pelo devedor."},
 {aula:4, f:"Todas as prestações alternativas impossíveis sem culpa", b:"Art. 256: extingue-se a obrigação."},
 {aula:4, f:"Divisível x indivisível", b:"Divisível: admite cumprimento em partes (art. 257 — presume-se dividida). Indivisível: só integralmente (art. 259 — cada devedor obrigado pela dívida toda)."},
 {aula:4, f:"Indivisível convertida em perdas e danos", b:"Art. 263: perde a indivisibilidade e passa a reger-se pelas normas da obrigação divisível."},
 {aula:4, f:"Solidária convertida em perdas e danos", b:"Art. 271: SUBSISTE a solidariedade. Contraste importante com o art. 263."},
 {aula:4, f:"O que diz o art. 264?", b:"Há solidariedade quando na mesma obrigação concorre mais de um credor ou devedor, cada um com direito ou obrigado à dívida toda."},
 {aula:4, f:"A solidariedade se presume?", b:"Não. Art. 265: resulta da lei ou da vontade das partes."},
 {aula:4, f:"Solidariedade x indivisibilidade", b:"Solidário: devedor do TODO, compelido a pagar sozinho. Indivisível: deve só sua quota, compelido ao todo porque o objeto não se fraciona."},
 {aula:4, f:"Art. 279 — culpa de um devedor solidário", b:"Subsiste para todos o encargo de pagar o equivalente; mas pelas perdas e danos só responde o culpado."},
 {aula:4, f:"Art. 283 — direito de regresso", b:"Quem pagou por inteiro exige de cada codevedor sua quota, dividindo-se igualmente por todos a do insolvente."},
 {aula:4, f:"Art. 284 — o exonerado contribui?", b:"Sim. No rateio, contribuem também os exonerados da solidariedade, pela parte que incumbia ao insolvente."},
 {aula:4, f:"Art. 273 — exceções pessoais", b:"A um dos credores solidários não pode o devedor opor as exceções pessoais oponíveis aos outros."}];
